<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>티라노 화물선 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: 전자칠판을 반으로 나눈 2팀 대결(1팀 연습이면 한 화면) — 각 팀: 목표 무게 → 바다와 화물선 → 실은 무게 식 → 부두 상자 → 출항 버튼. TyranoMath 크림·초록·주황, 바다 하늘색 */
:root{
  color-scheme: light;
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#22314A; --muted:#5D6C83; --line:#ECDFC8;
  --green:#4CB963; --green-d:#2F8A47; --leaf:#E4F5D6;
  --orange:#FF9F43; --orange-d:#D97A1F; --orange-l:#FFE7CC;
  --pink:#FF8FA3; --red:#E5546B; --sky:#DDF0FF; --gold:#FFD43B;
  --sea1:#BFE6FA; --sea2:#7CC8EE; --sea3:#4FA9DA; --wood:#C98A4B; --wood-d:#8A5A2C;
  --shadow:0 6px 0 rgba(34,49,74,.08), 0 14px 30px rgba(34,49,74,.08);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --num:"Fredoka","Jua",system-ui,sans-serif;
  --scale:1;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;display:flex;flex-direction:column;
  word-break:keep-all;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* 팀 색 */
.c0{--d-main:#5CC46F;--d-tail:#4CB963;--d-leg:#3A9D51;--d-belly:#E8F7C8;--d-spike:#FF9F43;--d-line:#2E6B3A;--pc:#4CB963;--pd:#2F8A47;--pl:#E4F5D6;--hull:#4CB963;--hull-d:#2F8A47}
.c1{--d-main:#FFAE5C;--d-tail:#FF9F43;--d-leg:#E0801F;--d-belly:#FFF2DC;--d-spike:#4CB963;--d-line:#8A4A12;--pc:#FF9F43;--pd:#C9671A;--pl:#FFE7CC;--hull:#FF8A3D;--hull-d:#C9671A}
.d-main{fill:var(--d-main)} .d-tail{fill:var(--d-tail)} .d-leg{fill:var(--d-leg)} .d-belly{fill:var(--d-belly)}
.d-spike{fill:var(--d-spike)} .d-eye{fill:#fff;stroke:var(--d-line);stroke-width:2} .d-pupil{fill:var(--ink)}
.d-hl{fill:#fff} .d-cheek{fill:var(--pink);opacity:.65} .d-mouth{fill:none;stroke:var(--d-line);stroke-width:3.5;stroke-linecap:round}
.d-open{fill:#9E2A3A;stroke:var(--d-line);stroke-width:3} .d-brow{fill:none;stroke:var(--d-line);stroke-width:4;stroke-linecap:round}
.d-tail{transform-box:view-box;transform-origin:62px 128px;animation:wag .7s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(12deg)}}

/* ---------- 위쪽 줄 ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:clamp(6px,.8vw,12px) 16px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);color:var(--green-d);font-size:clamp(18px,1.6vw,28px);white-space:nowrap;min-width:0}
.brand svg{width:clamp(34px,2.8vw,48px);height:auto;flex:none}
.brand b{color:var(--orange);font-weight:400}
.brand small{font-size:.8em;color:var(--ink);margin-left:6px}
.center{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 16px;font-family:var(--display);box-shadow:var(--shadow)}
.center .rnd{font-size:clamp(15px,1.2vw,21px);color:var(--muted)}
.center .rnd b{font-family:var(--num);color:var(--ink)}
.center .sc{font-family:var(--num);font-weight:700;font-size:clamp(22px,2vw,36px)}
.center .s0{color:var(--green-d)} .center .s1{color:var(--orange-d)}
.center .vs{color:var(--muted);font-size:clamp(14px,1vw,18px)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:clamp(13px,1vw,17px);color:var(--ink)}
.tool[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.tool.home{background:var(--green);border-color:var(--green-d);color:#fff}

.app{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--teams),minmax(0,1fr));gap:clamp(8px,1vw,16px);padding-block:clamp(6px,.8vh,12px) 2px;padding-inline:16px}

/* ---------- 팀 화면 ---------- */
.half{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;border:4px solid var(--pc);box-shadow:var(--shadow);
  background:linear-gradient(180deg,#E9F7FF 0%,#D5EFFC 40%,var(--sea1) 40%);container-type:size}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1.6cqh 2.4cqw 0}
.tname{display:flex;align-items:center;gap:1cqw;font-family:var(--display);font-size:calc(4.6cqh*var(--scale));color:var(--pd)}
.tname svg{height:7cqh;width:auto}
.stars{font-family:var(--num);font-weight:700;font-size:calc(4.2cqh*var(--scale));background:#fff;border:3px solid var(--line);border-radius:999px;padding:0 1.6cqw}
.target{align-self:center;margin-top:.6cqh;background:#fff;border:4px solid var(--pc);border-radius:20px;padding:.6cqh 3cqw;text-align:center;box-shadow:0 5px 0 var(--pd)}
.target .lab{display:block;font-family:var(--display);font-size:calc(3.4cqh*var(--scale));color:var(--muted)}
.target b{display:block;font-family:var(--num);font-weight:700;font-size:calc(9cqh*var(--scale));line-height:1.05;color:var(--pd)}
.target b small{font-size:.5em;margin-left:.2em}
.sea{position:relative;flex:1;min-height:0}
.waves{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wave 6s linear infinite}
.waves svg.w2{animation-duration:9s;opacity:.7;bottom:12%}
@keyframes wave{to{transform:translateX(-50%)}}
.load.empty .lab{display:none}
.load.empty .expr{text-align:center}
/* 갈매기: 날갯짓하며 날기 · 미끄러지듯 활공 · 배 위에서 콕콕·폴짝 · 출항하면 푸드덕 날아가기 */
.gulls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gull{position:absolute;left:0;width:var(--gw,7cqh);animation:gfly var(--gd,16s) linear infinite;animation-delay:var(--gdl,0s)}
.gull.rtl{animation-name:gflyR}
@keyframes gfly{from{transform:translateX(-12cqw)}to{transform:translateX(112cqw)}}
@keyframes gflyR{from{transform:translateX(112cqw)}to{transform:translateX(-12cqw)}}
.gull .gb{animation:gbob var(--gb,2.4s) ease-in-out infinite}
@keyframes gbob{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-35%) rotate(4deg)}50%{transform:translateY(10%) rotate(-2deg)}75%{transform:translateY(-15%) rotate(3deg)}}
.gull.rtl svg{transform:scaleX(-1)}
.gull svg{display:block;width:100%;height:auto;overflow:visible}
.gull .wl,.gull .wr{transform-box:view-box;transform-origin:30px 16px;animation:flapL var(--gf,.32s) ease-in-out infinite alternate}
.gull .wr{animation-name:flapR}
@keyframes flapL{from{transform:rotate(18deg)}to{transform:rotate(-28deg)}}
@keyframes flapR{from{transform:rotate(-18deg)}to{transform:rotate(28deg)}}
.gull.glide .wl,.gull.glide .wr{animation-duration:1.4s}
.gull.flock{width:var(--gw,4cqh);opacity:.75}
.perch{position:absolute;left:63%;bottom:78.5%;width:7%;z-index:2;transform-origin:50% 100%}
.perch svg{display:block;width:100%;height:auto;overflow:visible}
.perch .ph{transform-box:view-box;transform-origin:30px 20px}
.perch.peck .ph{animation:peck .5s ease-in-out 2}
@keyframes peck{50%{transform:rotate(28deg) translate(2px,4px)}}
.perch.tilt .ph{animation:tilt 1s ease-in-out}
@keyframes tilt{30%,70%{transform:rotate(-18deg)}}
.perch.hop{animation:phop .45s ease-out 2}
@keyframes phop{50%{transform:translateY(-55%)}}
.perch.away{animation:paway 1.4s ease-in forwards}
@keyframes paway{0%{transform:none}20%{transform:translateY(-40%)}100%{transform:translate(-260%,-650%) rotate(-10deg);opacity:0}}
.perch.away .pw{animation:pflap .15s ease-in-out infinite alternate;transform-box:view-box;transform-origin:30px 22px}
@keyframes pflap{to{transform:rotate(-55deg)}}
.perch .say{position:absolute;left:-30%;top:-70%;font-family:var(--display);font-size:3cqh;color:var(--muted);white-space:nowrap;opacity:0}
.perch.squawk .say{animation:sq 1s ease-out}
@keyframes sq{0%{opacity:0;transform:translateY(20%)}20%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30%)}}
.ship{position:absolute;left:50%;bottom:6%;width:min(78cqw,120cqh);aspect-ratio:400/190;transform:translateX(-50%);transform-origin:50% 80%;transition:transform .5s}
.ship > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ship .bob{position:absolute;inset:0;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob{50%{transform:translateY(2.5%) rotate(-1deg)}}
.deck{position:absolute;left:8%;width:62%;bottom:47%;display:flex;flex-wrap:wrap-reverse;align-items:flex-end;justify-content:center;gap:.6cqw;min-height:10%}
.captain{position:absolute;right:9%;bottom:62%;width:17%;z-index:2}
.captain svg{width:100%;height:auto;display:block;overflow:visible}
.captain .hat{position:absolute;left:38%;top:-6%;width:42%;}
.ship.heavy .bob{animation:heavy .9s ease-in-out}
@keyframes heavy{20%{transform:translateY(9%) rotate(-5deg)}45%{transform:translateY(7%) rotate(4deg)}70%{transform:translateY(8%) rotate(-3deg)}100%{transform:none}}
.ship.light .bob{animation:light .9s ease-in-out}
@keyframes light{20%{transform:translateY(-5%) rotate(3deg)}50%{transform:translateY(-2%) rotate(-3deg)}100%{transform:none}}
.ship.sail{animation:sail 2s ease-in forwards}
@keyframes sail{0%{transform:translateX(-50%)}15%{transform:translateX(-52%) rotate(-1deg)}100%{transform:translateX(90%) rotate(1deg)}}
.ship.arrive{animation:arrive 1.1s cubic-bezier(.2,.8,.3,1)}
@keyframes arrive{from{transform:translateX(-190%)}to{transform:translateX(-50%)}}
.ship .smoke{position:absolute;left:66%;top:-8%;font-size:6cqh;opacity:0}
.ship.sail .smoke{animation:smoke .6s ease-out infinite}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-30%,-80%) scale(1.4)}}
.captain.happy svg{animation:cjump .5s ease-in-out 3}
@keyframes cjump{50%{transform:translateY(-22%)}}
.captain.sad svg{animation:cshake .8s ease-in-out}
@keyframes cshake{20%,60%{transform:rotate(-10deg)}40%,80%{transform:rotate(10deg)}}
/* ---------- 애니메이션 6가지 ---------- */
.captain > svg:first-child{transform-origin:50% 100%;animation:cidle 2.4s ease-in-out infinite}
@keyframes cidle{50%{transform:scale(1.03,.97)}}
.captain .d-eye,.captain .d-pupil,.captain .d-hl{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.captain .hat{transform-origin:30% 90%;transition:transform .2s}
.csay{position:absolute;right:96%;bottom:46%;background:#fff;border:3px solid var(--pc);border-radius:14px;padding:0 .5em;font-family:var(--display);
  font-size:calc(4cqh*var(--scale));color:var(--pd);white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 0 rgba(34,49,74,.12);z-index:3}
.csay.show{animation:csay 1.5s ease-out forwards}
@keyframes csay{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.1)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30%)}}
/* ① 쿵! 상자 싣기 */
.captain.nod > svg:first-child{animation:nod .45s ease-out}
@keyframes nod{40%{transform:translateY(8%) rotate(7deg)}}
.crate.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.15,.75)}50%{transform:scale(.92,1.1)}100%{transform:none}}
.ship.thud .bob{animation:thud .4s ease-out}
@keyframes thud{35%{transform:translateY(2.5%)}100%{transform:none}}
.puff{position:fixed;z-index:25;pointer-events:none;font-size:22px;animation:puff .55s ease-out forwards}
@keyframes puff{from{opacity:.9;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-90%) scale(1.3)}}
/* ② 딱 맞아요! */
.ship.ready > .bob > svg{filter:drop-shadow(0 0 10px rgba(255,212,59,.95)) drop-shadow(0 0 22px rgba(255,212,59,.6))}
.ship .sparkle{position:absolute;font-size:5cqh;opacity:0;pointer-events:none}
.ship.ready .sparkle{animation:spk 1.1s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.bt.go.ready{animation:gopulse .7s ease-in-out infinite alternate}
@keyframes gopulse{to{transform:scale(1.05);filter:brightness(1.12)}}
.captain.point > svg:first-child{animation:point .6s ease-in-out 2}
@keyframes point{50%{transform:translateY(-14%) rotate(-6deg)}}
/* ③ 기우뚱 첨벙 (너무 무거움) */
.captain.shock > svg:first-child{animation:cshock .7s ease-out}
@keyframes cshock{15%{transform:translateY(-22%) scale(1.06)}40%{transform:translateX(-8%)}60%{transform:translateX(8%)}100%{transform:none}}
.splash{position:absolute;bottom:22%;font-size:7cqh;pointer-events:none;z-index:4;animation:splash .9s ease-out forwards}
@keyframes splash{0%{transform:translateY(20%) scale(.3);opacity:0}30%{transform:translate(var(--dx),-60%) scale(1.1);opacity:1}100%{transform:translate(calc(var(--dx)*1.6),10%) scale(.8);opacity:0}}
.sweat{position:absolute;left:62%;top:-4%;font-size:4cqh;animation:sweat .9s ease-in forwards;pointer-events:none}
@keyframes sweat{from{opacity:1;transform:none}to{opacity:0;transform:translate(30%,90%)}}
/* ④ 갸우뚱 (모자람) */
.captain.shrug > svg:first-child{animation:shrug 1s ease-in-out}
@keyframes shrug{25%{transform:rotate(-14deg)}50%{transform:rotate(-14deg) translateY(-6%)}75%{transform:rotate(10deg)}100%{transform:none}}
.qmark{position:absolute;left:66%;top:-30%;font-family:var(--display);font-size:7cqh;color:var(--orange-d);animation:qm 1.1s ease-out forwards;pointer-events:none}
@keyframes qm{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.2) rotate(-10deg)}60%{transform:rotate(10deg)}100%{opacity:0}}
/* ⑤ 출항 세리머니 */
.captain.wave > svg:first-child{animation:cjump .5s ease-in-out 3}
.captain.wave .hat{animation:hatwave .45s ease-in-out 4}
@keyframes hatwave{50%{transform:translate(30%,-70%) rotate(30deg)}}
.dolphin{position:absolute;bottom:14%;font-size:9cqh;z-index:3;pointer-events:none;animation:dolphin 1.4s ease-in-out forwards}
@keyframes dolphin{0%{transform:translate(0,60%) rotate(30deg);opacity:0}15%{opacity:1}50%{transform:translate(var(--dx),-120%) rotate(-10deg)}85%{opacity:1}100%{transform:translate(calc(var(--dx)*2),60%) rotate(-50deg);opacity:0}}
.fw{position:absolute;font-size:8cqh;z-index:3;pointer-events:none;animation:fw 1.2s ease-out forwards}
@keyframes fw{0%{transform:translateY(120%) scale(.2);opacity:0}40%{transform:translateY(0) scale(.6);opacity:1}70%{transform:scale(1.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.streak{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:17;font-family:var(--display);font-size:calc(5.4cqh*var(--scale));color:#fff;
  background:linear-gradient(90deg,#FF7A1A,#FFB020);border-radius:999px;padding:.4cqh 3cqw;box-shadow:var(--shadow);animation:bub 2s ease-out forwards;white-space:nowrap}
/* ⑥ 아쉬운 눈물 */
.captain.cry > svg:first-child{animation:sob .5s ease-in-out 4}
@keyframes sob{50%{transform:translateY(4%) scale(1.02,.96)}}
.tear{position:absolute;top:24%;font-size:3.6cqh;pointer-events:none;animation:tear .8s ease-in infinite}
@keyframes tear{from{opacity:1;transform:none}to{opacity:0;transform:translateY(160%)}}
/* 새 배 도착: 경례 */
.captain.salute .hat{animation:salute .9s ease-in-out}
@keyframes salute{30%,70%{transform:rotate(-22deg) translateY(-18%)}}
.half .stamp{align-items:end;padding-bottom:24cqh}
.half .stamp div{padding:1.2cqh 4cqw}

/* 실은 무게 */
.load{margin:0 2.4cqw;background:#fff;border:3px solid var(--line);border-radius:18px;padding:.6cqh 1.6cqw;display:flex;align-items:center;gap:1.4cqw;min-height:7cqh}
.load .lab{font-family:var(--display);font-size:calc(3.4cqh*var(--scale));color:var(--muted);white-space:nowrap}
.load .expr{flex:1;min-width:0;font-family:var(--num);font-weight:700;font-size:calc(4.6cqh*var(--scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load .expr .op{color:var(--orange)}
.load .sum{font-family:var(--num);font-weight:700;font-size:calc(5.4cqh*var(--scale));padding:0 1.2cqw;border-radius:12px;background:var(--bg);white-space:nowrap}
.load.exact .sum{background:var(--green);color:#fff}
.load.over .sum{background:var(--red);color:#fff}
.gauge{height:1.4cqh;margin:.6cqh 2.4cqw 0;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;border:2px solid #fff}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--pc),var(--gold));transition:width .25s}
.gauge.over i{background:var(--red)}

/* 부두와 상자 */
.dock{position:relative;margin-top:1cqh;padding:1.4cqh 2cqw 2.2cqh;background:
  repeating-linear-gradient(90deg,var(--wood) 0 7cqw,#B97C40 7cqw calc(7cqw + 3px)),var(--wood);border-top:5px solid var(--wood-d);
  display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:1.2cqw;align-items:end}
.dock::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.2cqh;background:var(--wood-d)}
.slot{display:grid;place-items:end center;min-height:var(--cs)}
.crate{--cs:min(14cqh,10.5cqw);width:var(--cs);aspect-ratio:1;border-radius:14%;border:none;padding:0;position:relative;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(135deg,transparent 46%,rgba(138,90,44,.35) 46% 54%,transparent 54%),linear-gradient(45deg,transparent 46%,rgba(138,90,44,.35) 46% 54%,transparent 54%),var(--cc,#E8B46A);
  box-shadow:inset 0 0 0 4px rgba(138,90,44,.55),0 5px 0 rgba(90,56,24,.45);display:grid;place-items:center}
.crate .tag{background:#fff;border-radius:10px;padding:.1em .35em;font-family:var(--num);font-weight:700;color:var(--ink);font-size:calc(var(--cs)*.3*var(--scale));line-height:1.05;
  box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap;text-align:center}
.crate .tag small{display:block;font-size:.5em;color:var(--muted)}
.crate.long .tag{font-size:calc(var(--cs)*.24*var(--scale))}
.crate:active{transform:translateY(3px)}
.deck .crate{--cs:min(11cqh,8.4cqw)}
/* 좁은 화면(스마트폰·세로 패드): 상자를 두 줄로 크게 */
@container (max-width:620px){
  .dock{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:1.2cqh}
  .crate{--cs:min(11cqh,19cqw)}
  .deck .crate{--cs:min(8cqh,12cqw)}
  .load .lab{display:none}
}
.crate.fly{z-index:20;pointer-events:none}

/* 버튼 */
.btns{display:flex;gap:1.6cqw;padding:1.2cqh 2.4cqw 1.6cqh;background:var(--wood-d)}
.bt{border:3px solid rgba(0,0,0,.15);border-radius:16px;font-family:var(--display);font-size:calc(4.4cqh*var(--scale));padding:.8cqh 2cqw;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}

}

/* ---------------- 문제 만들기 (무게는 소수 상자 때문에 0.1kg 단위 정수로 저장) ---------------- */
const fmt = t => cfg.mode === 'dec' ? (t/10).toFixed(1).replace(/\.0$/, '') : String(t/10);
function makePuzzle(){
  for (let tries = 0; tries < 500; tries++){
    let crates = [], need;
    if (cfg.mode === 'easy'){ crates = Array.from({length:6}, () => ({w:ri(1,9)*10})); need = ri(2,3); }
    else if (cfg.mode === 'two'){ crates = Array.from({length:7}, () => ({w:ri(5,49)*10})); need = ri(2,3); }
    else if (cfg.mode === 'double'){ crates = [1,2,4,8,16,32,64].map(v => ({w:v*10})); need = ri(2,4); }
    else if (cfg.mode === 'mul'){ crates = Array.from({length:6}, () => { const a = ri(2,9), b = ri(2,9); return {w:a*b*10, lab:`${a}×${b}`}; }); need = 2; }
    else { crates = Array.from({length:6}, () => ({w:ri(5,95)})); need = ri(2,3); }
    const idx = shuffle(crates.map((_,i) => i)).slice(0, need);
    const target = idx.reduce((s,i) => s + crates[i].w, 0);
    if (crates.some(c => c.w === target)) continue;
    if (cfg.mode === 'easy' && target > 200) continue;
    return {target, crates:crates.map((c,i) => ({...c, id:i}))};
  }
}
const crateLabel = c => c.lab ? `${c.lab}<small>kg</small>` : `${fmt(c.w)}<small>kg</small>`;
const CRATE_COLORS = ['#F2C27B','#EBB36B','#F5CF8E','#E3A85E','#F0BD74','#E9B977','#F6D49B'];

/* ---------------- 소리 ---------------- */
let ac = null, soundOn = true;
function ensureAudio(){ if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, dur, type='sine', vol=.12, when=0, f2){
  if (!soundOn || !ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.03);
}
const sfx = {
  load: () => { tone(520,.08,'triangle',.08); tone(180,.12,'square',.04,.08); },
  unload: () => tone(400,.08,'triangle',.06,0,260),
  horn: () => { tone(196,.9,'sawtooth',.07); tone(147,.9,'sawtooth',.05); },
  bad: () => tone(170,.28,'square',.05),
  thud: () => tone(120,.14,'square',.05,0,70),
  ready: () => [880,1175].forEach((f,i)=>tone(f,.12,'triangle',.08,i*.08)),
  splash: () => { tone(500,.4,'sawtooth',.04,0,120); tone(900,.25,'square',.03,.05,200); },
  pop: () => tone(1400,.12,'triangle',.05,0,600),
  gull: () => { tone(1500,.12,'triangle',.04,0,1100); tone(1600,.14,'triangle',.035,.16,1150); },
  round: () => [523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.1,i*.1)),
  win: () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.14,i*.12)),
};

/* ---------- 선장 티라노 동작 ----------
   ① 쿵! 상자 싣기(끄덕) ② 딱 맞아요!(배가 반짝, 출항 버튼 두근두근) ③ 기우뚱 첨벙(너무 무거움)
   ④ 갸우뚱(모자람) ⑤ 출항 세리머니(모자 흔들기·돌고래·불꽃놀이) ⑥ 아쉬운 눈물(진 팀) + 새 배 도착 경례, 대기 중 숨쉬기·눈 깜빡 */
const CAP = {
  nod:{face:'base', ms:450}, point:{face:'happy', ms:1200}, shock:{face:'shock', ms:1100}, shrug:{face:'base', ms:1100},
  wave:{face:'happy', ms:2300}, cry:{face:'sad', ms:2300}, salute:{face:'happy', ms:1000}

function setCaptain(t, face){ const c = $('#cap'+t); if (c.dataset.face === face) return; c.dataset.face = face; c.querySelector('svg').outerHTML = dinoSvg(t, face); }

  c._t = setTimeout(() => { c.className = 'captain'; setCaptain(t, G.teams[t] && G.teams[t].ready ? 'happy' : 'base'); }, a.ms);

function seaFx(t, cls, txt, style, ms){

function capFx(t, cls, txt, style, ms){

function puffAt(el){
  if (reduced) return;
  const r = el.getBoundingClientRect();
  [-1,1].forEach(d => { const p = document.createElement('span'); p.className = 'puff'; p.textContent = '💨'; p.style.left = (r.left + r.width/2 + d*r.width*.45) + 'px'; p.style.top = (r.bottom - 6) + 'px';
    p.style.setProperty('--dx', (d*30) + 'px'); if (d < 0) p.style.transform = 'scaleX(-1)'; document.body.appendChild(p); setTimeout(() => p.remove(), 600); });
}
function updateReady(t){
  const T = G.teams[t], sum = T.onShip.reduce((s,id) => s + G.puzzle.crates[id].w, 0), now = sum === G.puzzle.target && sum > 0;
  $('#ship'+t).classList.toggle('ready', now); $('#go'+t).classList.toggle('ready', now);
  if (now && !T.ready){ T.ready = true; capAct(t, 'point', '딱 맞아요! 출항해요!'); sfx.ready(); }
  else if (!now && T.ready){ T.ready = false; setCaptain(t, 'base'); }
}
function renderLoad(t){
  const T = G.teams[t], p = G.puzzle, sum = T.onShip.reduce((s,id) => s + p.crates[id].w, 0);
  const ex = $('#ex'+t);
  ex.innerHTML = T.onShip.length ? T.onShip.map(id => { const c = p.crates[id]; return c.lab ? `(${c.lab})` : fmt(c.w); }).join(' <span class="op">+</span> ') : '<span style="color:var(--muted);font-family:var(--display);font-weight:400">상자를 터치해 실어요</span>';
  $('#sum'+t).textContent = (T.onShip.length && p.crates.some(c => c.lab) ? '= ' : '') + fmt(sum) + 'kg';
  const L = $('#load'+t); L.classList.toggle('exact', sum === p.target && sum > 0); L.classList.toggle('over', sum > p.target); L.classList.toggle('empty', !T.onShip.length);
  $('#gb'+t).style.width = Math.min(100, sum / p.target * 100) + '%'; $('#gg'+t).classList.toggle('over', sum > p.target);

function flyCrate(btn, dest){
  const r0 = btn.getBoundingClientRect();
  dest.appendChild(btn);
  const r1 = btn.getBoundingClientRect();
  if (reduced) return;
  const dx = r0.left - r1.left, dy = r0.top - r1.top, s = r0.width / r1.width;
  btn.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:`translate(${dx*.5}px,${dy*.5 - 40}px) scale(${(s+1)/2})`,offset:.5},{transform:'none'}],
    {duration:380, easing:'cubic-bezier(.3,.7,.4,1)'});
}
function tapCrate(t, id){
  const T = G.teams[t]; if (!T || T.lock || G.over) return;
  ensureAudio();
  const btn = $(`#h${t} .crate[data-id="${id}"]`);
  const k = T.onShip.indexOf(id);
  if (k < 0){
    T.onShip.push(id); flyCrate(btn, $('#deck'+t)); sfx.load();
    setTimeout(() => { if (!btn.isConnected) return; btn.classList.remove('land'); btn.offsetWidth; btn.classList.add('land'); puffAt(btn);
      const sh = $('#ship'+t); sh.classList.remove('thud'); sh.offsetWidth; sh.classList.add('thud'); sfx.thud();
      if (Math.random() < .5) perchAct(t, 'hop'); }, reduced ? 0 : 360);
    if (!T.ready) capAct(t, 'nod');
  }
  else { T.onShip.splice(k,1); flyCrate(btn, $(`#dock${t} [data-slot="${id}"]`)); sfx.unload(); }
  renderLoad(t); updateReady(t);
}
function unloadAll(t){
  const T = G.teams[t]; if (!T || T.lock || G.over) return;
  [...T.onShip].forEach(id => tapCrate(t, id));
}
function bubble(t, text, good){

  $('#h'+t).appendChild(b); setTimeout(() => b.remove(), 1600);
}
async function launch(t){
  const T = G.teams[t]; if (!T || T.lock || G.over) return;
  ensureAudio();
  const p = G.puzzle, sum = renderLoad(t), ship = $('#ship'+t), gen = G.gen;
  if (!T.onShip.length){ bubble(t, '상자를 먼저 실어요!'); return; }
  if (sum !== p.target){
    T.miss++; sfx.bad();
    const diff = Math.abs(sum - p.target);
    ship.classList.remove('heavy','light'); ship.offsetWidth; ship.classList.add(sum > p.target ? 'heavy' : 'light');
    bubble(t, sum > p.target ? `너무 무거워요! ${fmt(diff)}kg 넘쳐요` : `아직 ${fmt(diff)}kg 모자라요`);
    if (sum > p.target){
      capAct(t, 'shock', '으악, 가라앉아요!'); capFx(t, 'sweat', '💦', '', 900); sfx.splash();
      [[-14,'30%'],[14,'62%'],[-8,'46%']].forEach(([dx,l],k) => setTimeout(() => seaFx(t, 'splash', '💦', `left:${l};--dx:${dx}cqw`, 900), k*120));
    } else {

    }

    await sleep(1200); if (gen !== G.gen) return;
    T.lock = false; $('#h'+t).classList.remove('lock');
    return;
  }

  T.streak = (T.streak || 0) + 1; G.teams.forEach((U,u) => { if (u !== t) U.streak = 0; });

  if (T.streak >= 2){ const s = document.createElement('div'); s.className = 'streak'; s.textContent = `🔥 ${T.streak}연속 출항!`; $('#h'+t).appendChild(s); setTimeout(() => s.remove(), 2000); }

  G.teams.forEach((U,u) => { if (u !== t){ capAct(u, 'cry', '흑흑, 다음엔 꼭!'); [[38,0],[56,.3]].forEach(([l,d]) => capFx(u, 'tear', '💧', `left:${l}%;animation-delay:${d}s`, 2300)); stamp(u, '아쉬워요!', `${cfg.names[t]}${josa(cfg.names[t])} 먼저 출항했어요`, true); } });
  confettiIn($('#h'+t));

function josa(w){ const c = w.charCodeAt(w.length-1); if (c < 0xAC00 || c > 0xD7A3) return '이(가)'; return (c-0xAC00)%28 ? '이' : '가'; }

function confettiIn(el){
  if (reduced) return;
  const r = el.getBoundingClientRect();
  for (let k = 0; k < 24; k++){
    const s = document.createElement('span');
    s.textContent = pick(['🎉','⭐','✨','🎊']);
    s.style.cssText = `position:fixed;left:${r.left + r.width*Math.random()}px;top:${r.top + r.height*.25}px;font-size:${20+Math.random()*16}px;z-index:25;pointer-events:none`;
    document.body.appendChild(s);
    s.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${r.height*.6*Math.random()+60}px) rotate(${ri(-180,180)}deg)`,opacity:0}],{duration:1400+Math.random()*600,easing:'ease-in'}).onfinish = () => s.remove();
  }
}
function confetti(){
  if (reduced) return;
  const colors = ['#5CC46F','#FF9F43','#7CC8EE','#F7CB3A','#FFFFFF'];
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.hidden = false; c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const parts = Array.from({length:170}, () => ({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3.5,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.3, w:7+Math.random()*7, h:4+Math.random()*5, c:pick(colors)}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if (t - t0 < 4200) requestAnimationFrame(frame); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden = true; }
  })(t0);
}

/* ---------------- 설정 화면 ---------------- */
const conv = (v,t) => t === 'num' ? Number(v) : v;
function syncSetup(){
  document.querySelectorAll('.chips[data-key]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', cfg[g.dataset.key] === conv(b.dataset.v, g.dataset.type))));
  $('#nl1').hidden = cfg.teams === 1;
  const p = makePuzzle();
  $('#example').innerHTML = `<span>예시</span><span class="ex-c">${p.crates.map(c => `<span class="mini">${c.lab || fmt(c.w)}kg</span>`).join('')}</span><span>→ 목표</span><span class="tg">${fmt(p.target)}kg</span>`;
}
document.querySelectorAll('.chips[data-key]').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; cfg[g.dataset.key] = conv(b.dataset.v, g.dataset.type); saveCfg(); syncSetup();
}));
[0,1].forEach(i => { const inp = $('#nm'+i); inp.value = cfg.names[i]; inp.addEventListener('input', () => { cfg.names[i] = inp.value.trim() || ['초록팀','주황팀'][i]; saveCfg(); }); });
$('#btnStart').addEventListener('click', () => { ensureAudio(); newGame(); });
$('#btnAgain').addEventListener('click', newGame);
const goHome = () => { G.gen++; G.over = true; clearInterval(G.timerId); $('#endOv').hidden = true; $('#setup').hidden = false; syncSetup(); };
$('#btnEndSetup').addEventListener('click', goHome);
$('#btnHome').addEventListener('click', goHome);
$('#btnSound').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); if (soundOn) ensureAudio(); });
$('#btnFull').addEventListener('click', () => {
  try { if (document.fullscreenElement) document.exitFullscreen();
    else { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(()=>{}); } } catch(e){}
});

/* ---------------- 기기별 화면: 항상 자동으로 맞춰요 ---------------- */
function detectDevice(){
  const w = window.innerWidth, touch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  if (w < 640) return 'phone';
  if (touch && w >= 1600) return 'board';
  if (touch) return 'pad';
  return 'pc';
}
function applyMode(){
  const actual = detectDevice(), root = document.documentElement;
  root.dataset.device = actual;
  root.dataset.layout = (actual === 'phone' || innerHeight > innerWidth * 1.05) ? 'stack' : 'wide';
  root.style.setProperty('--scale', 1);
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(applyMode, 150); });

/* 첫 화면: 배와 상자가 놓인 장면 위에 설정 창 */
applyMode(); syncSetup();
G.teams = Array.from({length:cfg.teams}, () => ({score:0, miss:0, wins:[], onShip:[], lock:false}));
buildHalves(); setupRound(); G.over = true;
})();

try { if (window.top === window) document.getElementById('btnZone').hidden = false; } catch (e) {}
</script>
