<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티라노 덧셈 먹이 주기 · TyranoMath</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/tyrano-quiz.css">
<style>
/* 🍖 고기 모양 보기 */
.tq-choices{width:min(900px,100%)}
.tq-choice.meat{position:relative; background:none; border:0; box-shadow:none; padding:0; min-height:0; aspect-ratio:1.3}
.tq-choice.meat svg{width:100%; height:100%; max-height:none; filter:drop-shadow(0 6px 0 rgba(0,0,0,.14)); transition:transform .1s}
.tq-choice.meat:active svg{transform:scale(.92)}
.tq-choice.meat span{position:absolute; inset:0; display:grid; place-items:center; padding-right:18%;
  font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(26px, 7vmin, 80px); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tq-choice.meat.ok{background:none; box-shadow:none; animation:tq-eaten .6s ease forwards}
.tq-choice.meat.ok svg{filter:drop-shadow(0 0 10px #4CB963) drop-shadow(0 0 4px #4CB963)}
.tq-choice.meat.bad{background:none}
.tq-choice.meat.bad svg{filter:grayscale(.7) drop-shadow(0 6px 0 rgba(0,0,0,.14))}
@keyframes tq-eaten{30%{transform:scale(1.12)}100%{transform:translateX(-30%) scale(.2); opacity:0}}
</style>
</head>
<body>
<script src="engine/tyrano-quiz.js"></script>
<script>
/* 🍖 티라노 덧셈 먹이 주기 — 1~2학년 · 수와 연산
   10까지 / 20까지 / 100까지 덧셈. 정답이 적힌 고기를 골라 티라노에게 먹여요. */
const { rnd, shuffle } = TyranoQuiz;
const meatSVG = color => `<svg viewBox="0 0 130 100"><ellipse cx="55" cy="50" rx="50" ry="40" fill="${color}"/><ellipse cx="50" cy="45" rx="34" ry="24" fill="rgba(255,255,255,.18)"/><rect x="95" y="42" width="26" height="16" rx="6" fill="#FFF3DD"/><circle cx="122" cy="40" r="8" fill="#FFF3DD"/><circle cx="122" cy="60" r="8" fill="#FFF3DD"/></svg>`;
const COLORS = ['#E8664F', '#D9534F', '#C8553D'];

TyranoQuiz.start({
  title: '티라노 덧셈 먹이 주기',
  rankId: 'tyrano-plus',
  emoji: '🍖',
  intro: '배고픈 티라노에게 덧셈의 정답이 적힌 고기를 골라 주세요! 60초 동안 몇 개를 먹일 수 있을까요?',
  time: 60,
  scoreIcon: '🍖',
  accent: '#FF9F43',
  bg: ['#DDF0FF', '#CDEBB4'],
  endTitle: '크앙~ 배불러요! 🦖',
  startMsg: '배고픈 티라노에게 정답 고기를 주세요!',
  cheers: ['냠냠! 맛있어요!', '정답! 크앙~', '최고예요! 🦖', '꿀꺽! 더 주세요!'],
  levels: [
    { label: '10까지', value: 10, rankKey: '10' },
    { label: '20까지', value: 20, rankKey: '20' },
    { label: '100까지', value: 100, rankKey: '100' }
  ],
  make(max) {
    let a, b;
    if (max === 10) { a = rnd(0, 9); b = rnd(1, 10 - a); }
    else if (max === 20) { a = rnd(3, 15); b = rnd(2, 20 - a); }
    else { a = rnd(10, 80); b = rnd(5, 99 - a); }
    const ans = a + b, opts = new Set([ans]);
    while (opts.size < 3) { const w = ans + rnd(-4, 4); if (w >= 0 && w !== ans) opts.add(w); }
    return {
      q: `<span class="big">${a} + ${b} = <span class="qm">?</span></span>`,
      answer: String(ans),
      choices: shuffle([...opts]).map((n, i) => ({ key: String(n), html: `${meatSVG(COLORS[i])}<span>${n}</span>`, cls: 'meat' })),
      explain: `${a} + ${b} = ${ans}이에요.`
    };
  }
});
</script>
</body>
</html>
