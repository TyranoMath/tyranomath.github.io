<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>수영장 분수 채우기 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g2{grid-template-columns:repeat(2,1fr)}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}

#game{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 0,#d8f3ec 0,transparent 60%),linear-gradient(rgba(31,157,143,.06) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(31,157,143,.06) 1px,transparent 1px) 0 0/28px 28px,#eef9f5}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:var(--accent-dark);font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#26387f,#1b2862);color:#fff;border:3px solid #fff;border-radius:.9em;padding:.2em 1.4em .3em;box-shadow:0 .25em 0 #a8b9d6}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.25em;color:#ffd23f;white-space:nowrap}.rnd small{font-size:.75em;white-space:nowrap}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
.tbs .tb.on{background:#fff3c4;border-color:#f0cf86}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:42px;height:42px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.15em .7em}.gbar{gap:6px;padding-left:8px;padding-right:8px}}

.main{flex:1;min-height:0;display:flex;padding:4px 12px max(12px,env(safe-area-inset-bottom))}
.bwrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none;border:6px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px var(--accent-line),0 10px 28px rgba(31,110,100,.18);background:#cfeefb}
#pool{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#pool text{font-family:var(--title)}
#pool .hit{cursor:pointer}
#pool .btn{cursor:pointer}
#pool .btn:active .face{transform:translateY(3px)}
#pool .btn .face{transition:transform .08s}
#pool .btn.dis{opacity:.45;cursor:default}
.sel{fill:#ffd23f;fill-opacity:.16;stroke:#ffd23f;stroke-width:5;stroke-dasharray:14 10;animation:ants 1s linear infinite}
@keyframes ants{to{stroke-dashoffset:-24}}
.knob{transition:fill .2s}
.fau.on .knob{fill:#ff4f5e}
.fau.on .glow{opacity:1}
.fau .glow{opacity:0;transition:opacity .2s}
.stream{stroke-dasharray:10 8;animation:flow .25s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.wv{animation:wv 1.6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(-24px)}}
#valveG{transform-box:fill-box;transform-origin:center}
#valveG.spin{animation:spin 1.6s cubic-bezier(.4,0,.3,1)}
@keyframes spin{to{transform:rotate(720deg)}}
#leverG{transform-box:fill-box;transform-origin:50% 98%}
#leverG.pull{animation:pull 1s ease-in-out}
#leverG.nudge{animation:nudge .5s ease-in-out 3}
@keyframes pull{30%,70%{transform:rotate(-55deg)}}
@keyframes nudge{50%{transform:rotate(-14deg)}}
.lab{fill:#fff;font-size:24px;text-anchor:middle;opacity:.95}
.secl{font-size:30px;text-anchor:middle;fill:#fff;stroke:#1b4f78;stroke-width:6px;paint-order:stroke;pointer-events:none}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(-4deg)}}
.splash{fill:none;stroke:#fff;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:spl 1s ease-out forwards}
@keyframes spl{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
.bub{fill:#fff;opacity:.7;animation:bub 1.8s ease-in infinite}
@keyframes bub{to{transform:translateY(-120px);opacity:0}}
.cloud{animation:cl 6s ease-in-out infinite alternate}
@keyframes cl{to{transform:translateX(40px)}}
.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

.done{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.96);border:4px solid #ffd23f;
  border-radius:18px;padding:12px 28px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:dpop .5s cubic-bezier(.3,1.5,.6,1);text-align:center;z-index:5}
.done.hide{display:none}
.done b{font-family:var(--title);font-weight:400;font-size:clamp(24px,4vmin,44px);color:#e9852a}
.done span{font-weight:800;color:var(--ink);font-size:clamp(14px,2vmin,22px)}
.dstars{font-size:clamp(22px,3.5vmin,38px)}
.done button{min-height:46px;font-size:18px;padding:0 24px}
@keyframes dpop{from{transform:translateX(-50%) scale(.5);opacity:0}}
.toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;color:#fff;z-index:60;
  font-family:var(--title);font-size:clamp(22px,3.6vmin,40px);line-height:1.2;padding:.3em .9em;border-radius:1em;transition:transform .25s,opacity .25s;max-width:92vw}
.toast small{display:block;font-family:inherit;font-size:.6em}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.ok{background:rgba(46,190,110,.95);border:3px solid #fff}.toast.no{background:rgba(255,95,95,.95);border:3px solid #fff}.toast.info{background:rgba(40,60,140,.95);border:3px solid #fff}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
/* ---------- 모달 / 결과 ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);
  width:min(100%,calc(var(--ui)*34));max-height:100%;overflow:auto;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}
.modal .actions button{flex:1}
.res{display:flex;flex-direction:column;gap:.5em;text-align:left}
.rrow{display:flex;align-items:center;gap:.7em;border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:calc(var(--ui)*.8);padding:.5em .7em;background:#fff}
.rrow.first{background:#fff8e1;border-color:#ffd56b;border-left-color:var(--pc)}
.medal{font-size:1.8em;width:1.3em;text-align:center;flex:none}
.rname{font-weight:800;font-size:1.05em}
.rstat{font-size:.8em;color:var(--muted);margin-top:.15em}
.rscore{margin-left:auto;font-family:var(--title);font-size:1.6em;color:var(--accent-dark);white-space:nowrap}
.wrongs{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.35em}
.wrongs span{font-size:.75em;background:#ffecec;color:#c23b3b;border-radius:99px;padding:.1em .55em;font-weight:700}
.stars{font-size:2.2em;letter-spacing:.1em;margin:.1em 0 .3em}
.windino{width:calc(var(--ui)*4.5);height:auto}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
#lobby .top-btns .tmr-btn{flex:none}
.zone[hidden]{display:none!important}
</style></head>
<body>
<div id="lobby">
  <div class="lwrap">
    <header class="top">
      <div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 게임존</div><h1>수영장 분수 채우기</h1></div></div>
      <div class="top-btns"><a class="zone" id="zoneBtn" href="../gamezone.html" hidden>← 게임존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div>
    </header>
    <section class="hero" style="background:linear-gradient(120deg,#2f8fe0,#1fb5c9)">
      <div class="plane">🏊</div>
      <div><h2>분수만큼 물을 채워요!</h2>
        <p><b>− +</b> 버튼으로 수영장을 똑같이 나누고, 물을 채울 칸의 <b>수도꼭지</b>를 눌러요. <b>밸브</b>를 돌리면 물이 차요. 틀리면 <b>레버</b>를 당겨 물을 빼고 다시 해 봐요!</p></div>
    </section>
    <section class="card">
      <div class="label">분모 범위</div>
      <div class="grid g3" id="denSeg"><button data-v="6">쉬움<small>분모 2~6</small></button><button data-v="10">보통<small>분모 2~10</small></button><button data-v="12">어려움<small>분모 2~12</small></button></div>
      <div class="label">수영장 나누기</div>
      <div class="grid g2" id="divSeg"><button data-v="self">내가 나누기<small>− + 로 칸 수 정하기</small></button><button data-v="auto">나눠진 수영장<small>칸이 미리 나뉘어 있어요</small></button></div>
      <div class="label">정답 인정</div>
      <div class="grid g2" id="eqSeg"><button data-v="same">분모와 같은 칸 수만<small>3/4 → 4칸 중 3칸</small></button><button data-v="eq">크기가 같으면 정답<small>3/4 = 6/8 도 OK</small></button></div>
    </section>
    <section class="card">
      <div class="label">문제 수 <small>1~30문제</small></div>
      <div class="numrow">
        <button class="nb" data-d="-5">−5</button><button class="nb" data-d="-1">−</button>
        <label class="numbox"><input id="numIn" type="number" inputmode="numeric" min="1" max="30" enterkeyhint="done"><span>문제</span></label>
        <button class="nb" data-d="1">+</button><button class="nb" data-d="5">+5</button>
      </div>
    </section>
    <div class="startrow"><button class="go" id="startBtn">🏊 시작!</button></div>
    <p class="copy">© 2026 TyranoMath 백태진 All rights reserved.</p>
  </div>
</div>

<div id="game" class="hide">
  <div class="gbar"><div class="ttl"><img class="dino" alt=""><span>수영장 분수 채우기</span></div>
    <div class="mid"><div class="rnd"><b id="rndT">문제 1 / 10</b><small id="rndS">⭐ 0</small></div></div>
    <div class="tbs"><button id="hintBtn" class="tb" aria-label="힌트">💡<small>힌트</small></button>
      <button id="homeBtn" class="tb home" aria-label="처음으로">🏠<small>처음으로</small></button>
      <button id="soundBtn" class="tb" aria-label="소리">🔊</button><button class="fsBtn tb" aria-label="전체 화면">⛶<small>전체</small></button></div></div>
  <div class="main">
    <div class="bwrap"><div class="frame"><svg id="pool" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="done hide" id="doneBox"><b id="doneT">정답!</b><span id="doneN"></span><div class="dstars" id="doneS"></div><button class="go" id="nextBtn">다음 문제 ▶</button></div></div></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="overlay hide" id="homeOv"><div class="modal">
  <h2>처음으로 갈까요?</h2><p class="help">지금 하던 게임은 끝나고 설정 화면으로 돌아가요.</p>
  <div class="actions"><button id="homeNo">계속하기</button><button class="primary" id="homeYes">🏠 처음으로</button></div>
</div></div>
<div class="overlay hide" id="resultOv"><div class="modal">
  <img class="windino dino" alt="">
  <h2 id="resTitle">끝!</h2>
  <div class="stars" id="resStars"></div>
  <p class="help" id="resInfo"></p>
  <div class="actions"><button id="setBtn">⚙️ 설정 바꾸기</button><button class="go" id="againBtn">🔁 다시 하기</button></div>
</div></div>

  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;
  const t=a.currentTime;fl.frequency.setValueAtTime(f0,t);fl.frequency.linearRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.1);
  g.gain.setValueAtTime(v,t+d-.25);g.gain.linearRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d);}catch(e){}}

// ---------- 게임 상태 ----------
let G=null,P=null,game={state:'off'},hintOn=false;
function makeList(k){const maxD=+cfg.den;const all=[];for(let d=2;d<=maxD;d++)for(let n=1;n<d;n++)all.push({n,d});
  const out=[];let pool=[];while(out.length<k){if(!pool.length)pool=shuffle(all.slice());
    // 너무 쉬운 1/2 반복을 줄이고 분모가 고루 나오게
    const f=pool.pop();if(out.length&&out[out.length-1].d===f.d&&pool.length>2){pool.unshift(f);continue;}out.push(f);}
  return out;}
function start(){$('lobby').classList.add('hide');$('game').classList.remove('hide');$('resultOv').classList.add('hide');
  layout();drawStatic();bindPanel();G={list:makeList(cfg.num),idx:0,stars:0,tries:0,first:0,t0:performance.now()};game.state='run';fitFrame();setup();TMRank.start(rankLv(),rankName());}
function setup(){const f=G.list[G.idx];let n=1;
  if(cfg.div==='auto'){n=f.d;if(cfg.eq==='eq'&&Math.random()<.5){const ms=[2,3,4].filter(m=>f.d*m<=MAXN);if(ms.length)n=f.d*pick(ms);}}
  P={f,n,sel:new Set(),lv:Array(MAXN).fill(0),state:'idle',tries:0,hint:false};
  $('doneBox').classList.add('hide');$('fx').innerHTML='';
  $('bnN').textContent=f.n;$('bnD').textContent=f.d;
  $('rndT').textContent=`문제 ${G.idx+1} / ${G.list.length}`;$('rndS').textContent=`⭐ ${G.stars}`;
  ['minusB','plusB'].forEach(id=>$(id).classList.toggle('dis',cfg.div==='auto'));
  drawPool();}
function cols(){const a=[];for(let i=0;i<P.n;i++)a.push({x0:xr(i/P.n),x1:xr((i+1)/P.n)});return a;}
function drawPool(){const C=cols();$('nTxt').textContent=P.n;
  // 칸막이
  let ps='';for(let i=1;i<P.n;i++){const t=i/P.n,a=xr(t),b=xf(t);
    ps+=`<polygon points="${a},${T} ${b},${BW} ${b},${BOT} ${a},${BOT}" fill="url(#wedge)" opacity=".85"/><line x1="${b}" y1="${BW}" x2="${b}" y2="${BOT}" stroke="#3a8fbd" stroke-width="2" opacity=".6"/>
     <line x1="${a}" y1="${T}" x2="${a}" y2="${BOT}" stroke="#fff" stroke-width="5"/><line x1="${a+3}" y1="${T}" x2="${a+3}" y2="${BOT}" stroke="#9fd6ec" stroke-width="2"/>`;}
  $('parts').innerHTML=ps;
  // 물
  $('wat').innerHTML=C.map((c,i)=>`<g id="w${i}" style="display:none"><rect class="wr" x="${c.x0}" y="${BOT}" width="${c.x1-c.x0}" height="0" fill="url(#water)"/>
    <rect class="ws" x="${c.x0}" y="${BOT}" width="${c.x1-c.x0}" height="10" fill="#d8f7ff" opacity=".85"/></g>`).join('');
  // 수도꼭지 + 누르는 영역
  const sc=Math.min(1,(C[0].x1-C[0].x0)/80);
  $('faus').innerHTML=C.map((c,i)=>{const cx=(c.x0+c.x1)/2;return `<g class="fau" id="f${i}" transform="translate(${cx},${T}) scale(${sc.toFixed(2)})">
    <circle class="glow" cx="-20" cy="-36" r="20" fill="#ffd23f" opacity="0"/>
    <ellipse cx="-20" cy="-4" rx="14" ry="6" fill="#7d8996"/><path d="M-20,-6 V-48 Q-20,-72 -2,-72 Q16,-72 16,-54 V-40" stroke="#5d6a78" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M-20,-6 V-48 Q-20,-72 -2,-72 Q16,-72 16,-54 V-40" stroke="url(#chrome)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="-38" y="-40" width="18" height="8" rx="4" fill="#9aa6b2"/><circle class="knob" cx="-40" cy="-36" r="10" fill="#b9c4cf" stroke="#5d6a78" stroke-width="2"/></g>`;}).join('');
  $('hits').innerHTML=C.map((c,i)=>`<rect class="hit" data-i="${i}" x="${c.x0}" y="${T-84}" width="${c.x1-c.x0}" height="${BOT-T+84}" fill="transparent"/>`).join('');
  $('hits').querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>toggle(+h.dataset.i)));
  // 기존 칸 수에 맞는 수도꼭지 이동
  $('streams').innerHTML=C.map((c,i)=>`<g id="s${i}" style="display:none"><line x1="${(c.x0+c.x1)/2+16*sc}" y1="${T-40*sc}" x2="${(c.x0+c.x1)/2+16*sc}" y2="${BOT}" stroke="#e8fbff" stroke-width="${12*sc}" opacity=".55" stroke-linecap="round"/>
    <line class="stream" x1="${(c.x0+c.x1)/2+16*sc}" y1="${T-40*sc}" x2="${(c.x0+c.x1)/2+16*sc}" y2="${BOT}" stroke="#7fd6ff" stroke-width="${6*sc}" stroke-linecap="round"/></g>`).join('');
  drawSel();renderWater();}
function drawSel(){const C=cols();
  $('sels').innerHTML=C.map((c,i)=>P.sel.has(i)?`<rect class="sel" x="${c.x0+5}" y="${T+5}" width="${c.x1-c.x0-10}" height="${BOT-T-10}" rx="8"/>`:'').join('');
  C.forEach((c,i)=>$('f'+i).classList.toggle('on',P.sel.has(i)));
  const fs=P.n>=10?24:30;
  $('labs').innerHTML=hintOn?C.map((c,i)=>`<text class="secl" x="${(c.x0+c.x1)/2}" y="${BOT-26}" font-size="${fs}">1/${P.n}</text>`).join('')+
    `<text class="secl" x="600" y="${BW+60}" font-size="34">${P.n}칸 중 ${P.sel.size}칸</text>`:'';
  $('stat').textContent=`수도꼭지 ${P.sel.size}개`;
  $('hintBtn').classList.toggle('on',hintOn);}
function renderWater(){for(let i=0;i<P.n;i++){const g=$('w'+i);if(!g)continue;const y=BOT-(BOT-LEVEL)*P.lv[i];
  if(P.lv[i]<=.002){g.style.display='none';continue;}g.style.display='';const r=g.querySelector('.wr'),s=g.querySelector('.ws');
  r.setAttribute('y',y);r.setAttribute('height',BOT-y);s.setAttribute('y',y);s.setAttribute('height',Math.min(10,BOT-y));
  const st=$('s'+i);if(st)st.querySelectorAll('line').forEach(l=>l.setAttribute('y2',y));}}
const hasWater=()=>P.lv.some(v=>v>.002);
function anim(ms,step,done){const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/ms);step(k);if(k<1)requestAnimationFrame(f);else done&&done();};requestAnimationFrame(f);}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

// ---------- 조작 ----------
const busy=()=>game.state!=='run'||P.state==='fill'||P.state==='drain'||P.state==='solved';
function afterDrain(fn){if(hasWater())drain(fn,true);else fn();}
function toggle(i){if(busy())return;afterDrain(()=>{if(P.sel.has(i))P.sel.delete(i);else P.sel.add(i);sfx.tap();drawSel();});}
function setN(d){if(busy())return;if(cfg.div==='auto'){toast('info','칸이 정해져 있어요','수도꼭지만 골라요');return;}
  const nn=clamp(P.n+d,1,MAXN);if(nn===P.n){sfx.no();return;}
  afterDrain(()=>{P.n=nn;P.sel.clear();sfx.tick();drawPool();});}
function fill(){if(busy())return;
  if(hasWater()){toast('info','물이 이미 있어요','레버를 당겨 물을 먼저 빼요');nudgeLever();return;}
  if(!P.sel.size){toast('info','수도꼭지를 먼저 골라요','물을 채울 칸을 눌러요');return;}
  P.state='fill';const v=$('valveG');v.classList.remove('spin');void v.getBBox();v.classList.add('spin');sfx.fill();
  const idx=[...P.sel];idx.forEach(i=>$('s'+i).style.display='');
  setTimeout(()=>anim(1500,k=>{const v=ease(k);idx.forEach(i=>P.lv[i]=v);renderWater();},()=>{
    idx.forEach(i=>$('s'+i).style.display='none');P.state='full';judge();}),250);}
function drain(fn,quick){if(game.state!=='run'||P.state==='fill'||P.state==='drain'||P.state==='solved')return;
  if(!hasWater()){if(!fn)toast('info','물이 없어요','수도꼭지를 고르고 밸브를 돌려요');fn&&fn();return;}
  P.state='drain';const l=$('leverG');l.classList.remove('pull','nudge');void l.getBBox();l.classList.add('pull');sfx.drain();
  const from=P.lv.slice();anim(quick?600:1000,k=>{for(let i=0;i<MAXN;i++)P.lv[i]=from[i]*(1-ease(k));renderWater();},()=>{P.lv.fill(0);renderWater();P.state='idle';fn&&fn();});}
function nudgeLever(){const l=$('leverG');l.classList.remove('pull','nudge');void l.getBBox();l.classList.add('nudge');}
function judge(){const k=P.sel.size,n=P.n,f=P.f;const same=k*f.d===f.n*n;const ok=same&&(cfg.eq==='eq'||n===f.d);
  if(ok){P.state='solved';const st=Math.max(1,3-P.tries-(P.hint?1:0));G.stars+=st;if(P.tries===0)G.first++;
    sfx.ok();setTimeout(()=>sfx.splash(),500);confetti();dinoJump();
    $('rndS').textContent=`⭐ ${G.stars}`;
    setTimeout(()=>{$('doneT').textContent=pick(['딩동댕! 🎉','정답! 🎉','멋져요! 🎉']);
      $('doneN').textContent=n===f.d?`${n}칸 중 ${k}칸 = ${f.n}/${f.d}`:`${k}/${n} = ${f.n}/${f.d} (크기가 같아요)`;
      $('doneS').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('nextBtn').textContent=G.idx+1>=G.list.length?'결과 보기 🏆':'다음 문제 ▶';$('doneBox').classList.remove('hide');},900);
    return;}
  P.tries++;G.tries++;sfx.no();const fr=$('pool');
  if(same){toast('no','크기는 같아요!',`이번엔 수영장을 ${f.d}칸으로 나눠서 채워 봐요`);}
  else{const more=k*f.d>f.n*n;const g=gcd(k,n);
    let tip=`물이 ${k}/${n}만큼 찼어요`;
    if(cfg.eq==='same'&&n!==f.d)tip+=` · ${f.d}칸으로 나눠 봐요`;
    toast('no',more?'물이 너무 많아요!':'물이 조금 모자라요!',tip);}
  setTimeout(nudgeLever,700);}
function next(){if(!G||P.state!=='solved')return;G.idx++;if(G.idx>=G.list.length){showResult();return;}setup();}
$('nextBtn').onclick=next;

// 티라노가 풍덩!
let dinoN=0;
function dinoJump(){const idx=[...P.sel].sort((a,b)=>a-b);const C=cols();const c=C[idx[Math.floor(idx.length/2)]];const tx=(c.x0+c.x1)/2,ty=LEVEL+70;
  const w=Math.min(220,Math.max(170,(c.x1-c.x0)*2));
  const inner=document.createElementNS(NS,'g');inner.innerHTML=`<g transform="scale(${(w/200).toFixed(3)})">${tyranoSwim('pd'+(++dinoN))}</g>`;
  const wrap=document.createElementNS(NS,'g');wrap.appendChild(inner);$('fx').appendChild(wrap);
  const sx=1120,sy=BOT-60;anim(800,k=>{const x=sx+(tx-sx)*k,y=sy+(ty-sy)*k-260*Math.sin(Math.PI*k);wrap.setAttribute('transform',`translate(${x-w/2},${y-w*.8})`);},()=>{
    inner.setAttribute('class','bob');inner.style.transformBox='fill-box';inner.style.transformOrigin='50% 100%';
    for(let j=0;j<3;j++){const e=document.createElementNS(NS,'ellipse');e.setAttribute('cx',tx);e.setAttribute('cy',ty+4);e.setAttribute('rx',40);e.setAttribute('ry',12);e.setAttribute('class','splash');e.style.animationDelay=j*.18+'s';$('fx').appendChild(e);}
    for(let j=0;j<14;j++){const e=document.createElementNS(NS,'circle');const x=tx+rnd(-60,60);e.setAttribute('cx',x);e.setAttribute('cy',ty-rnd(0,30));e.setAttribute('r',rnd(4,9));e.setAttribute('fill','#e8fbff');
      const vx=(x-tx)*2,vy=-rnd(60,140);$('fx').appendChild(e);anim(700,k=>{e.setAttribute('transform',`translate(${vx*k},${vy*k+260*k*k})`);e.setAttribute('opacity',1-k);},()=>e.remove());}
    // 물방울 거품
    idx.forEach(i=>{const cc=C[i];for(let j=0;j<3;j++){const b=document.createElementNS(NS,'circle');b.setAttribute('cx',rnd(cc.x0+12,cc.x1-12));b.setAttribute('cy',rnd(BOT-120,BOT-20));b.setAttribute('r',rnd(3,7));b.setAttribute('class','bub');b.style.animationDelay=rnd(0,1.8)+'s';$('fx').insertBefore(b,$('fx').firstChild);}});});}

function bindPanel(){$('minusB').addEventListener('click',()=>setN(-1));$('plusB').addEventListener('click',()=>setN(1));
  $('valveB').addEventListener('click',fill);$('leverB').addEventListener('click',()=>drain());}
$('hintBtn').onclick=()=>{if(!G||game.state!=='run')return;hintOn=!hintOn;if(hintOn&&P.state!=='solved')P.hint=true;sfx.tap();drawSel();};
function fitFrame(){const w=$('game').querySelector('.bwrap').getBoundingClientRect();const f=$('game').querySelector('.frame');
  const r=VW/VH,W=Math.min(w.width,w.height*r);f.style.width=W+'px';f.style.height=(W/r)+'px';}
addEventListener('resize',()=>{if(game.state==='off')return;const was=PORT;layout();fitFrame();
  if(was!==PORT&&P&&P.state!=='fill'&&P.state!=='drain'){const f=$('nTxt');drawStatic();bindPanel();$('bnN').textContent=P.f.n;$('bnD').textContent=P.f.d;
    ['minusB','plusB'].forEach(id=>$(id).classList.toggle('dis',cfg.div==='auto'));drawPool();if(P.state==='solved')dinoJump();}});
addEventListener('keydown',e=>{if(game.state!=='run'||!P||!$('homeOv').classList.contains('hide'))return;const k=e.key;
  if(k==='ArrowLeft'||k==='-')setN(-1);else if(k==='ArrowRight'||k==='+'||k==='=')setN(1);
  else if(k===' '||k==='Enter'){e.preventDefault();if(P.state==='solved')next();else fill();}
  else if(k==='Backspace'||k==='Delete'||k==='ArrowDown'){e.preventDefault();drain();}
  else if(/^[0-9]$/.test(k)){const i=k==='0'?9:+k-1;if(i<P.n)toggle(i);}});

function showResult(){game.state='end';const n=G.list.length,avg=G.stars/n;const st=avg>=2.6?3:avg>=1.8?2:1;
  $('resStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('resTitle').textContent=st===3?'수영장 분수 박사!':st===2?'잘했어요!':'끝까지 해냈어요!';
  $('resInfo').textContent=`${n}문제 완료 · 한 번에 맞힌 문제 ${G.first}개 · 모은 별 ⭐ ${G.stars}`;
  $('resultOv').classList.remove('hide');sfx.done();confetti();
  setTimeout(()=>TMRank.finish({level:rankLv(),name:rankName(),value:G.stars,t:Math.round((performance.now()-G.t0)/1000)}),700);
  const detail={type:'tyranomath:fraction-pool-complete',problems:n,firstTry:G.first,stars:G.stars,rating:st};
  try{window.dispatchEvent(new CustomEvent('fraction-pool-complete',{detail}));}catch(e){}
  try{if(window.parent!==window)window.parent.postMessage(detail,'*');}catch(e){}}
function toast(cls,big,small){const t=$('toast');t.className='toast '+cls;t.innerHTML=big+(small?'<small></small>':'');if(small)t.querySelector('small').textContent=small;
  void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1700);}
function confetti(){const cols=['#ff5a6e','#ffd23f','#3d8bff','#3ccf8a','#b56bff'];
  for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(2,98)+'vw';c.style.background=pick(cols);
    c.style.setProperty('--fy',innerHeight*rnd(.8,1.1)+'px');c.style.animationDelay=rnd(0,.5)+'s';c.style.borderRadius=Math.random()<.4?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}}
