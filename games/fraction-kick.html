<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>분수 페널티킥 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g2{grid-template-columns:repeat(2,1fr)}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}

#game{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 0,#d8f3ec 0,transparent 60%),linear-gradient(rgba(31,157,143,.06) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(31,157,143,.06) 1px,transparent 1px) 0 0/28px 28px,#eef9f5}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:var(--accent-dark);font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;gap:.2em;background:linear-gradient(180deg,#26387f,#1b2862);color:#fff;border:3px solid #fff;border-radius:.9em;padding:.2em 1.2em .35em;box-shadow:0 .25em 0 #a8b9d6;max-width:100%}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.25em;color:#ffd23f;white-space:nowrap}
.dots{display:flex;flex-direction:column;gap:3px;align-items:center}
.dots .row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.72em;font-weight:800;white-space:nowrap}
.dots i{width:.85em;height:.85em;border-radius:50%;background:#3a4a8a;border:2px solid #6a7ac0;display:inline-block}
.dots i.g{background:#3ccf8a;border-color:#bff5d6}.dots i.y{background:#ffd23f;border-color:#fff3b0}.dots i.x{background:#ff6b6b;border-color:#ffc4c4}
.dots i.now{box-shadow:0 0 0 2px #fff}
.dots .tm{padding:0 .4em;border-radius:99px}.dots .tm.on{background:rgba(255,255,255,.2);outline:2px solid #ffd23f}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:42px;height:42px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.15em .6em}.gbar{gap:6px;padding-left:8px;padding-right:8px}}

.main{flex:1;min-height:0;display:flex;padding:4px 12px max(12px,env(safe-area-inset-bottom))}
.bwrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none;border:6px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px var(--accent-line),0 10px 28px rgba(31,110,100,.18);background:#5fbf4a}
#pitch{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#pitch text{font-family:var(--title)}
.gseg{cursor:pointer}
.kp{animation:kp 1.6s ease-in-out infinite alternate}
@keyframes kp{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.netshake{animation:ns .6s ease-out}
@keyframes ns{30%{transform:scale(1.025,1.04)}60%{transform:scale(.995)}}
#net{transform-box:fill-box;transform-origin:50% 50%}
.cloud{animation:cl 7s ease-in-out infinite alternate}
@keyframes cl{to{transform:translateX(40px)}}
.flare{animation:fl 1.4s ease-in-out infinite alternate}
@keyframes fl{to{opacity:.55}}
.cele{animation:cele .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes cele{from{transform:translateY(260px)}}
.celeIn{animation:bob .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{to{transform:translateY(-14px) rotate(-3deg)}}
.blink{animation:blk .5s ease-in-out infinite alternate}
@keyframes blk{to{opacity:.25}}
.big{font-size:120px;text-anchor:middle;fill:#ffd23f;stroke:#1b2862;stroke-width:12px;paint-order:stroke;animation:bigin .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes bigin{from{transform:scale(.3);opacity:0}}
.big{transform-box:fill-box;transform-origin:center}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;color:#fff;z-index:60;
  font-family:var(--title);font-size:clamp(22px,3.6vmin,40px);line-height:1.2;padding:.3em .9em;border-radius:1em;transition:transform .25s,opacity .25s;max-width:92vw}
.toast small{display:block;font-family:inherit;font-size:.6em}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.ok{background:rgba(46,190,110,.95);border:3px solid #fff}.toast.no{background:rgba(255,95,95,.95);border:3px solid #fff}.toast.info{background:rgba(40,60,140,.95);border:3px solid #fff}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
#crowd .crow{animation:cidle 2.4s ease-in-out infinite alternate}
@keyframes cidle{to{transform:translateY(-1.5px)}}
#crowd.cheer .crow{animation:chop .26s ease-in-out infinite alternate}
#crowd.cheer .crow:nth-child(2n){animation-delay:.13s}
@keyframes chop{to{transform:translateY(-7px)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flg .5s ease-in-out infinite alternate}
@keyframes flg{to{transform:scaleX(.6) skewY(8deg)}}
.cname{text-anchor:middle;fill:#fff;stroke:#1b2862;stroke-width:8px;paint-order:stroke;animation:bigin .6s .2s cubic-bezier(.3,1.6,.6,1) both;transform-box:fill-box;transform-origin:center}
#celeA{transform-box:fill-box;transform-origin:50% 100%}
.cPop{animation:cpop .48s cubic-bezier(.3,1.5,.6,1) both}
@keyframes cpop{from{transform:translateY(240px)}}
.cJump{animation:cj .5s ease-in-out infinite alternate}
@keyframes cj{to{transform:translateY(-26px) scale(1.02,.98)}}
.cHeart{animation:chh .8s ease-in-out infinite alternate}
@keyframes chh{to{transform:translateY(-10px) scale(1.04)}}
.cDance{animation:cdn .9s ease-in-out infinite}
@keyframes cdn{0%,100%{transform:rotate(-10deg)}25%{transform:translateY(-14px)}50%{transform:rotate(10deg)}75%{transform:translateY(-14px)}}
.cBank{animation:cbk 1.1s ease-in-out infinite alternate}
@keyframes cbk{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-6px)}}
.cPump{animation:cpm .35s ease-in-out infinite alternate}
@keyframes cpm{to{transform:translateY(-6px)}}
.spray{animation:spr .7s ease-out forwards;transform-box:fill-box}
@keyframes spr{to{transform:translate(-30px,-30px);opacity:0}}
.rise{animation:rise 1.7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes rise{to{transform:translateY(-170px) scale(1.3);opacity:0}}
.twinkle{animation:twk .9s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%{transform:scale(0)}40%{transform:scale(1.2)}to{transform:scale(0);opacity:0}}
/* ---------- 모달 / 결과 ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);
  width:min(100%,calc(var(--ui)*34));max-height:100%;overflow:auto;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}
.modal .actions button{flex:1}
.res{display:flex;flex-direction:column;gap:.5em;text-align:left}
.rrow{display:flex;align-items:center;gap:.7em;border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:calc(var(--ui)*.8);padding:.5em .7em;background:#fff}
.rrow.first{background:#fff8e1;border-color:#ffd56b;border-left-color:var(--pc)}
.medal{font-size:1.8em;width:1.3em;text-align:center;flex:none}
.rname{font-weight:800;font-size:1.05em}
.rstat{font-size:.8em;color:var(--muted);margin-top:.15em}
.rscore{margin-left:auto;font-family:var(--title);font-size:1.6em;color:var(--accent-dark);white-space:nowrap}
.wrongs{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.35em}
.wrongs span{font-size:.75em;background:#ffecec;color:#c23b3b;border-radius:99px;padding:.1em .55em;font-weight:700}
.stars{font-size:2.2em;letter-spacing:.1em;margin:.1em 0 .3em}
.windino{width:calc(var(--ui)*4.5);height:auto}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
#lobby .top-btns .tmr-btn{flex:none}
.zone[hidden]{display:none!important}
</style></head>
<body>
<div id="lobby">
  <div class="lwrap">
    <header class="top">
      <div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 게임존</div><h1>분수 페널티킥</h1></div></div>
      <div class="top-btns"><a class="zone" id="zoneBtn" href="../gamezone.html" hidden>← 게임존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div>
    </header>
    <section class="hero" style="background:linear-gradient(120deg,#2fa84f,#1f9d8f)">
      <div class="plane">⚽</div>
      <div><h2>게이지를 채우고 슛!</h2>
        <p>오른쪽 <b>힘 게이지</b>를 문제의 분수만큼 채운 다음, <b>공을 골대 쪽으로 밀어서</b> 차요. 골대를 톡 눌러도 슛! 게이지가 딱 맞으면 골인, 모자라면 공이 굴러가다 멈추고, 넘치면 골대를 넘어가요.</p></div>
    </section>
    <section class="card">
      <div class="label">게임 방법</div>
      <div class="grid g2" id="modeSeg"><button data-v="solo">⚽ 혼자 하기<small>골인할 때까지 다시 차요</small></button><button data-v="team">🏆 두 팀 대결<small>번갈아 한 번씩 차요</small></button></div>
      <div class="label">분모 범위</div>
      <div class="grid g3" id="denSeg"><button data-v="6">쉬움<small>분모 2~6</small></button><button data-v="10">보통<small>분모 2~10</small></button><button data-v="12">어려움<small>분모 2~12</small></button></div>
      <div class="label">힘 게이지 칸</div>
      <div class="grid g2" id="eqSeg"><button data-v="same">분모와 같은 칸<small>2/6 → 6칸 중 2칸</small></button><button data-v="eq">크기가 같은 분수 섞기<small>1/3 → 6칸 중 2칸</small></button></div>
    </section>
    <section class="card">
      <div class="label"><span id="numLab">문제 수</span> <small id="numHint">1~30</small></div>
      <div class="numrow">
        <button class="nb" data-d="-5">−5</button><button class="nb" data-d="-1">−</button>
        <label class="numbox"><input id="numIn" type="number" inputmode="numeric" min="1" max="30" enterkeyhint="done"><span id="numUnit">문제</span></label>
        <button class="nb" data-d="1">+</button><button class="nb" data-d="5">+5</button>
      </div>
    </section>
    <div class="startrow"><button class="go" id="startBtn">⚽ 킥오프!</button></div>
    <p class="copy">© 2026 TyranoMath 백태진 All rights reserved.</p>
  </div>
</div>

<div id="game" class="hide">
  <div class="gbar"><div class="ttl"><img class="dino" alt=""><span>분수 페널티킥</span></div>
    <div class="mid"><div class="rnd"><b id="rndT">문제 1 / 10</b><div class="dots" id="dots"></div></div></div>
    <div class="tbs"><button id="homeBtn" class="tb home" aria-label="처음으로">🏠<small>처음으로</small></button>
      <button id="soundBtn" class="tb" aria-label="소리">🔊</button><button class="fsBtn tb" aria-label="전체 화면">⛶<small>전체</small></button></div></div>
  <div class="main">
    <div class="bwrap"><div class="frame"><svg id="pitch" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg></div></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="overlay hide" id="homeOv"><div class="modal">
  <h2>처음으로 갈까요?</h2><p class="help">지금 하던 경기는 끝나고 설정 화면으로 돌아가요.</p>
  <div class="actions"><button id="homeNo">계속하기</button><button class="primary" id="homeYes">🏠 처음으로</button></div>
</div></div>
<div class="overlay hide" id="resultOv"><div class="modal">
  <img class="windino dino" alt="">
  <h2 id="resTitle">경기 끝!</h2>
  <div class="stars" id="resStars"></div>
  <p class="help" id="resInfo"></p>
  <div class="actions"><button id="setBtn">⚙️ 설정 바꾸기</button><button class="go" id="againBtn">🔁 다시 하기</button></div>
</div></div>

  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=.9;

function setup(){const f=cur();lvl=0;G.tries=0;G.state='ready';G.hint=false;
  clearInterval(celeTimer);$('crowd').classList.remove('cheer');$('cele').innerHTML='';$('fx').innerHTML='';$('hintTxt').setAttribute('opacity',.95);$('aim').innerHTML='';$('kpDive').setAttribute('transform','');$('kpIn').setAttribute('class','kp');
  placeBall(BALLX,L.BY,1,0,1);drawBanner();drawGauge();drawDots();sfx.whistle();}
function drawBanner(){const f=cur(),s=L.bs,w=360*s,h=150*s,x=600-w/2,y=L.by;const t=team()?(turnTeam()?'🔵 2팀 차례':'🔴 1팀 차례'):'게이지를 채워요';
  $('banner').innerHTML=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${22*s}" fill="#1b2862" opacity=".92" stroke="#5fd3f5" stroke-width="${4*s}"/>
   <text x="600" y="${y+34*s}" font-size="${24*s}" text-anchor="middle" fill="#bfe9ff">${t}</text>
   <text x="600" y="${y+84*s}" font-size="${48*s}" text-anchor="middle" fill="#ffd23f">${f.n}</text><rect x="${600-34*s}" y="${y+94*s}" width="${68*s}" height="${5*s}" rx="${2.5*s}" fill="#ffd23f"/>
   <text x="600" y="${y+140*s}" font-size="${48*s}" text-anchor="middle" fill="#ffd23f">${f.d}</text>`;
  $('rndT').textContent=team()?`${Math.floor(G.idx/2)+1}번째 킥 / ${cfg.kicks}`:`문제 ${G.idx+1} / ${G.list.length}`;}
function drawGauge(){const f=cur(),m=f.m,{gx,gy,gw,gh}=L,pad=gw*.12,gap=Math.max(3,gw*.05),sh=(gh-pad*2-gap*(m-1))/m;let s='';
  s+=`<text x="${gx+gw/2}" y="${gy-14}" font-size="${gw*.32}" text-anchor="middle" fill="#fff" stroke="#1b2862" stroke-width="5" paint-order="stroke">힘</text>
   <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="${gw*.2}" fill="#16264f" stroke="#5fd3f5" stroke-width="4"/>`;
  for(let i=0;i<m;i++){const y=gy+gh-pad-(i+1)*sh-i*gap,on=i<lvl;
    s+=`<rect class="gseg" data-i="${i}" x="${gx+pad}" y="${y}" width="${gw-pad*2}" height="${sh}" rx="${Math.min(8,sh/3)}" fill="${on?'url(#gOn)':'#2c4a6e'}" stroke="${on?'#bff3ff':'#3d6390'}" stroke-width="2"/>`;
    if(on)s+=`<rect x="${gx+pad+4}" y="${y+3}" width="${gw-pad*2-8}" height="${Math.max(2,sh*.22)}" rx="2" fill="#fff" opacity=".45" pointer-events="none"/>`;}
  if(G.hint){const k=f.n*m/f.d,y=gy+gh-pad-k*sh-(k-1)*gap-gap/2;s+=`<g class="blink" pointer-events="none"><path d="M${gx-26},${y-12} L${gx-4},${y} L${gx-26},${y+12}Z" fill="#ffd23f" stroke="#1b2862" stroke-width="3"/><line x1="${gx}" y1="${y}" x2="${gx+gw}" y2="${y}" stroke="#ffd23f" stroke-width="5"/></g>`;}
  s+=`<text x="${gx+gw/2}" y="${gy+gh+gw*.42}" font-size="${gw*.36}" text-anchor="middle" fill="#fff" stroke="#1b2862" stroke-width="6" paint-order="stroke">${lvl}/${m}</text>
   <rect id="ghit" x="${gx-20}" y="${gy-10}" width="${gw+40}" height="${gh+20}" fill="transparent" style="cursor:pointer"/>`;
  $('gauge').innerHTML=`<defs><linearGradient id="gOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fd0ff"/><stop offset="1" stop-color="#7ef0ff"/></linearGradient></defs>`+s;}
function drawDots(){const d=$('dots');
  if(!team()){d.innerHTML=`<div class="row">${G.list.map((_,i)=>`<i class="${G.res[i]||''}${i===G.idx?' now':''}"></i>`).join('')}</div>`;return;}
  const row=t=>{let h='';for(let k=0;k<cfg.kicks;k++){const i=k*2+t;h+=`<i class="${G.res[i]||''}${i===G.idx?' now':''}"></i>`;}return h;};
  d.innerHTML=`<div class="row"><span class="tm ${turnTeam()===0?'on':''}">🔴 1팀 ${G.teamGoals[0]}</span>${row(0)}</div><div class="row"><span class="tm ${turnTeam()===1?'on':''}">🔵 2팀 ${G.teamGoals[1]}</span>${row(1)}</div>`;}
function placeBall(x,y,s,rot,shadow){$('ball').setAttribute('transform',`translate(${x},${y}) scale(${s})`);$('ballRot').setAttribute('transform',`rotate(${rot})`);
  const sh=$('bsh'),gy=(shadow===1?y:shadow)+L.BR*s*.85;sh.setAttribute('cx',x);sh.setAttribute('cy',gy);sh.setAttribute('rx',L.BR*.9*s);sh.setAttribute('ry',L.BR*.25*s);}
function anim(ms,step,done){const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/ms);step(k);if(k<1)requestAnimationFrame(f);else done&&done();};requestAnimationFrame(f);}
const eo=k=>1-Math.pow(1-k,3),eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

// ---------- 입력 ----------
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function setLvl(v){v=clamp(v,0,cur().m);if(v!==lvl){lvl=v;sfx.tick();drawGauge();}}
function aimFrom(p){const dx=p.x-BALLX,dy=p.y-L.BY;if(dy>-30)return null;const t=(L.BY-(GT+GB)/2)/(-dy);const len=Math.hypot(dx,dy);
  return {x:clamp(BALLX+dx*t,GL+40,GR-40),y:clamp(GB-40-(len-80)*.35,GT+40,GB-40)};}
function drawAim(p,tg){$('aim').innerHTML=`<line x1="${BALLX}" y1="${L.BY}" x2="${p.x}" y2="${p.y}" stroke="#fff" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" opacity=".9"/>`+
  (tg?`<g opacity=".95"><circle cx="${tg.x}" cy="${tg.y}" r="26" fill="none" stroke="#ffd23f" stroke-width="5"/><circle cx="${tg.x}" cy="${tg.y}" r="5" fill="#ffd23f"/><path d="M${tg.x-38},${tg.y} h20 M${tg.x+18},${tg.y} h20 M${tg.x},${tg.y-38} v20 M${tg.x},${tg.y+18} v20" stroke="#ffd23f" stroke-width="4"/></g>`:'');}
function bindPitch(){let mode=null,id=null;
  svg.onpointerdown=e=>{if(game.state!=='run'||G.state!=='ready')return;const p=toSvg(e);
    const {gx,gy,gw,gh}=L;
    if(p.x>gx-24&&p.x<gx+gw+24&&p.y>gy-14&&p.y<gy+gh+14){mode='g';id=e.pointerId;try{svg.setPointerCapture(id);}catch(_){}gaugeAt(p,true);return;}
    if(Math.hypot(p.x-BALLX,p.y-L.BY)<L.BR*2.3){mode='b';id=e.pointerId;try{svg.setPointerCapture(id);}catch(_){}drawAim(p,null);return;}
    if(p.x>GL&&p.x<GR&&p.y>GT&&p.y<GB+10){shoot({x:clamp(p.x,GL+40,GR-40),y:clamp(p.y,GT+40,GB-40)});}};
  svg.onpointermove=e=>{if(e.pointerId!==id)return;const p=toSvg(e);if(mode==='g')gaugeAt(p,false);else if(mode==='b')drawAim(p,aimFrom(p));};
  const end=e=>{if(e.pointerId!==id)return;const p=toSvg(e);const m=mode;mode=null;id=null;
    if(m==='b'){$('aim').innerHTML='';const tg=aimFrom(p);if(tg&&Math.hypot(p.x-BALLX,p.y-L.BY)>60)shoot(tg);else if(Math.hypot(p.x-BALLX,p.y-L.BY)<20)toast('info','공을 골대 쪽으로 밀어요','또는 골대를 톡 눌러도 돼요');}};
  svg.onpointerup=end;svg.onpointercancel=end;}
let lastTap=-1;
function gaugeAt(p,first){const f=cur(),m=f.m,{gy,gh,gw}=L,pad=gw*.12;const rel=(gy+gh-pad-p.y)/(gh-pad*2);let k=clamp(Math.ceil(rel*m),0,m);
  if(first&&k===lvl&&k===lastTap)k=k-1;// 같은 칸을 다시 누르면 한 칸 내리기
  lastTap=k;setLvl(k);}

// ---------- 슛 ----------
function shoot(tg){if(G.state!=='ready')return;const f=cur();
  if(lvl===0){toast('info','게이지를 먼저 채워요',`${f.n}/${f.d}만큼 칸을 눌러요`);return;}
  G.state='fly';$('aim').innerHTML='';sfx.kick();const cmp=lvl*f.d-f.n*f.m;const B0={x:BALLX,y:L.BY};
  $('kpIn').setAttribute('class','');
  if(cmp===0){const side=Math.abs(tg.x-600)<70?(Math.random()<.5?-1:1):(tg.x>600?-1:1);const ctl={x:(B0.x+tg.x)/2,y:Math.min(B0.y,tg.y)-90};
    diveKeeper(side,false);
    anim(720,k=>{const e=eo(k),u=1-e;const x=u*u*B0.x+2*u*e*ctl.x+e*e*tg.x,y=u*u*B0.y+2*u*e*ctl.y+e*e*tg.y;placeBall(x,y,1-e*.62,k*900,L.BY+(GB+6-L.BY)*e);},()=>{
      const n=$('net');n.classList.remove('netshake');void n.getBBox();n.classList.add('netshake');sfx.goal();goal(tg);});}
  else if(cmp<0){const ratio=(lvl/f.m)/(f.n/f.d);const ex=B0.x+(tg.x-B0.x)*ratio*.88,ey=B0.y+(GB+16-B0.y)*ratio*.88;
    setTimeout(()=>{$('kpIn').setAttribute('class','kp');},500);
    anim(1100,k=>{const e=eo(k);placeBall(B0.x+(ex-B0.x)*e,B0.y+(ey-B0.y)*e,1-e*ratio*.5,k*500*ratio,1);},()=>{sfx.aww();miss('weak');});}
  else{const ratio=(lvl/f.m)/(f.n/f.d);const ex=tg.x,ey=GT-80-Math.min(1,ratio-1)*90;const ctl={x:(B0.x+tg.x)/2,y:GT-160-Math.min(1,ratio-1)*120};
    jumpKeeper();
    anim(850,k=>{const e=eo(k),u=1-e;const x=u*u*B0.x+2*u*e*ctl.x+e*e*ex,y=u*u*B0.y+2*u*e*ctl.y+e*e*ey;placeBall(x,y,1-e*.7,k*1100,L.BY+(GB-20-L.BY)*e);$('ball').setAttribute('opacity',k>.8?1-(k-.8)*4:1);},()=>{
      $('ball').setAttribute('opacity',0);$('bsh').setAttribute('opacity',0);sfx.aww();miss('over');});}}
function diveKeeper(side,save){anim(480,k=>{const e=eo(k);$('kpDive').setAttribute('transform',`translate(${side*170*e},${-40*Math.sin(Math.PI*Math.min(1,k*1.2))+30*e}) rotate(${side*72*e} 110 200)`);});}
function jumpKeeper(){anim(700,k=>{$('kpDive').setAttribute('transform',`translate(0,${-60*Math.sin(Math.PI*k)})`);},()=>$('kpIn').setAttribute('class','kp'));}
const CELES=[{k:'jump',name:'🙌 만세 점프 세리머니!',pose:'fists'},{k:'slide',name:'🦵 무릎 슬라이딩 세리머니!',pose:'kneel'},
  {k:'plane',name:'✈️ 비행기 세리머니!',pose:'plane'},{k:'heart',name:'💖 하트 세리머니!',pose:'heart'},{k:'dance',name:'🕺 댄스 세리머니!',pose:'dance'}];
let celeBag=[],celeTimer=null;
function nextCele(){if(!celeBag.length)celeBag=shuffle(CELES.map((_,i)=>i));return CELES[celeBag.pop()];}
function particle(html,x,y,cls,life){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${x},${y})`);g.innerHTML=`<g class="${cls}">${html}</g>`;$('cele').appendChild(g);setTimeout(()=>g.remove(),life);}
function goal(tg){$('hintTxt').setAttribute('opacity',0);const crowd=$('crowd');crowd.classList.remove('cheer');void crowd.getBBox();crowd.classList.add('cheer');
  const C=nextCele();const big=L.port?170:120,by=L.port?560:400;
  $('fx').innerHTML=`<text class="big" x="600" y="${by}" font-size="${big}">골인!</text><text class="cname" x="600" y="${by-(L.port?170:118)}" font-size="${L.port?52:38}">${C.name}</text>`;
  const t=team()?turnTeam():-1;const cs=L.cs,sc=cs/200,X=L.cx+cs*.1,Y=L.Y0+L.VH-cs*1.12;
  $('cele').innerHTML=`<g id="celeW"><g id="celeA">${tyranoKick('c'+G.idx,t===1?'#3d8bff':'#ff4d5a',C.pose)}</g></g>`;
  const W=$('celeW'),A=$('celeA');const put=(x,y,rot=0)=>W.setAttribute('transform',`translate(${x},${y}) rotate(${rot} ${100*sc} ${200*sc}) scale(${sc})`);
  const loop=(cls)=>{A.setAttribute('class',cls);};
  clearInterval(celeTimer);
  if(C.k==='slide'){const x0=L.vx-cs*1.1,x1=X+cs*.25;let last=0;
    anim(1150,k=>{const e=eo(k);const x=x0+(x1-x0)*e;put(x,Y+18*sc,-7-6*(1-k));if(k-last>.05&&k<.95){last=k;for(let i=0;i<3;i++)particle(`<rect width="4" height="9" rx="2" fill="${pick(['#3f9a2e','#6ccf4a','#8a6a3a'])}" transform="rotate(${rnd(-60,60)})"/>`,x+rnd(40,110)*sc,Y+rnd(190,210)*sc,'spray',700);}},()=>loop('cPump'));
    $('cele').insertAdjacentHTML('afterbegin',`<path d="M${L.vx},${Y+200*sc} L${x1+60*sc},${Y+196*sc}" stroke="#8fe07a" stroke-width="${14*sc}" opacity=".35" stroke-linecap="round"/>`);}
  else if(C.k==='plane'){const x0=L.vx+L.vw+cs*.2,x1=X+cs*.2;
    anim(1700,k=>{const e=eio(k);put(x0+(x1-x0)*e,Y-6*Math.abs(Math.sin(k*18)),14*Math.sin(k*9));},()=>loop('cBank'));}
  else{put(X,Y);A.setAttribute('class','cPop');setTimeout(()=>loop(C.k==='jump'?'cJump':C.k==='heart'?'cHeart':'cDance'),480);
    if(C.k==='heart')celeTimer=setInterval(()=>particle(`<path d="M0,-6 C-4,-12 -12,-9 -10,-3 C-8,2 0,7 0,7 C0,7 8,2 10,-3 C12,-9 4,-12 0,-6Z" fill="${pick(['#ff5a8a','#ff8ab0','#ff3d6e'])}" transform="scale(${rnd(1.2,2.2)})"/>`,X+rnd(30,170)*sc,Y+rnd(-10,60)*sc,'rise',1700),220);
    if(C.k==='dance')celeTimer=setInterval(()=>particle(`<text font-size="${rnd(26,40)}" fill="${pick(['#ffd23f','#ffffff','#7fe0ff'])}" stroke="#1b2862" stroke-width="3" paint-order="stroke">${pick(['♪','♫','♬'])}</text>`,X+rnd(0,200)*sc,Y+rnd(-20,60)*sc,'rise',1700),260);
    if(C.k==='jump')celeTimer=setInterval(()=>particle(`<path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3Z" fill="#ffd23f" transform="scale(${rnd(.8,1.6)})"/>`,X+rnd(0,200)*sc,Y+rnd(-20,80)*sc,'twinkle',900),200);}
  confetti();
  if(team()){G.res[G.idx]='g';G.teamGoals[t]++;}else{G.res[G.idx]=G.tries===0?'g':'y';if(G.tries===0)G.first++;}
  drawDots();G.state='wait';setTimeout(nextKick,3400);}
function miss(kind){const f=cur();G.tries++;
  const k=`${lvl}/${f.m}`,t=`${f.n}/${f.d}`;
  toast('no',kind==='weak'?'힘이 모자라요!':'힘이 너무 세요!',kind==='weak'?`채운 양 ${k} → ${t}보다 작아요`:`채운 양 ${k} → ${t}보다 커요`);
  if(team()){G.res[G.idx]='x';drawDots();G.state='wait';
    setTimeout(()=>{lvl=f.n*f.m/f.d;G.hint=true;drawGauge();toast('info','정답은 이만큼!',`${f.m}칸 중 ${lvl}칸 = ${t}`);},1500);setTimeout(nextKick,3600);return;}
  G.state='wait';if(G.tries>=2)G.hint=true;
  setTimeout(()=>{$('ball').setAttribute('opacity',1);$('bsh').setAttribute('opacity',.25);$('kpDive').setAttribute('transform','');$('kpIn').setAttribute('class','kp');
    anim(350,k=>placeBall(BALLX,L.BY,eo(k),0,1));drawGauge();G.state='ready';if(G.hint)toast('info','힌트를 보여 줄게요','노란 화살표까지 채워 봐요');},1700);}
function nextKick(){if(game.state!=='run')return;G.idx++;if(G.idx>=G.list.length){showResult();return;}
  $('ball').setAttribute('opacity',1);$('bsh').setAttribute('opacity',.25);setup();}

// ---------- 결과 ----------
function showResult(){game.state='end';let title,info,st;
  if(team()){const [a,b]=G.teamGoals;title=a>b?'🔴 1팀 승리!':b>a?'🔵 2팀 승리!':'무승부! 둘 다 최고!';st=3;info=`🔴 1팀 ${a}골 : ${b}골 🔵 2팀 · 팀마다 ${cfg.kicks}번씩 찼어요`;}
  else{const n=G.list.length,r=G.first/n;st=r>=.85?3:r>=.55?2:1;title=st===3?'분수 슈팅 스타!':st===2?'잘했어요!':'끝까지 해냈어요!';info=`${n}골 모두 성공 · 한 번에 넣은 골 ${G.first}개`;}
  $('resTitle').textContent=title;$('resStars').textContent=team()?'🏆':'⭐'.repeat(st)+'☆'.repeat(3-st);$('resInfo').textContent=info;$('resultOv').classList.remove('hide');sfx.done();confetti();
  if(!team())setTimeout(()=>TMRank.finish({level:rankLv(),name:rankName(),value:G.first,t:Math.round((performance.now()-G.t0)/1000)}),700);
  const detail={type:'tyranomath:fraction-kick-complete',mode:cfg.mode,problems:G.list.length,firstTry:G.first,teamGoals:G.teamGoals};
  try{window.dispatchEvent(new CustomEvent('fraction-kick-complete',{detail}));}catch(e){}
  try{if(window.parent!==window)window.parent.postMessage(detail,'*');}catch(e){}}
function toast(cls,big,small){const t=$('toast');t.className='toast '+cls;t.innerHTML=big+(small?'<small></small>':'');if(small)t.querySelector('small').textContent=small;
  void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function confetti(){const cols=['#ff5a6e','#ffd23f','#3d8bff','#3ccf8a','#b56bff'];
  for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(2,98)+'vw';c.style.background=pick(cols);
    c.style.setProperty('--fy',innerHeight*rnd(.8,1.1)+'px');c.style.animationDelay=rnd(0,.5)+'s';c.style.borderRadius=Math.random()<.4?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}}
function fitFrame(){const w=$('game').querySelector('.bwrap').getBoundingClientRect();const f=$('game').querySelector('.frame');
  const r=L.vw/L.VH,W=Math.min(w.width,w.height*r);f.style.width=W+'px';f.style.height=(W/r)+'px';}
addEventListener('resize',()=>{if(game.state==='off')return;const was=L.port;layout();fitFrame();
  if(was!==L.port&&G&&G.state==='ready'){drawScene();const l=lvl;setup();lvl=l;drawGauge();}});
let kAim=600;
addEventListener('keydown',e=>{if(game.state!=='run'||!G||G.state!=='ready'||!$('homeOv').classList.contains('hide'))return;const k=e.key;
  if(k==='ArrowUp'){e.preventDefault();setLvl(lvl+1);}else if(k==='ArrowDown'){e.preventDefault();setLvl(lvl-1);}
  else if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();kAim=clamp(kAim+(k==='ArrowLeft'?-60:60),GL+40,GR-40);drawAim({x:BALLX,y:L.BY},{x:kAim,y:(GT+GB)/2});}
  else if(k===' '||k==='Enter'){e.preventDefault();shoot({x:kAim,y:clamp((GT+GB)/2+rnd(-60,40),GT+40,GB-40)});}});

// ---------- 버튼 ----------
$('startBtn').onclick=()=>{try{AC().resume&&actx.resume();}catch(e){}start();};
$('againBtn').onclick=start;
const toLobby=()=>{game.state='off';['game','resultOv','homeOv'].forEach(id=>$(id).classList.add('hide'));$('lobby').classList.remove('hide');sync();};
$('setBtn').onclick=toLobby;$('homeBtn').onclick=()=>{if(game.state==='off')return;$('homeOv').classList.remove('hide');};
$('homeYes').onclick=toLobby;$('homeNo').onclick=()=>$('homeOv').classList.add('hide');
const syncSound=()=>{$('soundBtn').innerHTML=(cfg.sound?'🔊':'🔇')+'<small>소리</small>';};
$('soundBtn').onclick=()=>{cfg.sound=!cfg.sound;syncSound();saveCfg();};syncSound();
const root=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
document.querySelectorAll('.fsBtn').forEach(b=>{if(!fsOK){b.style.display='none';return;}
  b.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);}catch(e){}};});
const GAMEZONE_URL='/';
try{if(window.top===window)$('zoneBtn').hidden=false;}catch(e){}
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault();});
// 🏆 랭킹: 혼자 하기 · 한 번에 넣은 골 (같으면 빨리 끝낸 사람이 앞서요 · 분모 · 게이지 · 문제 수마다 따로)
const DNN={'6':'쉬움','10':'보통','12':'어려움'};
