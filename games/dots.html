<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>티라노 점 잇기 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g4{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
@media (max-width:560px){.g6{grid-template-columns:repeat(3,1fr)}.g8{grid-template-columns:repeat(4,1fr)}}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}
.modes button b{font-family:var(--title);font-weight:400;font-size:1.12em}
.chars button{padding:.3em .2em .25em;min-height:0}
.chars button img{width:100%;max-width:64px;aspect-ratio:228/262;height:auto;display:block;margin:0 auto .15em;pointer-events:none}
.chars button small{font-size:.78em}
.heroD{flex:none;width:4.4em;height:4.4em;background:rgba(255,255,255,.9);border-radius:1em;padding:.2em}
.heroD svg{width:100%;height:100%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--ui)*5.4),1fr));gap:calc(var(--ui)*.5)}
.gal button{display:flex;flex-direction:column;align-items:center;padding:.3em .2em .35em;min-height:0;border-radius:1em;gap:.1em}
.gal button svg{width:100%;aspect-ratio:1;max-width:5em}
.gal button small{font-size:.75em;font-weight:800;white-space:nowrap}
.gal button .st{font-size:.7em;letter-spacing:-.05em;min-height:1.1em}
.gal button.on small{color:#fff}
.gal .rand b{font-size:2.2em;line-height:1.3}

#game{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 10% 16%,rgba(255,255,255,.6) 0 70px,transparent 71px),radial-gradient(circle at 92% 86%,rgba(255,255,255,.5) 0 110px,transparent 111px),linear-gradient(165deg,#d5f4ec 0,#e3f6f1 46%,#e2ebff 100%)}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:var(--accent-dark);text-shadow:0 2px 0 #fff;font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1f2f6b;border:3px solid #fff;border-radius:.9em;padding:.15em 1.4em .3em;box-shadow:0 .25em 0 rgba(31,110,100,.18)}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.35em;color:var(--accent-dark);white-space:nowrap;line-height:1.15}.rnd small{font-size:.75em;white-space:nowrap;color:#4b5a66}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
.tbs .tb.on{background:#e1f5f0;border-color:var(--accent)}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:40px;height:40px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.1em .8em}}
.guide{flex:none;margin:2px 14px 6px;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,110,100,.15);padding:8px 14px 10px;font-size:clamp(13px,1.7vmin,18px)}
.guide.min{display:none}
.gtitle{display:flex;align-items:center;justify-content:space-between}.gtitle b{font-family:var(--title);font-weight:400;color:var(--accent-dark);font-size:1.2em}
.gtog{min-height:0;height:2em;padding:0 .9em;font-size:.85em;border-radius:99px}
.gtxt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;color:#334;line-height:1.4}
.gtxt span{background:var(--accent-soft);border-radius:10px;padding:.3em .7em}

.main{flex:1;min-height:0;display:flex;gap:14px;padding:4px 14px max(12px,env(safe-area-inset-bottom));align-items:stretch}
.side{flex:none;width:clamp(170px,19vw,260px);background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 20px rgba(31,110,100,.16);font-size:clamp(13px,1.6vmin,18px);min-height:0;overflow:hidden}
.who{display:flex;flex-direction:column;align-items:center;gap:6px}
.pimg{width:68%;max-width:130px;aspect-ratio:228/262;animation:bobp 1.1s ease-in-out infinite alternate}
.pimg.joy{animation:jump .45s ease-in-out 3}
.bubble{position:relative;background:var(--accent-soft);border:2px solid var(--accent-line);color:var(--accent-dark);border-radius:14px;padding:.45em .7em;font-family:var(--title);font-size:1.05em;text-align:center;line-height:1.25;min-height:2.6em;display:flex;align-items:center;justify-content:center;width:100%;word-break:keep-all}
.bubble::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom:9px solid var(--accent-line)}
.bubble.pop{animation:pop .35s}
.nowbox{background:#f6faf9;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:.3em .4em .45em}
.nowbox small{font-size:.75em;font-weight:800;color:var(--muted)}
.nowbox b{font-family:var(--title);font-weight:400;font-size:2.1em;color:var(--accent-dark);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:1.6em}
.chips span{font-family:var(--title);font-size:.9em;background:#fff;border:2px solid var(--accent-line);color:var(--accent-dark);border-radius:99px;padding:0 .5em}
.chips span:last-child{background:var(--accent);color:#fff;border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px}.pbar{flex:1;height:12px;border-radius:99px;background:#eaf3f1;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fcfb6,#1f9d8f);transition:width .3s}
.prog small{font-weight:800;color:var(--muted);white-space:nowrap}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.sbtns button{font-size:1em;padding:0 .3em}.sbtns .hint{background:#fff6d6;border-color:#f2cf62}
.main.port{flex-direction:column}
.main.port .side{width:auto;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto auto;padding:8px 10px;gap:6px 10px;border-radius:16px}
.main.port .who{flex-direction:row;min-width:0;grid-row:1/3}
.main.port .pimg{width:clamp(44px,12vw,80px);flex:none}
.main.port .bubble{font-size:.95em}
.main.port .bubble::before{left:-9px;top:50%;margin:-8px 0 0;border:8px solid transparent;border-left:0;border-right:9px solid var(--accent-line)}
.main.port .nowbox{padding:.1em .3em .2em}.main.port .nowbox b{font-size:1.5em}.main.port .chips{display:none}
.main.port .prog{display:none}
.main.port .sbtns{margin:0}.main.port .sbtns button{min-height:38px;font-size:.9em}

.bwrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.board{position:relative;background:#fffef8;border-radius:24px;box-shadow:0 0 0 6px #bfe6dd,0 0 0 9px #fff,0 14px 30px rgba(31,110,100,.22);touch-action:none;
  background-image:radial-gradient(#e6eef0 1.2px,transparent 1.3px);background-size:22px 22px}
.board svg{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.dot{transition:transform .15s}
.dot .c{fill:#fff;stroke:#2f3a48;stroke-width:.55}
.dot.on .c{fill:#2f3a48}
.dot.next .ring{animation:ring 1s ease-out infinite}
.dot .ring{fill:none;stroke:#ff9f43;stroke-width:.7;opacity:0}
.dot.hint .ring{stroke:#ffcf3a;stroke-width:1.1;animation:ring .7s ease-out infinite}
.dot.bad{animation:bad .35s}
.dot.bad .c{fill:#ff6b6b;stroke:#c92a2a}
.lbl{font-family:var(--title);fill:#2f3a48;paint-order:stroke;stroke:#fffef8;stroke-width:.9;stroke-linejoin:round;pointer-events:none}
.lbl.on{fill:#1f9d8f}
.lbl.calc{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:800}
.lines line{stroke:#1f9d8f;stroke-width:1.15;stroke-linecap:round}
.lines line.new{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:drawl .22s ease-out forwards}
.rubber{stroke:#1f9d8f;stroke-width:.8;stroke-dasharray:1.2 1.4;stroke-linecap:round;opacity:.7}
.startflag{font-family:var(--title);fill:#fff;font-size:2.6px;pointer-events:none}
.fillpic{opacity:0;transition:opacity .9s}
.fillpic.show{opacity:1}
.decor{opacity:0;transition:opacity .8s .5s}.decor.show{opacity:1}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes bad{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
@keyframes drawl{to{stroke-dashoffset:0}}
.dot,.dot .ring{transform-box:fill-box;transform-origin:center}
.done{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:#fff;border:3px solid var(--accent-line);border-radius:18px;padding:.5em .9em .7em;text-align:center;box-shadow:0 8px 20px rgba(31,110,100,.25);
  font-size:clamp(13px,1.9vmin,22px);width:max-content;max-width:94%;animation:pop .4s}
.done b{display:block;font-family:var(--title);font-weight:400;font-size:1.7em;color:var(--accent-dark)}
.done small{display:block;color:#445;font-weight:700;margin:.1em 0 .5em}
.dbtns{display:flex;gap:.5em;justify-content:center}.dbtns button{font-size:.95em}
@keyframes bobp{to{transform:translateY(-6px)}}
@keyframes jump{50%{transform:translateY(-22px) rotate(-6deg)}}
@keyframes pop{50%{transform:translateX(-50%) scale(1.06)}}
.bubble.pop{animation:popb .35s}@keyframes popb{50%{transform:scale(1.08)}}
.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);width:min(100%,calc(var(--ui)*30));box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}.modal .actions button{flex:1}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
.main.port .bwrap{align-items:flex-start;padding-top:6px}
.done.below{top:calc(100% + 14px);bottom:auto}

.bubble::before,.main.port .bubble::before{display:none}
.side .bubble{min-height:3.2em;font-size:1.15em}
.main.port .who{align-items:stretch}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
#lobby .top-btns .tmr-btn{flex:none}
.zone[hidden]{display:none!important}
</style></head>
<body>
<div id="lobby">
  <div class="lwrap">
    <header class="top">
      <div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 게임존</div><h1>티라노 점 잇기</h1></div></div>
      <div class="top-btns"><a class="zone" id="zoneBtn" href="../gamezone.html" hidden>← 게임존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div>
    </header>
    <section class="hero" style="background:linear-gradient(120deg,#22b3a0,#7a8cff)">
      <div class="heroD"><svg viewBox="-6 -6 112 112" id="heroSvg"></svg></div>
      <div><h2>숫자 순서대로 이으면 그림이 나타나요!</h2>
        <p>점을 <b>차례대로 톡톡</b> 누르거나 <b>쭉 끌어서</b> 이어요. 뛰어 세기·거꾸로 세기·구구단·계산 식으로도 도전해요.</p></div>
    </section>
    <section class="card">
      <div class="label">세는 방법</div>
      <div class="grid g4 modes" id="modeSeg">
        <button data-v="one"><b>1씩 세기</b><small>1, 2, 3 …</small></button>
        <button data-v="big"><b>큰 수 이어 세기</b><small>47, 48, 49 …</small></button>
        <button data-v="back"><b>거꾸로 세기</b><small>30, 29, 28 …</small></button>
        <button data-v="two"><b>2씩 뛰어 세기</b><small>2, 4, 6 …</small></button>
        <button data-v="five"><b>5씩 뛰어 세기</b><small>5, 10, 15 …</small></button>
        <button data-v="ten"><b>10씩 뛰어 세기</b><small>10, 20, 30 …</small></button>
        <button data-v="hund"><b>100씩 뛰어 세기</b><small>100, 200 …</small></button>
        <button data-v="dan"><b>구구단</b><small>3, 6, 9 …</small></button>
        <button data-v="calc"><b>덧셈·뺄셈 식</b><small>답이 1, 2, 3 … 순서</small></button>
      </div>
      <div id="danBox" class="hide"><div class="label">몇 단?</div><div class="grid g8" id="danSeg"></div></div>
    </section>
    <section class="card">

// ================= 티라노 점 잇기 =================
const $=id=>document.getElementById(id);
const KEY='tyranomath-dots-v1';
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const TEST=/[?&]test/.test(location.search);
document.querySelectorAll('img.dino').forEach(i=>i.src=DINO_SVG);
const MODES={one:'1씩 세기',big:'큰 수 이어 세기',back:'거꾸로 세기',two:'2씩 뛰어 세기',five:'5씩 뛰어 세기',ten:'10씩 뛰어 세기',hund:'100씩 뛰어 세기',dan:'구구단',calc:'덧셈·뺄셈 식'};

let cfg={mode:'one',dan:3,pic:'rand',ch:'tyrano',sound:true,done:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.mode)cfg={...cfg,...o,done:{...(o.done||{})}};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}};
const polyStr=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function miniSVG(P,done){return done
  ?`<svg viewBox="-6 -6 112 112"><polygon points="${polyStr(P.pts)}" fill="${P.col}" stroke="${P.dk}" stroke-width="2.5" stroke-linejoin="round"/>${P.decor}</svg>`
  :`<svg viewBox="-6 -6 112 112">${P.pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.2" fill="#9aa9b0"/>`).join('')}<text x="50" y="62" text-anchor="middle" font-size="30" font-family="Jua,sans-serif" fill="#c3cfd3">?</text></svg>`;}

// ---------- 로비 ----------
function buildLobby(){const H=PICS.find(p=>p.id==='fish');
  $('heroSvg').innerHTML=`<polyline points="${polyStr(H.pts.slice(0,9))}" fill="none" stroke="#1f9d8f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`+H.pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="${i<9?'#2f3a48':'#fff'}" stroke="#2f3a48" stroke-width="1"/>`).join('');
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.v;save();sync();});
  $('danSeg').innerHTML=[2,3,4,5,6,7,8,9].map(d=>`<button data-v="${d}">${d}단</button>`).join('');
  document.querySelectorAll('#danSeg button').forEach(b=>b.onclick=()=>{cfg.dan=+b.dataset.v;save();sync();});
  sync();}
function sync(){document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mode));
  $('danBox').classList.toggle('hide',cfg.mode!=='dan');document.querySelectorAll('#danSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===cfg.dan));
  const nd=PICS.filter(p=>cfg.done[p.id]).length;$('galInfo').textContent=`완성 ${nd} / ${PICS.length}`;
  $('gal').innerHTML=`<button data-v="rand" class="rand ${cfg.pic==='rand'?'on':''}"><b>🎲</b><small>차례대로</small><span class="st"></span></button>`+
    PICS.map(p=>`<button data-v="${p.id}" class="${cfg.pic===p.id?'on':''}">${miniSVG(p,cfg.done[p.id])}<small>${cfg.done[p.id]?p.name:'점 '+p.pts.length+'개'}</small><span class="st">${'⭐'.repeat(cfg.done[p.id]||0)}</span></button>`).join('');
  document.querySelectorAll('#gal button').forEach(b=>b.onclick=()=>{cfg.pic=b.dataset.v;save();sync();});}

// ---------- 소리 ----------
let actx=null;const AC=()=>{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;};
function beep(f,d,type='sine',v=.1,when=0,f2){if(!cfg.sound||TEST)return;try{const a=AC();const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const SCALE=[523,587,659,698,784,880,988,1047];
const sfx={ok:i=>beep(SCALE[i%8]*(i%16<8?1:1.5),.12,'triangle',.09),bad:()=>beep(180,.18,'sawtooth',.06,0,120),hint:()=>beep(880,.12,'sine',.07,0,1200),
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',.11,i*.1))};

// ---------- 수 만들기 ----------
function makeSeq(mode,n){const L=[];let vals=[];
  if(mode==='one')vals=[...Array(n)].map((_,i)=>i+1);
  else if(mode==='big'){const s=ri(21,99-n);vals=[...Array(n)].map((_,i)=>s+i);}
  else if(mode==='back'){const top=n+ri(0,Math.max(0,40-n));vals=[...Array(n)].map((_,i)=>top-i);}
  else if(mode==='two')vals=[...Array(n)].map((_,i)=>2*(i+1));
  else if(mode==='five')vals=[...Array(n)].map((_,i)=>5*(i+1));
  else if(mode==='ten')vals=[...Array(n)].map((_,i)=>10*(i+1));
  else if(mode==='hund')vals=[...Array(n)].map((_,i)=>100*(i+1));
  else if(mode==='dan')vals=[...Array(n)].map((_,i)=>cfg.dan*(i+1));
  else if(mode==='calc'){vals=[...Array(n)].map((_,i)=>i+1);
    return vals.map(v=>{let e;if(v>=2&&Math.random()<.5){const a=ri(1,v-1);e=`${a}+${v-a}`;}else{const b=ri(1,9);e=`${v+b}−${b}`;}return {v,label:e};});}
  return vals.map(v=>({v,label:String(v)}));}

// ---------- 게임 ----------
let S=null,game={state:'off'};
const GUIDE=['🟠 반짝이는 점에서 시작해요.','다음 수의 점을 톡 누르거나, 점에서 점으로 쭉 끌어서 이어요.','뛰어 세기: 2씩·5씩·10씩·100씩 커지는 수를 찾아요.','덧셈·뺄셈 식: 식의 답이 1, 2, 3 … 순서가 되도록 이어요.','틀린 점을 누르면 점이 흔들려요. 막히면 💡 힌트!','마지막 점까지 이으면 그림이 완성돼요. 틀린 횟수가 적을수록 별이 많아요.'];
function nextPic(){if(cfg.pic!=='rand')return PICS.find(p=>p.id===cfg.pic)||PICS[0];return PICS.find(p=>!cfg.done[p.id])||pick(PICS);}
function start(pic){$('lobby').classList.add('hide');$('game').classList.remove('hide');$('homeOv').classList.add('hide');
  const P=pic||nextPic();const seq=makeSeq(cfg.mode,P.pts.length);
  S={P,seq,k:0,miss:0,hints:0,drag:false,done:false};game.state='play';
  $('picT').textContent='무슨 그림일까?';$('modeT').textContent=MODES[cfg.mode]+(cfg.mode==='dan'?` · ${cfg.dan}단`:'')+` · 점 ${P.pts.length}개`;
  $('doneBox').classList.add('hide');
  say(cfg.mode==='calc'?`답이 <b>&nbsp;1&nbsp;</b>인 식부터!`:`<b>${seq[0].label}</b>&nbsp;부터 시작해요!`);
  layout();drawAll();upd();}
function say(t){const b=$('bubble');b.innerHTML=t;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
function layout(){const m=$('mainArea'),r=m.getBoundingClientRect();m.classList.toggle('port',r.height>r.width*.95);
  const w=$('bwrap').getBoundingClientRect();const s=Math.floor(Math.min(w.width-20,w.height-20));$('board').style.width=$('board').style.height=Math.max(200,s)+'px';
  if(S)setFont();}
function setFont(){// 화면 크기에 맞게 글자 크기(단위) 정하기
  const px=$('board').getBoundingClientRect().width/118;const len=Math.max(...S.seq.map(s=>s.label.length));
  const n=S.P.pts.length;let f=Math.max(3.5,Math.min(5.4,17/px))*(n>22?.88:1);if(len>=4)f*=len>=5?.72:.82;S.font=f;
  document.querySelectorAll('#svg .lbl').forEach(e=>e.setAttribute('font-size',f.toFixed(2)));}
function placeLabels(){const P=S.P.pts,n=P.length,f=S.font,lp=[],boxes=[];
  const samp=[];for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],L=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(L/1.2));for(let t=0;t<=k;t++)samp.push([a[0]+(b[0]-a[0])*t/k,a[1]+(b[1]-a[1])*t/k]);}
  const rectD=(bx,x,y)=>{const dx=Math.max(bx[0]-x,0,x-bx[2]),dy=Math.max(bx[1]-y,0,y-bx[3]);return Math.hypot(dx,dy);};
  for(let i=0;i<n;i++){const p=P[i],a=P[(i-1+n)%n],b=P[(i+1)%n];
    let d1=[p[0]-a[0],p[1]-a[1]],d2=[p[0]-b[0],p[1]-b[1]];const n1=Math.hypot(...d1)||1,n2=Math.hypot(...d2)||1;let v=[d1[0]/n1+d2[0]/n2,d1[1]/n1+d2[1]/n2];
    if(Math.hypot(...v)<.2)v=[-(b[1]-a[1]),b[0]-a[0]];if(inPoly(p[0]+v[0]*.01*3/Math.hypot(...v)*100,p[1]+v[1]*.01*3/Math.hypot(...v)*100,P))v=[-v[0],-v[1]];
    const pref=Math.atan2(v[1],v[0]);const w=S.seq[i].label.length*f*.56+.4,h=f*.92;let best=null;
    for(let k=0;k<24;k++){const th=k/24*Math.PI*2;for(const m of [1,1.4]){
      const cx=p[0]+Math.cos(th)*(1.9+w/2)*m,cy=p[1]+Math.sin(th)*(1.9+h/2)*m,bx=[cx-w/2,cy-h/2,cx+w/2,cy+h/2];let pen=0;
      if(bx[0]<-8.5||bx[2]>108.5||bx[1]<-8.5||bx[3]>108.5)pen+=50;
      for(let j=0;j<n;j++){if(j===i)continue;const d=rectD(bx,P[j][0],P[j][1]);if(d<2.2)pen+=(2.2-d)*12;}
      for(const s of samp){if(s[0]>bx[0]-.35&&s[0]<bx[2]+.35&&s[1]>bx[1]-.35&&s[1]<bx[3]+.35)pen+=2.5;}
      for(const o of boxes){const ox=Math.min(bx[2],o[2])-Math.max(bx[0],o[0]),oy=Math.min(bx[3],o[3])-Math.max(bx[1],o[1]);if(ox>-.3&&oy>-.3)pen+=8+(ox+.3)*(oy+.3)*6;}
      let da=Math.abs(th-pref);if(da>Math.PI)da=2*Math.PI-da;pen+=da*.9+(m>1?1.2:0);
      if(!best||pen<best.pen)best={pen,cx,cy,bx};}}
    boxes.push(best.bx);lp.push([best.cx,best.cy+f*.34]);}
  S.lp=lp;}
function labelPos(i){return S.lp[i];}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function drawAll(){const P=S.P,svg=$('svg');S.font=4;setFontQuick();
  let h=`<g id="pic"><polygon class="fillpic" id="fillpic" points="${polyStr(P.pts)}" fill="${P.col}" stroke="${P.dk}" stroke-width="1.6" stroke-linejoin="round"/><g class="decor" id="decor">${P.decor}</g><g class="lines" id="lines"></g><line class="rubber" id="rubber" x1="0" y1="0" x2="0" y2="0" style="display:none"/><g id="dots">`;
  P.pts.forEach((q,i)=>{h+=`<g class="dot" data-i="${i}"><circle class="ring" cx="${q[0]}" cy="${q[1]}" r="1.6"/><circle class="c" cx="${q[0]}" cy="${q[1]}" r="1.25"/></g>`;});
  h+='</g><g id="lbls">';placeLabels();
  P.pts.forEach((q,i)=>{const [x,y]=labelPos(i);h+=`<text class="lbl ${cfg.mode==='calc'?'calc':''}" data-i="${i}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" font-size="${S.font.toFixed(2)}">${S.seq[i].label}</text>`;});
  h+='</g></g>';svg.innerHTML=h;const f0=S.font;setFont();if(S.font!==f0)placeLabels();
  // 글자 크기가 바뀌었으면 위치 다시
  document.querySelectorAll('#svg .lbl').forEach(e=>{const i=+e.dataset.i;const [x,y]=labelPos(i);e.setAttribute('x',x.toFixed(2));e.setAttribute('y',y.toFixed(2));});
  markNext();}
function setFontQuick(){const px=$('board').getBoundingClientRect().width/118||5;const len=Math.max(...S.seq.map(s=>s.label.length));let f=Math.max(3.5,Math.min(5.4,17/px))*(S.P.pts.length>22?.88:1);if(len>=4)f*=len>=5?.72:.82;S.font=f;}
function markNext(){document.querySelectorAll('#dots .dot').forEach(d=>{const i=+d.dataset.i;d.classList.toggle('on',i<S.k);d.classList.toggle('next',i===S.k&&!S.done&&S.k===0);});
  document.querySelectorAll('#lbls .lbl').forEach(e=>e.classList.toggle('on',+e.dataset.i<S.k));}
function upd(){const n=S.P.pts.length;$('pbar').style.width=(S.k/n*100)+'%';$('progT').textContent=`${S.k} / ${n}`;
  const last=S.seq.slice(Math.max(0,S.k-5),S.k);$('nowT').textContent=S.k?S.seq[S.k-1].v:'–';$('chips').innerHTML=last.map(s=>`<span>${s.v}</span>`).join('');}
function toUnits(ev){const svg=$('svg'),pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM();if(!m)return [0,0];const q=pt.matrixTransform(m.inverse());return [q.x,q.y];}
function hitR(){const px=$('board').getBoundingClientRect().width/118;return Math.max(3.4,26/px);}
function nearest(x,y,r){let best=-1,bd=r*r;S.P.pts.forEach((q,i)=>{const d=(q[0]-x)**2+(q[1]-y)**2;if(d<bd){bd=d;best=i;}});return best;}
function connect(i){const P=S.P.pts;if(S.k>0){const a=P[S.k-1],b=P[i];addLine(a,b);}S.k++;sfx.ok(S.k-1);markNext();upd();clearHint();
  if(S.k>1&&Math.random()<.25)say(pick(['좋아요!','맞아요!','잘하고 있어요!','척척!']));
  if(S.k===P.length){addLine(P[P.length-1],P[0]);finish();}}
function addLine(a,b){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);
  l.classList.add('new');l.style.setProperty('--l',Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(2));$('lines').appendChild(l);}
function wrong(i){S.miss++;sfx.bad();const d=document.querySelector(`#dots .dot[data-i="${i}"]`);d.classList.remove('bad');void d.getBBox();d.classList.add('bad');setTimeout(()=>d.classList.remove('bad'),400);
  const cur=S.k?S.seq[S.k-1]:null;
  say(cfg.mode==='calc'?`그 식의 답은 ${S.seq[i].v}! 답이 ${S.k+1}인 식을 찾아요`:cur?`${cur.label} 다음 수를 찾아봐요`:`${S.seq[0].label}부터 시작해요`);}
// 끌기/누르기
$('svg').addEventListener('pointerdown',ev=>{if(!S||S.done||game.state!=='play')return;ev.preventDefault();try{AC().resume&&actx.resume();}catch(e){}
  const [x,y]=toUnits(ev);const i=nearest(x,y,hitR());
  if(i===S.k){connect(i);}else if(i>=0&&i!==S.k-1&&i>=S.k)wrong(i);
  if(S.k>0&&!S.done){S.drag=true;S.pid=ev.pointerId;try{$('svg').setPointerCapture(ev.pointerId);}catch(e){}rubber(x,y);}});
$('svg').addEventListener('pointermove',ev=>{if(!S||!S.drag||ev.pointerId!==S.pid)return;const [x,y]=toUnits(ev);
  const i=nearest(x,y,hitR()*.85);if(i===S.k)connect(i);if(S.done){S.drag=false;rubber();return;}rubber(x,y);});
const endDrag=ev=>{if(!S||ev.pointerId!==S.pid)return;S.drag=false;rubber();};
$('svg').addEventListener('pointerup',endDrag);$('svg').addEventListener('pointercancel',endDrag);
function rubber(x,y){const r=$('rubber');if(x===undefined||!S||!S.k||S.done){r.style.display='none';return;}const a=S.P.pts[S.k-1];r.style.display='';
  r.setAttribute('x1',a[0]);r.setAttribute('y1',a[1]);r.setAttribute('x2',x);r.setAttribute('y2',y);}
function clearHint(){document.querySelectorAll('#dots .dot.hint').forEach(d=>d.classList.remove('hint'));}
function hint(){if(!S||S.done)return;clearHint();S.hints++;sfx.hint();const d=document.querySelector(`#dots .dot[data-i="${S.k}"]`);d.classList.add('hint');
  say(cfg.mode==='calc'?`답이 ${S.k+1}인 식: <b>&nbsp;${S.seq[S.k].label}</b>`:`다음 수는 <b>&nbsp;${S.seq[S.k].label}</b>&nbsp;이에요`);}
function finish(){S.done=true;game.state='done';const P=S.P;
  const stars=S.miss===0&&S.hints===0?3:S.miss+S.hints<=3?2:1;cfg.done[P.id]=Math.max(cfg.done[P.id]||0,stars);save();
  setTimeout(()=>{$('fillpic').classList.add('show');$('decor').classList.add('show');document.querySelectorAll('#lbls .lbl').forEach(e=>{e.style.transition='opacity .6s';e.style.opacity='0';});shrinkPic();
    document.querySelectorAll('#dots .dot').forEach(e=>e.style.opacity='0');},350);
  setTimeout(()=>{sfx.win();confetti();$('picT').textContent=`${P.emoji} ${P.name} 완성!`;
    const a=S.seq[0].v,b=S.seq[S.seq.length-1].v;
    $('doneT').textContent=`${P.emoji} ${P.name} 완성! ${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}`;
    $('doneS').textContent=cfg.mode==='calc'?`식 ${P.pts.length}개의 답을 1부터 ${P.pts.length}까지 순서대로 이었어요!`:`${MODES[cfg.mode]}${cfg.mode==='dan'?`(${cfg.dan}단)`:''}로 ${a}부터 ${b}까지 이었어요!`+(S.miss?` (틀린 점 ${S.miss}번)`:'');
    const db=$('doneBox');db.classList.remove('below');db.classList.remove('hide');{const room=$('bwrap').getBoundingClientRect().bottom-$('board').getBoundingClientRect().bottom;db.classList.toggle('below',room>db.offsetHeight+22);}say(`${P.name}였어요! 🎉`);},1100);
  try{if(window.parent!==window)window.parent.postMessage({type:'tyranomath:dots-clear',pic:P.id,mode:cfg.mode,miss:S.miss,stars},'*');}catch(e){}}
function shrinkPic(){const g=$('pic');if(!g)return;const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700),e=1-(1-k)**3,s=1-.17*e;g.setAttribute('transform',`translate(${(50*(1-s)).toFixed(2)} ${(-5*e).toFixed(2)}) scale(${s.toFixed(3)})`);if(k<1&&$('pic')===g)requestAnimationFrame(f);};requestAnimationFrame(f);}
function confetti(){if(TEST)return;const cols=['#ff6b8b','#ffd23a','#5fd068','#4fb6ff','#a974ff','#ff9b3d'];
  for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(2,98)+'vw';c.style.background=pick(cols);
    c.style.setProperty('--fy',innerHeight*rnd(.8,1.1)+'px');c.style.animationDelay=rnd(0,.5)+'s';c.style.borderRadius=Math.random()<.4?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}}
function setGuide(open){$('guide').classList.toggle('min',!open);$('helpBtn').classList.toggle('on',open);
  $('guideTxt').innerHTML=GUIDE.map(t=>`<span>${t}</span>`).join('');if(S&&game.state!=='off')requestAnimationFrame(()=>{layout();});}
$('helpBtn').onclick=()=>setGuide($('guide').classList.contains('min'));$('guideBtn').onclick=()=>setGuide(false);

// ---------- 버튼 ----------
const begin=p=>{try{AC().resume&&actx.resume();}catch(e){}start(p);};
$('startBtn').onclick=()=>begin();
$('hintBtn').onclick=hint;$('resetBtn').onclick=()=>{if(S)begin(S.P);};
$('nextBtn').onclick=()=>{const cur=S.P;let p;if(cfg.pic==='rand')p=PICS.find(x=>!cfg.done[x.id])||PICS[(PICS.indexOf(cur)+1)%PICS.length];else{p=PICS[(PICS.indexOf(cur)+1)%PICS.length];cfg.pic=p.id;save();}begin(p);};
const toLobby=()=>{game.state='off';['game','homeOv'].forEach(id=>$(id).classList.add('hide'));$('lobby').classList.remove('hide');sync();};
$('galBtn').onclick=toLobby;$('homeBtn').onclick=()=>{if(game.state==='off')return;if(game.state==='done'){toLobby();return;}$('homeOv').classList.remove('hide');};
$('homeYes').onclick=toLobby;$('homeNo').onclick=()=>$('homeOv').classList.add('hide');
const syncSound=()=>{$('soundBtn').innerHTML=(cfg.sound?'🔊':'🔇')+'<small>소리</small>';};
$('soundBtn').onclick=()=>{cfg.sound=!cfg.sound;syncSound();save();};syncSound();
const root=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
document.querySelectorAll('.fsBtn').forEach(b=>{if(!fsOK){b.style.display='none';return;}
  b.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);}catch(e){}};});
const ZONE_URL='/';
try{if(window.top===window)$('zoneBtn').hidden=false;}catch(e){}
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S&&game.state!=='off'){layout();placeLabels();document.querySelectorAll('#svg .lbl').forEach(e=>{const i=+e.dataset.i;const [x,y]=labelPos(i);e.setAttribute('x',x.toFixed(2));e.setAttribute('y',y.toFixed(2));});}},80);});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault();});
buildLobby();
if(TEST)window.__d={get S(){return S},get state(){return game.state},PICS,cfg,dotXY:i=>{const svg=$('svg'),m=svg.getScreenCTM(),q=S.P.pts[i];return [m.a*q[0]+m.e,m.d*q[1]+m.f];}};

})();</script></body></html>
