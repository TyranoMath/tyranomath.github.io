<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>각도기와 자 · TyranoMath 수학 도구존</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tool.css">
<style>
#sv{width:100%; flex:1; min-height:0; touch-action:none}
.handle{cursor:grab}
.res{font-family:'Jua',sans-serif; font-size:clamp(22px,3vw,36px); text-align:center; min-height:1.4em}
.res b{font-family:'Fredoka',sans-serif; color:var(--teal-d)}
.res small{font-size:.55em; color:var(--muted); display:block}
.res.hide b{filter:blur(12px); cursor:pointer}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.presets{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.presets .tool{font-family:'Fredoka',sans-serif; padding:4px}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="../toolzone.html" hidden>← 도구존</a>
  <div class="title"><span class="dino-logo"></span>각도기와 자</div>
  <button class="tool" id="fullBtn">⛶ 전체 화면</button>
</div>
<div class="main">
  <div class="stage">
    <svg id="sv" viewBox="0 0 800 500" role="img" aria-label="각도기와 자"></svg>
    <div class="res" id="res"></div>
  </div>
  <div class="side">
    <div class="box">
      <div class="tabs" id="tabs"><button class="tool" data-t="angle">📐 각도 재기</button><button class="tool" data-t="len">📏 길이 재기</button></div>
    </div>
    <div id="angleSide">
      <div class="box">
        <h3>각 만들기 <small>빨간 점·파란 점을 끌어요</small></h3>
        <div class="presets" id="presets"></div>
        <label class="fld">끌 때 <select id="snapA"><option value="1">1°씩</option><option value="5" selected>5°씩</option><option value="15">15°씩</option></select></label>
        <button class="tool" id="randA">🎲 아무 각</button>
      </div>
      <div class="box" style="margin-top:12px">
        <label class="sw"><input type="checkbox" id="showPro" checked> 각도기 놓기</label>
        <label class="sw"><input type="checkbox" id="hideA"> 각도 가리기 (재어 보기)</label>
        <p class="note">각도기의 <b>중심</b>을 꼭짓점에, <b>밑금</b>을 한 변에 맞춰요. 0에서 시작하는 쪽 눈금을 읽어요. 바깥 눈금과 안쪽 눈금 중 <b>0이 변에 맞은 쪽</b>을 읽어야 해요.</p>
      </div>
    </div>
    <div id="lenSide" hidden>
      <div class="box">
        <h3>무엇을 잴까요?</h3>
        <div class="grid2" id="objs"></div>
        <button class="tool" id="zero">물건 끝을 0에 맞추기</button>
        <button class="tool" id="randL">🎲 아무 길이</button>
      </div>
      <div class="box" style="margin-top:12px">
        <label class="sw"><input type="checkbox" id="mm" checked> mm까지 재기</label>
        <label class="sw"><input type="checkbox" id="hideL"> 길이 가리기 (재어 보기)</label>
        <label class="sw"><input type="checkbox" id="noRuler"> 자 치우기 (어림해 보기)</label>
        <p class="note">물건의 양 끝(동그라미)을 끌어요. 0이 아닌 곳에서 시작해도 <b>몇 칸인지</b> 세면 길이를 알 수 있어요.</p>
      </div>
    </div>
  </div>
</div>
<script src="tool-common.js"></script>
<script>
(() => {
'use strict';
const { $, store, pt } = TT;
const V = [400, 400], R = 300;
let tab = store.get('tm-pr-tab', 'angle'), aA = 0, aB = 60;
const OBJ = [['✏️ 연필', '#FFD27A', '#B9862A'], ['🖍️ 크레파스', '#FF8FA3', '#C4506A'], ['🧽 지우개', '#9CC7EE', '#2A6FAE'], ['🎀 리본', '#C7B6F2', '#6C3FB4']];
let obj = 0, L0 = 1.0, L1 = 7.3; // cm
const CM = 48, RX = 40, RY = 250;
const rad = d => d * Math.PI / 180, pol = (d, r) => [V[0] + r * Math.cos(rad(d)), V[1] - r * Math.sin(rad(d))];
function kind(a){ return a === 0 ? '' : a < 90 ? '예각' : a === 90 ? '직각' : a < 180 ? '둔각' : a === 180 ? '평각 (일직선)' : '180°보다 큰 각'; }
function angle(){
  const meas = ((aB - aA) % 360 + 360) % 360;
  let g = '';
  if ($('#showPro').checked){
    let p = `<path d="M${-R} 0 A${R} ${R} 0 0 1 ${R} 0 Z" fill="rgba(221,245,239,.75)" stroke="#159A8C" stroke-width="3"/>`;
    p += `<path d="M${-R * .55} 0 A${R * .55} ${R * .55} 0 0 1 ${R * .55} 0" fill="none" stroke="#159A8C" stroke-width="1.5"/>`;
    for (let d = 0; d <= 180; d++){
      const big = d % 10 === 0, mid = d % 5 === 0, r1 = big ? R - 26 : mid ? R - 18 : R - 11;
      const c = Math.cos(rad(d)), s = -Math.sin(rad(d));
      p += `<line x1="${R * c}" y1="${R * s}" x2="${r1 * c}" y2="${r1 * s}" stroke="#0E7368" stroke-width="${big ? 2 : 1}"/>`;
      if (big){
        p += `<text x="${(R - 44) * c}" y="${(R - 44) * s + 6}" text-anchor="middle" font-size="17" font-weight="700" fill="#22314A" transform="rotate(${90 - d} ${(R - 44) * c} ${(R - 44) * s})">${d}</text>`;
        p += `<text x="${(R - 72) * c}" y="${(R - 72) * s + 5}" text-anchor="middle" font-size="13" fill="#E5546B" transform="rotate(${90 - d} ${(R - 72) * c} ${(R - 72) * s})">${180 - d}</text>`;
      }
    }
    p += `<line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#0E7368" stroke-width="2"/><circle r="5" fill="#0E7368"/><line x1="0" y1="0" x2="0" y2="-22" stroke="#0E7368" stroke-width="2"/>`;
    g += `<g transform="translate(${V[0]} ${V[1]}) rotate(${-aA})">${p}</g>`;
  }
  // 각 표시
  const r0 = 62;
  if (meas > 0){
    const [x0, y0] = pol(aA, r0), [x1, y1] = pol(aA + meas, r0);
    g += meas === 90 ? `<path d="M${pol(aA, 34).join(' ')} L${(V[0] + 34 * Math.cos(rad(aA)) + 34 * Math.cos(rad(aA + 90)))} ${(V[1] - 34 * Math.sin(rad(aA)) - 34 * Math.sin(rad(aA + 90)))} L${pol(aA + 90, 34).join(' ')}" fill="none" stroke="#E5546B" stroke-width="3"/>`
      : `<path d="M${V[0]} ${V[1]} L${x0} ${y0} A${r0} ${r0} 0 ${meas > 180 ? 1 : 0} 0 ${x1} ${y1} Z" fill="rgba(255,159,67,.3)" stroke="#FF9F43" stroke-width="2.5"/>`;
  }
  const [ax, ay] = pol(aA, 340), [bx, by] = pol(aB, 340);
  g += `<line x1="${V[0]}" y1="${V[1]}" x2="${ax}" y2="${ay}" stroke="#E5546B" stroke-width="5" stroke-linecap="round"/>`;
  g += `<line x1="${V[0]}" y1="${V[1]}" x2="${bx}" y2="${by}" stroke="#3B8FD9" stroke-width="5" stroke-linecap="round"/>`;
  g += `<circle class="handle" data-k="A" cx="${ax}" cy="${ay}" r="16" fill="#E5546B" stroke="#fff" stroke-width="4"/>`;
  g += `<circle class="handle" data-k="B" cx="${bx}" cy="${by}" r="16" fill="#3B8FD9" stroke="#fff" stroke-width="4"/>`;
  g += `<circle cx="${V[0]}" cy="${V[1]}" r="7" fill="#22314A"/><text x="${V[0] - 14}" y="${V[1] + 28}" font-size="18" fill="#22314A" font-weight="700">꼭짓점</text>`;
  $('#sv').setAttribute('viewBox', '0 0 800 470');
  $('#sv').innerHTML = g;
  $('#res').innerHTML = `각의 크기 <b>${meas}°</b> <small>${kind(meas)}${meas > 180 ? ` · 360° − ${360 - meas}°` : ''}</small>`;
}
function len(){
  const showR = !$('#noRuler').checked, mmOn = $('#mm').checked, o = OBJ[obj];
  let g = '';
  if (showR){
    g += `<rect x="${RX - 20}" y="${RY}" width="${15 * CM + 40}" height="110" rx="10" fill="#FFF4D0" stroke="#C9A64B" stroke-width="2.5"/>`;
    for (let k = 0; k <= 150; k++){
      const x = RX + k * CM / 10, h = k % 10 === 0 ? 40 : k % 5 === 0 ? 28 : 18;
      g += `<line x1="${x}" y1="${RY}" x2="${x}" y2="${RY + h}" stroke="#22314A" stroke-width="${k % 10 ? 1 : 2}"/>`;
      if (k % 10 === 0) g += `<text x="${x}" y="${RY + 66}" text-anchor="middle" font-size="22" font-weight="700" fill="#22314A">${k / 10}</text>`;
    }
    g += `<text x="${RX + 15 * CM + 4}" y="${RY + 96}" text-anchor="end" font-size="16" fill="#5D6C83">cm</text>`;
  }
  const x0 = RX + L0 * CM, x1 = RX + L1 * CM, y = RY - 52;
  g += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="44" rx="10" fill="${o[1]}" stroke="${o[2]}" stroke-width="3"/>`;
  g += `<line x1="${x0}" y1="${y + 44}" x2="${x0}" y2="${RY + 4}" stroke="${o[2]}" stroke-dasharray="4 4" stroke-width="2"/><line x1="${x1}" y1="${y + 44}" x2="${x1}" y2="${RY + 4}" stroke="${o[2]}" stroke-dasharray="4 4" stroke-width="2"/>`;
  g += `<circle class="handle" data-k="L0" cx="${x0}" cy="${y + 22}" r="16" fill="#fff" stroke="${o[2]}" stroke-width="4"/>`;
  g += `<circle class="handle" data-k="L1" cx="${x1}" cy="${y + 22}" r="16" fill="#fff" stroke="${o[2]}" stroke-width="4"/>`;
  g += `<text x="${(x0 + x1) / 2}" y="${y - 14}" text-anchor="middle" font-size="22" fill="#22314A">${o[0]}</text>`;
  $('#sv').setAttribute('viewBox', '0 0 800 420');
  $('#sv').innerHTML = g;
  const mm = Math.round((L1 - L0) * 10), cm = Math.floor(mm / 10), r = mm % 10;
  $('#res').innerHTML = `길이 <b>${mmOn ? (r ? `${cm} cm ${r} mm` : `${cm} cm`) : `약 ${Math.round(mm / 10)} cm`}</b><small>${mmOn ? `= ${mm} mm` : '가장 가까운 cm 눈금으로 읽어요'}${L0 ? ` · ${L0} cm부터 ${L1} cm까지` : ''}</small>`;
}
function render(){
  TT.press($('#tabs'), $(`#tabs [data-t="${tab}"]`));
  $('#angleSide').hidden = tab !== 'angle'; $('#lenSide').hidden = tab !== 'len';
  tab === 'angle' ? angle() : len();
  $('#res').classList.toggle('hide', tab === 'angle' ? $('#hideA').checked : $('#hideL').checked);
  $('#objs').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === obj));
  store.set('tm-pr-tab', tab);
}
let drag = null;
$('#sv').addEventListener('pointerdown', e => { const h = e.target.closest('.handle'); if (h){ drag = h.dataset.k; $('#sv').setPointerCapture(e.pointerId); e.preventDefault(); } });
$('#sv').addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt($('#sv'), e);
  if (drag === 'A' || drag === 'B'){
    const s = +$('#snapA').value; let a = Math.atan2(V[1] - p.y, p.x - V[0]) * 180 / Math.PI; a = (Math.round(a / s) * s + 360) % 360;
    if (drag === 'A'){ const m = ((aB - aA) % 360 + 360) % 360; aA = a; aB = (a + m) % 360; } else aB = a;
  } else {
    const step = $('#mm').checked ? .1 : .5; let v = Math.round(((p.x - RX) / CM) / step) * step; v = Math.max(0, Math.min(15, Math.round(v * 10) / 10));
    if (drag === 'L0') L0 = Math.min(v, L1 - .5); else L1 = Math.max(v, L0 + .5);
    L0 = Math.round(L0 * 10) / 10; L1 = Math.round(L1 * 10) / 10;
  }
  render();
});
addEventListener('pointerup', () => drag = null);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ tab = b.dataset.t; render(); } });
$('#presets').innerHTML = [30, 45, 60, 90, 120, 135, 150, 180].map(d => `<button class="tool" data-a="${d}">${d}°</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ aB = (aA + +b.dataset.a) % 360; render(); } });
$('#randA').addEventListener('click', () => { aA = TT.rnd(0, 7) * 5 * (Math.random() < .5 ? 1 : 0); aB = (aA + TT.rnd(2, 35) * 5) % 360; render(); });
$('#objs').innerHTML = OBJ.map((o, i) => `<button class="tool" data-o="${i}">${o[0]}</button>`).join('');
$('#objs').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ obj = +b.dataset.o; render(); } });
$('#zero').addEventListener('click', () => { const l = L1 - L0; L0 = 0; L1 = Math.round(l * 10) / 10; render(); });
$('#randL').addEventListener('click', () => { L0 = TT.rnd(0, 4) * ($('#mm').checked ? 1 : 1); L1 = Math.min(15, Math.round((L0 + TT.rnd(20, 100) / 10) * 10) / 10); if (!$('#mm').checked) L1 = Math.round(L1); render(); });
['showPro', 'hideA', 'mm', 'hideL', 'noRuler', 'snapA'].forEach(id => $('#' + id).addEventListener('change', render));
$('#res').addEventListener('click', () => { const id = tab === 'angle' ? '#hideA' : '#hideL'; if ($(id).checked){ $(id).checked = false; render(); } });
render();
})();
</script>
</body>
</html>
