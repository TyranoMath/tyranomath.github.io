<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>티라노 얼음 미끄럼 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g2{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}
.grid.two{gap:calc(var(--ui)*.8)}.grid.two>div{display:flex;flex-direction:column;gap:calc(var(--ui)*.45)}
@media (max-width:560px){.grid.two{grid-template-columns:1fr}.g6{grid-template-columns:repeat(3,1fr)}}
.heroI{flex:none;width:4.6em;height:4em;display:flex;align-items:center;justify-content:center}
.heroI svg,.heroI img{width:100%;height:100%}
.lvrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.lvrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.lvbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.4em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);background:var(--accent-soft);min-height:max(50px,calc(var(--ui)*3))}
.lvbox span{font-weight:800;color:var(--accent-dark)}.lvbox b{font-family:var(--title);font-weight:400;font-size:1.9em;color:var(--accent-dark);line-height:1}

#game{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 10% 16%,rgba(255,255,255,.6) 0 70px,transparent 71px),radial-gradient(circle at 92% 86%,rgba(255,255,255,.5) 0 110px,transparent 111px),var(--gbg,linear-gradient(165deg,#d5f4ec 0,#e3f6f1 46%,#dcecff 100%))}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:var(--accent-dark);text-shadow:0 2px 0 #fff;font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1f2f6b;border:3px solid var(--tc,#fff);border-radius:.9em;padding:.12em 1.4em .28em;box-shadow:0 .25em 0 rgba(31,110,100,.18);max-width:100%}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.35em;color:var(--tc,var(--accent-dark));white-space:nowrap;line-height:1.15}.rnd small{font-size:.75em;white-space:nowrap;color:#4b5a66;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
.tbs .tb.on{background:#e1f5f0;border-color:var(--accent)}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:40px;height:40px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.1em .8em}}
.guide{flex:none;margin:2px 14px 6px;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,110,100,.15);padding:8px 14px 10px;font-size:clamp(13px,1.7vmin,18px)}
.guide.min{display:none}
.gtitle{display:flex;align-items:center;justify-content:space-between}.gtitle b{font-family:var(--title);font-weight:400;color:var(--accent-dark);font-size:1.2em}
.gtog{min-height:0;height:2em;padding:0 .9em;font-size:.85em;border-radius:99px}
.gtxt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;color:#334;line-height:1.4}
.gtxt span{background:var(--accent-soft);border-radius:10px;padding:.3em .7em}

.main{flex:1;min-height:0;display:flex;gap:14px;padding:4px 14px max(12px,env(safe-area-inset-bottom));align-items:stretch;font-size:clamp(13px,1.65vmin,19px)}
.side{flex:none;width:clamp(170px,19vw,260px);background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 20px rgba(31,110,100,.16);min-height:0;overflow:auto}
.bubble{background:var(--accent-soft);border:2px solid var(--accent-line);color:var(--accent-dark);border-radius:14px;padding:.45em .7em;font-family:var(--title);font-size:1.05em;text-align:center;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.bubble.pop{animation:popb .35s}@keyframes popb{50%{transform:scale(1.07)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:#f6faf9;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:.2em 0 .3em;min-width:0}
.st small{font-size:.75em;font-weight:800;color:var(--muted);white-space:nowrap}.st b{font-family:var(--title);font-weight:400;font-size:1.6em;color:var(--accent-dark);line-height:1.1;font-variant-numeric:tabular-nums}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtns button{font-size:1em;padding:0 .3em;min-height:max(44px,calc(var(--ui)*2.6))}
.sbtns .hint{background:#fff6d6;border-color:#f2cf62}
.sbtns .wide{grid-column:1/3}
.bwrap{flex:1;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.main.port{flex-direction:column}
.main.port .side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px;gap:8px;border-radius:16px;overflow:visible}
.main.port .side .bubble{flex:1 1 100%;min-height:2.2em;font-size:.95em}
.main.port .stats{flex:1;grid-template-columns:repeat(4,1fr);gap:4px}.main.port .st b{font-size:1.25em}
.main.port .sbtns{flex:1 1 100%;grid-template-columns:repeat(4,1fr);gap:6px}.main.port .sbtns .wide{grid-column:auto}.main.port .sbtns button{min-height:40px;font-size:.88em}
.main.port .side .ponly{display:none}

.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);width:min(100%,calc(var(--ui)*32));max-height:100%;overflow:auto;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}.modal .actions button{flex:1;padding:0 .3em}
.resIcon{display:flex;justify-content:center;font-size:3.4em;line-height:1.1}.resIcon img,.resIcon svg{width:min(28vw,120px);height:auto;animation:bobp .6s ease-in-out infinite alternate}
.rstars{font-size:2.2em;letter-spacing:.08em}
@keyframes bobp{to{transform:translateY(-6px)}}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;color:#fff;z-index:60;font-family:var(--title);font-size:clamp(20px,3.8vmin,40px);line-height:1.2;padding:.3em .9em;border-radius:1em;transition:transform .25s,opacity .25s;max-width:92vw;background:var(--tc2,rgba(31,157,143,.96));border:3px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.toast small{display:block;font-family:inherit;font-size:.58em}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#game{--gbg:linear-gradient(170deg,#d8f1ff 0,#eaf8ff 50%,#e6ecff 100%)}
.iboard{position:relative;border-radius:18px;background:#9fd6f5;box-shadow:0 0 0 6px #fff,0 0 0 10px #b8e2fb,0 14px 30px rgba(40,90,140,.25);touch-action:none;user-select:none;overflow:hidden}
.igrid{position:absolute;inset:0;display:grid}
.ic{position:relative;background:linear-gradient(145deg,#eefaff,#c9ecff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset -2px -3px 0 rgba(120,190,230,.35);cursor:pointer}
.ic::after{content:"";position:absolute;left:14%;top:12%;width:30%;height:8%;border-radius:99px;background:rgba(255,255,255,.85);transform:rotate(-30deg)}
.ic.rock{background:linear-gradient(145deg,#eefaff,#c9ecff)}.ic.rock::after{display:none}
.ic.rock::before{content:"";position:absolute;inset:8%;border-radius:42% 48% 40% 50%;background:radial-gradient(circle at 35% 30%,#c6ced6,#8a96a3 60%,#5f6b78);box-shadow:0 4px 0 rgba(40,50,60,.35)}
.ic.snow{background:radial-gradient(circle at 50% 50%,#fff 0 55%,#e3f2fb 70%)}.ic.snow::after{left:auto;right:16%;top:auto;bottom:16%;width:12%;height:12%;border-radius:50%;background:#cfe6f5;transform:none}
.ic.goal::before{content:"";position:absolute;left:10%;right:10%;bottom:10%;height:62%;border-radius:999px 999px 6px 6px;background:repeating-linear-gradient(0deg,#fff 0 18%,#d6ecf8 18% 21%);box-shadow:0 0 0 2px #8fc3e3,0 4px 0 rgba(40,90,140,.25)}
.ic.goal::after{left:38%;top:auto;bottom:10%;width:24%;height:28%;border-radius:99px 99px 0 0;background:#2f5f86;transform:none}
.ic.start{background:linear-gradient(145deg,#f4fff0,#d8f5cc)}
.ic.path{box-shadow:inset 0 0 0 3px #ffcf3a}
.trail{position:absolute;inset:0;pointer-events:none}
.trail i{position:absolute;background:rgba(63,140,255,.35);border-radius:99px}
.tyr{position:absolute;left:0;top:0;pointer-events:none;transition:transform .2s linear;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));z-index:3}
.tyr.bump{animation:bump .25s}@keyframes bump{50%{translate:0 -10%}}
.tyr.win{animation:hop .4s ease-in-out infinite alternate}@keyframes hop{to{translate:0 -25%}}
.harrow{position:absolute;z-index:4;pointer-events:none;color:#ff8a3d;font-size:var(--ha,40px);text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:hb .6s ease-in-out infinite alternate;transform-origin:center}
@keyframes hb{to{opacity:.4}}
.arrows{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:6px}
.arrows button{min-height:52px;font-size:1.3em;padding:0}.arrows [data-d=U]{grid-column:2}.arrows [data-d=L]{grid-column:1;grid-row:2}.arrows [data-d=D]{grid-column:2;grid-row:2}.arrows [data-d=R]{grid-column:3;grid-row:2}
.main.port .arrows{display:none}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
.zone[hidden]{display:none!important}
#lobby .brand h1{word-break:keep-all}@media (max-width:480px){#lobby .brand h1{font-size:1.4em}}
</style></head>
<body>
<div id="lobby"><div class="lwrap">
  <header class="top"><div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 퍼즐존</div><h1>티라노 얼음 미끄럼</h1></div></div>
    <div class="top-btns"><a class="zone" id="zoneBtn" href="../puzzlezone.html" hidden>← 퍼즐존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div></header>
  <section class="hero" style="background:linear-gradient(120deg,#3fb7ff,#7ad8ff 45%,#a86cff)"><div class="heroI" id="heroI"><svg viewBox='0 0 100 100'><rect x='4' y='4' width='92' height='92' rx='14' fill='#dff4ff'/><g fill='#b9e6ff'><rect x='8' y='8' width='26' height='26' rx='5'/><rect x='37' y='37' width='26' height='26' rx='5'/><rect x='66' y='66' width='26' height='26' rx='5'/></g><circle cx='79' cy='21' r='12' fill='#8a96a3'/><path d='M66,79 a13,13 0 0 1 26,0 Z' fill='#fff' stroke='#7fb8dc' stroke-width='2'/><path d='M14,50 H58' stroke='#3f8cff' stroke-width='5' stroke-dasharray='6 5' stroke-linecap='round'/><circle cx='20' cy='50' r='9' fill='#5fc35a'/></svg></div><div><h2>미끄러운 얼음 위, 집까지 가는 길을 찾아요!</h2><p>티라노는 얼음 위에서 한 번 미끄러지면 <b>바위나 벽에 부딪힐 때까지</b> 멈추지 않아요. <b>가장 적게 움직여</b> 이글루까지 가면 별 3개! ❄️ 눈 칸에서는 딱 멈춰요.</p></div></section>
  <section class="card">
  <div class="label">난이도</div>
  <div class="grid g3" id="diffSeg"><button data-v="1">🌱 쉬움<small>7×7 · 3~5번</small></button><button data-v="2">🌳 보통<small>8×8 · 5~8번</small></button><button data-v="3">🔥 어려움<small>10×10 · 8번 이상</small></button></div>
  <div class="label">단계 <small id="lvInfo"></small></div>
  <div class="lvrow"><button class="nb" id="lvPrev">◀</button><div class="lvbox"><span>단계</span><b id="lvNum">1</b></div><button class="nb" id="lvNext">▶</button></div>
</section>

  <div class="startrow"><button class="go" id="startBtn">⛸️ 시작!</button></div>

const DINO_SVG='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 20 190 166">${tyrano('L')}</svg>`);

// ================= 티라노매스 퍼즐존 공통 틀 =================
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const TEST=/[?&]test/.test(location.search);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
document.querySelectorAll('img.dino').forEach(i=>i.src=DINO_SVG);
document.body.insertAdjacentHTML('beforeend','<div class="toast" id="toast"></div>');
let cfg={},CFG_KEY='';
function loadCfg(key,def){CFG_KEY=key;cfg=JSON.parse(JSON.stringify(def));try{const o=JSON.parse(localStorage.getItem(key)||'null');if(o)for(const k in def){if(o[k]!==undefined&&typeof o[k]===typeof def[k])cfg[k]=(typeof def[k]==='object'&&!Array.isArray(def[k]))?{...def[k],...o[k]}:o[k];}}catch(e){}}
const save=()=>{try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}};
// 세그먼트 버튼
const SEGS=[];
function bindSeg(id,key,opt={}){SEGS.push([id,key]);document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{const v=b.dataset.v;cfg[key]=typeof cfg[key]==='number'?+v:v;save();syncSegs();opt.after&&opt.after();});}
function syncSegs(){for(const [id,key] of SEGS)document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on',b.dataset.v===String(cfg[key])));GAME.sync&&GAME.sync();}
// 소리
let actx=null;const AC=()=>{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;};
function beep(f,d,type='sine',v=.1,when=0,f2){if(!cfg.sound||TEST)return;try{const a=AC();const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const SFX={click:()=>beep(600,.05,'triangle',.06),ok:(n=0)=>beep(523+n*40,.1,'triangle',.09,0,700+n*40),bad:()=>beep(180,.16,'sawtooth',.06,0,120),pop:(n=0)=>beep(500+n*60,.08,'triangle',.08,0,800+n*60),
  slide:()=>beep(300,.08,'sine',.05,0,180),hint:()=>beep(880,.12,'sine',.07,0,1200),undo:()=>beep(700,.1,'sine',.06,0,400),
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',.11,i*.1)),lose:()=>[440,370,311,262].forEach((f,i)=>beep(f,.2,'sawtooth',.06,i*.13)),
  star:()=>[784,1047,1319].forEach((f,i)=>beep(f,.14,'triangle',.09,i*.06))};
const resume=()=>{try{AC().resume&&actx.resume();}catch(e){}};
// 알림
function toast(big,small,ms=1300){const t=$('toast');t.innerHTML=big+(small?`<small>${small}</small>`:'');t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),TEST?60:ms);}
function say(t){const b=$('bubble');if(!b)return;b.innerHTML=t;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
function confetti(cols=['#ff6b8b','#ffd23a','#5fd068','#4fb6ff','#a974ff','#ff9b3d']){if(TEST)return;
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(2,98)+'vw';c.style.background=pick(cols);
    c.style.setProperty('--fy',innerHeight*rnd(.8,1.1)+'px');c.style.animationDelay=rnd(0,.5)+'s';c.style.borderRadius=Math.random()<.4?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}}
// 화면 전환
let playing=false;
function showGame(){$('lobby').classList.add('hide');$('game').classList.remove('hide');$('resultOv').classList.add('hide');$('homeOv').classList.add('hide');playing=true;requestAnimationFrame(()=>GAME.layout&&GAME.layout());}
function showLobby(){playing=false;GAME.stop&&GAME.stop();['game','resultOv','homeOv'].forEach(id=>$(id).classList.add('hide'));$('lobby').classList.remove('hide');syncSegs();}
// 결과 창: {icon,title,stars,info,next:[label,fn],again:[label,fn]}
function result(o){$('resIcon').innerHTML=o.icon||'';$('resTitle').textContent=o.title||'';$('resStars').textContent=o.stars==null?'':'⭐'.repeat(o.stars)+'☆'.repeat(3-o.stars);$('resStars').classList.toggle('hide',o.stars==null);
  $('resInfo').innerHTML=o.info||'';const nb=$('nextBtn'),ab=$('againBtn');nb.classList.toggle('hide',!o.next);if(o.next){nb.textContent=o.next[0];nb.onclick=()=>{$('resultOv').classList.add('hide');o.next[1]();};}
  ab.textContent=(o.again||['↺ 다시'])[0];ab.onclick=()=>{$('resultOv').classList.add('hide');(o.again?o.again[1]:GAME.restart)();};
  setTimeout(()=>$('resultOv').classList.remove('hide'),TEST?20:(o.delay??900));}
$('resClose').onclick=()=>$('resultOv').classList.add('hide');
function setGuide(open){$('guide').classList.toggle('min',!open);$('helpBtn').classList.toggle('on',open);$('guideTxt').innerHTML=(GAME.guide||[]).map(t=>`<span>${t}</span>`).join('');if(playing)requestAnimationFrame(()=>GAME.layout&&GAME.layout());}
function setPort(){const m=$('mainArea');if(!m)return false;const r=m.getBoundingClientRect();const p=r.height>r.width*.95;m.classList.toggle('port',p);return p;}
function bootShell(){
  $('helpBtn').onclick=()=>setGuide($('guide').classList.contains('min'));$('guideBtn').onclick=()=>setGuide(false);
  $('startBtn').onclick=()=>{resume();GAME.start();};$('setBtn').onclick=showLobby;
  $('homeBtn').onclick=()=>{if(!playing)return;if(GAME.busy&&!GAME.busy()){showLobby();return;}$('homeOv').classList.remove('hide');};
  $('homeYes').onclick=showLobby;$('homeNo').onclick=()=>$('homeOv').classList.add('hide');
  const syncSound=()=>{$('soundBtn').innerHTML=(cfg.sound?'🔊':'🔇')+'<small>소리</small>';};$('soundBtn').onclick=()=>{cfg.sound=!cfg.sound;syncSound();save();};syncSound();
  const root=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  document.querySelectorAll('.fsBtn').forEach(b=>{if(!fsOK){b.style.display='none';return;}
    b.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);}catch(e){}};});
  try{if(window.top===window)$('zoneBtn').hidden=false;}catch(e){}
  let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(playing&&GAME.layout)GAME.layout();},80);});

const DIFF={1:{n:7,rock:.17,snow:1,min:3,max:5},2:{n:8,rock:.18,snow:2,min:5,max:8},3:{n:10,rock:.17,snow:3,min:8,max:14}};
const DIRS={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
function slide(g,n,r,c,d){const [dr,dc]=DIRS[d];let path=[[r,c]];for(;;){const R=r+dr,C=c+dc;if(R<0||C<0||R>=n||C>=n||g[R][C]==='#')break;r=R;c=C;path.push([r,c]);if(g[r][c]==='s'||g[r][c]==='G')break;}return {r,c,path};}
function bfs(g,n,s){const dist=new Map(),prev=new Map(),k=(r,c)=>r*n+c;const q=[s];dist.set(k(...s),0);
  while(q.length){const [r,c]=q.shift();if(g[r][c]==='G')continue;for(const d of 'UDLR'){const t=slide(g,n,r,c,d);const kk=k(t.r,t.c);if(dist.has(kk))continue;dist.set(kk,dist.get(k(r,c))+1);prev.set(kk,[k(r,c),d]);q.push([t.r,t.c]);}}return {dist,prev};}
function genIce(diff,lv){const D=DIFF[diff],n=D.n;for(let at=0;at<500;at++){const R=mulberry(diff*7777+lv*131+at*9973);
    const g=[...Array(n)].map(()=>Array(n).fill('.'));for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(R()<D.rock)g[r][c]='#';
    const free=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]==='.')free.push([r,c]);if(free.length<n*2)continue;
    for(let i=0;i<D.snow;i++){const [r,c]=free[Math.floor(R()*free.length)];g[r][c]='s';}
    const s=free[Math.floor(R()*free.length)];if(g[s[0]][s[1]]!=='.')continue;
    // 목표 후보: 각 칸을 G로 두고 최소 횟수 계산
    const cand=[];for(const [r,c] of free){if(g[r][c]!=='.'||(r===s[0]&&c===s[1]))continue;g[r][c]='G';const {dist}=bfs(g,n,s);const d=dist.get(r*n+c);g[r][c]='.';if(d>=D.min&&d<=D.max)cand.push([r,c,d]);}
    if(!cand.length)continue;cand.sort((a,b)=>b[2]-a[2]);const pickC=cand[Math.floor(R()*Math.min(3,cand.length))];g[pickC[0]][pickC[1]]='G';
    return {n,g,s,goal:[pickC[0],pickC[1]],min:pickC[2]};}return null;}
let S=null;
const GAME={guide:['⌨️ 방향키·W·A·S·D, 화면 쓸기, ◀▲▼▶ 버튼으로 미끄러져요.','티라노는 바위나 벽에 부딪힐 때까지 계속 미끄러져요.','❄️ 눈 칸에 들어가면 그 자리에서 멈춰요.','🏠 이글루에 닿으면 성공! 가장 적게 움직이면 별 3개.','막히면 💡 힌트를 누르면 다음에 갈 방향을 알려 줘요.'],

    showGame();build();say('이글루까지 미끄러져 가요!');},
  restart(){GAME.start();},busy:()=>S&&!S.done&&S.moves>0,

const lv=()=>cfg.lv[cfg.diff]||1;function setLv(v){const u=cfg.un[cfg.diff]||1;cfg.lv[cfg.diff]=Math.max(1,Math.min(u,v));save();syncSegs();}
function build(){const n=S.n;$('igrid').style.gridTemplateColumns=`repeat(${n},1fr)`;$('igrid').style.gridTemplateRows=`repeat(${n},1fr)`;
  $('igrid').innerHTML=S.g.flatMap((row,r)=>row.map((v,c)=>`<div class="ic ${v==='#'?'rock':v==='s'?'snow':v==='G'?'goal':''} ${r===S.s[0]&&c===S.s[1]?'start':''}" data-r="${r}" data-c="${c}"></div>`)).join('');
  $('igrid').querySelectorAll('.ic').forEach(e=>e.onclick=()=>{if(!S)return;const r=+e.dataset.r,c=+e.dataset.c,[pr,pc]=S.pos;if(r===pr&&c!==pc)move(c>pc?'R':'L');else if(c===pc&&r!==pr)move(r>pr?'D':'U');});
  $('tyr').src=DINO_SVG;$('trail').innerHTML='';$('tyr').className='tyr';requestAnimationFrame(GAME.layout);}
function place(instant){const t=$('tyr');if(instant)t.style.transition='none';const [r,c]=S.pos;t.style.transform=`translate(${(c+.05)*S.cs}px,${(r+.02)*S.cs}px)`+(S.flip?' scaleX(-1)':'');if(instant){void t.offsetWidth;t.style.transition='';}}
async function move(d){if(!S||S.busy||S.done)return;resume();$('harrow').classList.add('hide');const [r,c]=S.pos;const t=slide(S.g,S.n,r,c,d);if(t.r===r&&t.c===c){SFX.bad();const e=$('tyr');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');say('그쪽은 막혀 있어요!');return;}
  S.busy=true;S.hist.push(S.pos.slice());S.moves++;$('moveT').textContent=S.moves;if(d==='L')S.flip=true;if(d==='R')S.flip=false;
  const dist=t.path.length-1;const dur=TEST?10:Math.min(700,90*dist+80);$('tyr').style.transition=`transform ${dur}ms cubic-bezier(.3,.1,.5,1)`;S.pos=[t.r,t.c];place(false);SFX.slide();
  const i=document.createElement('i');const [a,b]=t.path[0],[e,f]=t.path[t.path.length-1];const x1=Math.min(b,f),y1=Math.min(a,e),w=Math.abs(f-b)+1,h=Math.abs(e-a)+1;
  Object.assign(i.style,{left:(x1+.38)*S.cs+'px',top:(y1+.38)*S.cs+'px',width:(w-.76)*S.cs+'px',height:(h-.76)*S.cs+'px'});$('trail').appendChild(i);
  await new Promise(r=>setTimeout(r,dur+20));S.busy=false;beep(220,.08,'triangle',.06);
  const v=S.g[t.r][t.c];if(v==='s')say('❄️ 눈 칸에서 멈췄어요!');if(v==='G')win();}
function undo(){if(!S||S.busy||S.done||!S.hist.length)return;S.pos=S.hist.pop();S.moves--;$('moveT').textContent=S.moves;const tr=$('trail');tr.lastChild&&tr.lastChild.remove();place(true);SFX.undo();}

function hint(){if(!S||S.busy||S.done)return;const n=S.n,{dist,prev}=bfs(S.g,n,S.pos);const gk=S.goal[0]*n+S.goal[1];if(!dist.has(gk)){say('여기서는 갈 수 없어요. ↩ 되돌리기!');return;}
  let k=gk,d=null;while(prev.has(k)){const [p,dd]=prev.get(k);d=dd;if(p===S.pos[0]*n+S.pos[1])break;k=p;}S.hints++;$('hintN').textContent=S.hints;SFX.hint();
  const h=$('harrow');h.classList.remove('hide');const [r,c]=S.pos;const off={U:[0,-.9],D:[0,.9],L:[-.9,0],R:[.9,0]}[d];h.style.left=(c+.5+off[0])*S.cs-S.cs*.4+'px';h.style.top=(r+.5+off[1])*S.cs-S.cs*.55+'px';h.style.transform=`rotate(${({R:0,D:90,L:180,U:-90})[d]}deg)`;
  say(`${({U:'위',D:'아래',L:'왼쪽',R:'오른쪽'})[d]}으로 가 봐요! (남은 최소 ${dist.get(gk)}번)`);}
function win(){S.done=true;$('tyr').classList.add('win');SFX.win();confetti(['#3fb7ff','#ffffff','#a86cff','#ffd23a']);const st=S.moves<=S.min&&!S.hints?3:S.moves<=S.min+2?2:1;

  result({icon:'🏠',title:`${S.lv}단계 도착!`,stars:st,info:`움직임 <b>${S.moves}</b>번 · 가장 적게 가면 <b>${S.min}</b>번${S.moves>S.min?'<br>더 적게 가는 길도 찾아봐요!':'<br>가장 짧은 길로 왔어요!'}`,next:['▶ 다음 단계',()=>{setLv(S.lv+1);GAME.start();}],again:['↺ 다시',GAME.start]});postDone('iceslide-clear',{diff:S.diff,level:S.lv,stars:st});}
