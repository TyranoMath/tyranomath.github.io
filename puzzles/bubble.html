<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>티라노 버블 팡 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.g4{grid-template-columns:repeat(2,1fr)}}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}
.heroB{flex:none;width:5em;height:3.8em;position:relative}
.heroB img{position:absolute;width:2em;height:2em;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));animation:bobp 1.3s ease-in-out infinite alternate}
.trows{display:flex;flex-direction:column;gap:calc(var(--ui)*.5)}
.trow{display:flex;align-items:center;gap:.6em;border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:calc(var(--ui)*.85);padding:.4em .6em;background:#fff;flex-wrap:wrap}
.trow .tn{font-family:var(--title);font-size:1.25em;color:var(--pc);min-width:2.3em}
.trow .tch{display:flex;gap:.3em;flex:1;min-width:0}
.trow .tch button{flex:1;min-width:0;padding:.15em;min-height:0;border-radius:.7em}
.trow .tch button img{width:100%;max-width:46px;aspect-ratio:228/262;display:block;margin:auto;pointer-events:none}
.trow .tch button.on{background:color-mix(in srgb,var(--pc) 22%,#fff);border-color:var(--pc)}
.trow .keys{font-size:.8em;color:var(--muted);font-weight:800;white-space:nowrap}
.trow .keys kbd{display:inline-block;min-width:1.6em;text-align:center;border:2px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .25em;margin:0 1px;background:#f8fbfa;color:#334;font-family:inherit}
@media (max-width:620px){.trow .tch{flex-basis:100%;order:3}.trow .keys{margin-left:auto}}

#game{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(165deg,#d5f4ec 0,#e6f3ff 60%,#fde9f3 100%)}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:var(--accent-dark);text-shadow:0 2px 0 #fff;font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1f2f6b;border:3px solid #fff;border-radius:.9em;padding:.1em 1.6em .25em;box-shadow:0 .25em 0 rgba(31,110,100,.18)}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.6em;color:var(--accent-dark);white-space:nowrap;line-height:1.1;font-variant-numeric:tabular-nums}.rnd small{font-size:.72em;white-space:nowrap;color:#4b5a66}
.rnd.hurry{border-color:#ff6b6b;animation:hurry .5s ease-in-out infinite alternate}.rnd.hurry b{color:#e53e3e}
@keyframes hurry{to{transform:scale(1.08)}}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
.tbs .tb.on{background:#e1f5f0;border-color:var(--accent)}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:40px;height:40px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.1em .8em}}
.guide{flex:none;margin:2px 14px 6px;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,110,100,.15);padding:8px 14px 10px;font-size:clamp(13px,1.7vmin,18px)}
.guide.min{display:none}
.gtitle{display:flex;align-items:center;justify-content:space-between}.gtitle b{font-family:var(--title);font-weight:400;color:var(--accent-dark);font-size:1.2em}
.gtog{min-height:0;height:2em;padding:0 .9em;font-size:.85em;border-radius:99px}
.gtxt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;color:#334;line-height:1.4}
.gtxt span{background:var(--accent-soft);border-radius:10px;padding:.3em .7em}

.arena{flex:1;min-height:0;display:grid;gap:10px;padding:2px 10px max(10px,env(safe-area-inset-bottom));place-content:center}
.field{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 0 0 4px var(--pc),0 10px 22px rgba(31,60,90,.22);overflow:hidden;touch-action:none;user-select:none}
.fhead{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--pc);color:#fff;font-size:var(--fs,14px)}
.fhead img{width:1.9em;height:1.9em;object-fit:contain;object-position:50% 10%;background:#fff;border-radius:50%;flex:none}
.fhead .nm{font-family:var(--title);font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fhead .sc{margin-left:auto;font-family:var(--title);font-size:1.35em;white-space:nowrap;font-variant-numeric:tabular-nums}
.fhead .sg{font-size:.75em;font-weight:800;background:rgba(255,255,255,.25);border-radius:99px;padding:.05em .55em;white-space:nowrap}
.fbody{position:relative;flex:1;min-height:0;
  background:radial-gradient(ellipse 70% 18% at 20% 98%,#8fdc8a 0 98%,transparent 100%),radial-gradient(ellipse 80% 16% at 85% 100%,#7ccf79 0 98%,transparent 100%),
  radial-gradient(circle at 80% 12%,rgba(255,255,255,.9) 0 7%,transparent 7.5%),linear-gradient(180deg,#bfe7ff 0,#e2f4ff 55%,#f4fbef 80%,#d9f2c9 100%)}
.fbody canvas{position:absolute;inset:0;width:100%;height:100%}
.pchar{position:absolute;bottom:.5%;width:21%;aspect-ratio:228/262;pointer-events:none;transform-origin:50% 100%}
.pchar.joy{animation:jump .45s ease-in-out 2}
.pchar.sad{animation:sad .5s ease-in-out 2}
.fmsg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-family:var(--title);color:#fff;background:var(--pc);border:3px solid #fff;
  border-radius:1em;padding:.2em .8em;white-space:nowrap;font-size:var(--fm,22px);transition:transform .2s,opacity .2s;box-shadow:0 5px 0 rgba(0,0,0,.15);text-align:center;z-index:3}
.fmsg small{display:block;font-family:inherit;font-size:.55em}
.fmsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.field.shake .fbody{animation:fshake .12s linear 3}
@keyframes fshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes jump{50%{transform:translateY(-18%) rotate(-5deg)}}
@keyframes sad{50%{transform:rotate(-8deg) translateY(4%)}}
@keyframes bobp{to{transform:translateY(-6px)}}
.count{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--title);font-size:min(30vmin,220px);color:#fff;text-shadow:0 8px 0 rgba(31,110,100,.35),0 0 30px rgba(31,157,143,.6);z-index:30;pointer-events:none;animation:cnt .9s ease-out}
@keyframes cnt{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}to{transform:translate(-50%,-50%) scale(1)}}

.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);
  width:min(100%,calc(var(--ui)*34));max-height:100%;overflow:auto;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}
.modal .actions button{flex:1}
.res{display:flex;flex-direction:column;gap:.45em;text-align:left}
.rrow{display:flex;align-items:center;gap:.7em;border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:calc(var(--ui)*.8);padding:.4em .7em;background:#fff}
.rrow.first{background:#fff8e1;border-color:#ffd56b;border-left-color:var(--pc)}
.rrow img{width:2.4em;height:auto}
.medal{font-size:1.6em;width:1.3em;text-align:center;flex:none}
.rname{font-weight:800;font-size:1.05em}
.rstat{font-size:.8em;color:var(--muted);margin-top:.1em}
.rscore{margin-left:auto;font-family:var(--title);font-size:1.4em;color:var(--pc);white-space:nowrap}
.resChar{display:flex;justify-content:center}.resChar img{width:min(30vw,130px);height:auto;animation:bobp .6s ease-in-out infinite alternate}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
#lobby .top-btns .tmr-btn{flex:none}
.zone[hidden]{display:none!important}
</style></head>
<body>
<div id="lobby">
  <div class="lwrap">
    <header class="top">
      <div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 퍼즐존</div><h1>티라노 버블 팡</h1></div></div>
      <div class="top-btns"><a class="zone" id="zoneBtn" href="../puzzlezone.html" hidden>← 퍼즐존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div>
    </header>
    <section class="hero" style="background:linear-gradient(120deg,#ff7fae,#8f7bff 55%,#4fb6ff)">
      <div class="heroB" id="heroB"></div>
      <div><h2>같은 색 3개를 붙이면 팡!</h2>
        <p>방울을 쏘아 <b>같은 색 3개 이상</b>을 이어 붙이면 터져요. 매달린 곳이 끊긴 방울은 <b>우수수</b> 떨어져 점수가 두 배! 정해진 시간 동안 점수를 가장 많이 모아요.</p></div>
    </section>
    <section class="card">
      <div class="label">함께하는 사람</div>
      <div class="grid g4" id="pSeg"><button data-v="1">🙋 1명</button><button data-v="2">👥 2명</button><button data-v="3">👥 3명</button><button data-v="4">👥 4명</button></div>
      <div class="label">시간</div>
      <div class="grid g4" id="tSeg"><button data-v="60">⏱ 1분</button><button data-v="120">⏱ 2분</button><button data-v="180">⏱ 3분</button><button data-v="300">⏱ 5분</button></div>
      <div class="label">난이도</div>
      <div class="grid g3" id="dSeg"><button data-v="easy">🌱 쉬움<small>4가지 색 · 천천히 내려와요</small></button><button data-v="normal">🌳 보통<small>5가지 색</small></button><button data-v="hard">🔥 어려움<small>6가지 색 · 빨리 내려와요</small></button></div>
      <div class="label">조준선</div>
      <div class="grid g2" id="aSeg"><button data-v="on">🎯 보이기<small>튕기는 길까지 점선으로</small></button><button data-v="off">🙈 숨기기<small>화살표만 보여요</small></button></div>
    </section>
    <section class="card">
      <div class="label">플레이어 꾸미기 <small>캐릭터를 골라요</small></div>
      <div id="pRows" class="trows"></div>
    </section>
    <div class="startrow"><button class="go" id="startBtn">🫧 버블 팡 시작!</button></div>
    <p class="copy">© 2026 TyranoMath 백태진 All rights reserved.</p>
  </div>
</div>

<div id="game" class="hide">
  <div class="gbar"><div class="ttl"><img class="dino" alt=""><span>티라노 버블 팡</span></div>
    <div class="mid"><div class="rnd" id="timerBox"><b id="timerT">02:00</b><small id="timerS">남은 시간</small></div></div>
    <div class="tbs"><button id="helpBtn" class="tb" aria-label="방법">📖<small>방법</small></button>
      <button id="homeBtn" class="tb home" aria-label="처음으로">🏠<small>처음으로</small></button>
      <button id="soundBtn" class="tb" aria-label="소리">🔊</button><button class="fsBtn tb" aria-label="전체 화면">⛶<small>전체</small></button></div></div>
  <div class="guide min" id="guide"><div class="gtitle"><b>📖 이렇게 해요</b><button id="guideBtn" class="gtog">닫기 ✕</button></div><div class="gtxt" id="guideTxt"></div></div>
  <div class="arena" id="arena"></div>
  <div class="count hide" id="countEl">3</div>
</div>

<div class="overlay hide" id="homeOv"><div class="modal">
  <h2>잠깐 멈췄어요</h2><p class="help">처음으로 가면 지금 하던 게임은 끝나요.</p>
  <div class="actions"><button id="homeNo">▶ 계속하기</button><button class="primary" id="homeYes">🏠 처음으로</button></div>
</div></div>
<div class="overlay hide" id="resultOv"><div class="modal">
  <div class="resChar" id="resChar"></div>
  <h2 id="resTitle">시간 끝!</h2>
  <div class="res" id="resList"></div>

function rowLen(row){return row.odd?7:8;}

function layoutField(f){const D=DIFF[cfg.diff],rng=mulberry(G.seed+f.stage*977),nc=D.nc;const k=Math.min(D.rows+Math.floor((f.stage-1)/2),8);
  f.rows=[];for(let r=0;r<MAXR+2;r++)f.rows.push(newRow(r%2===1,false));
  for(let r=0;r<k;r++){const row=f.rows[r];for(let c=0;c<row.c.length;c++){let col=Math.floor(rng()*nc);
    if(rng()<.5){const nb=neighbors(f,r,c).filter(([rr,cc])=>f.rows[rr].c[cc]>=0);if(nb.length){const [rr,cc]=nb[Math.floor(rng()*nb.length)];col=f.rows[rr].c[cc];}}row.c[c]=col;}}

function neighbors(f,r,c){const out=[],row=f.rows[r];

function colorsIn(f){const s=new Set();for(const row of f.rows)for(const v of row.c)if(v>=0)s.add(v);return [...s];}

function shoot(f){if(f.state!=='play'||f.proj||game.state!=='run')return;const a=f.angle;

      if(r>0&&!neighbors(f,r,c).some(([rr,cc])=>f.rows[rr].c[cc]>=0))continue;const [cx,cy]=cellXY(f,r,c);const d=(cx-p.x)**2+(cy-p.y)**2;if(!best||d<best.d)best={d,r,c};}}
  if(!best){for(let r=0;r<f.rows.length&&!best;r++){const row=f.rows[r];for(let c=0;c<row.c.length;c++)if(row.c[c]<0){best={r,c};break;}}}

    // 매달린 곳 확인

// ---------- 조작 ----------

// ---------- 그리기 루프 ----------
function step(dt){if(!G)return;

  for(const f of G.fields){if(game.state==='run'||game.state==='count')keyAim(f,dt);

    f.fx=f.fx.filter(e=>e.t==='pop'?e.age<.35+e.dl:e.t==='drop'?e.y<H+2:e.age<1);}}

    for(const e of f.fx){if(e.t==='pop'){const a=e.age-e.dl;if(a<0){x.drawImage(SPR[e.col],e.x-1,e.y-1,2,2);continue;}const k=a/.35;x.globalAlpha=1-k;const s=1+k*.7;x.drawImage(SPR[e.col],e.x-s,e.y-s,2*s,2*s);

        for(let i=0;i<6;i++){const an=i*1.047+e.x;x.fillStyle=i%2?'#fff':BC[e.col].l;x.beginPath();x.arc(e.x+Math.cos(an)*(1+k*2.2),e.y+Math.sin(an)*(1+k*2.2),.18*(1-k)+.05,0,7);x.fill();}x.globalAlpha=1;}
      else if(e.t==='drop'){x.globalAlpha=e.gray?.55:1;x.save();x.translate(e.x,e.y);x.rotate(e.age*e.vx);x.drawImage(SPR[e.col],-1,-1,2,2);x.restore();x.globalAlpha=1;}
      else if(e.t==='txt'){const k=e.age;x.globalAlpha=Math.max(0,1-k*k);x.font=`${e.big?1.25:1.05}px Jua, sans-serif`;x.textAlign='center';x.lineWidth=.28;x.strokeStyle='#fff';
        const ty=e.y-k*2;x.strokeText(e.s,e.x,ty);x.fillStyle=e.big?'#ff5a8a':TCOL[f.i];x.fillText(e.s,e.x,ty);x.globalAlpha=1;}}
    // 조준선
    const a=f.angle;
    if(cfg.aim==='on'&&f.state==='play'&&!f.proj){const pts=trace(f,a);x.fillStyle='rgba(255,255,255,.95)';let carry=0;
      for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],L=Math.hypot(x1-x0,y1-y0);let d=carry;
        while(d<L){const t=d/L;x.beginPath();x.arc(x0+(x1-x0)*t,y0+(y1-y0)*t,.13,0,7);x.fill();d+=.7;}carry=d-L;}}
    // 발사대
    x.save();x.translate(W/2,LY);
    x.fillStyle='#8a5a2b';x.beginPath();x.arc(0,.9,2.1,Math.PI,0);x.fill();x.fillStyle='#c9925a';x.beginPath();x.arc(0,.9,1.75,Math.PI,0);x.fill();
    x.rotate(-a);x.fillStyle=TCOL[f.i];x.strokeStyle='#fff';x.lineWidth=.12;
    x.beginPath();x.moveTo(1.1,-.28);x.lineTo(3.2,-.28);x.lineTo(3.2,-.62);x.lineTo(4.1,0);x.lineTo(3.2,.62);x.lineTo(3.2,.28);x.lineTo(1.1,.28);x.closePath();x.fill();x.stroke();x.restore();
    if(f.state==='play'&&!f.proj)x.drawImage(SPR[f.cur],W/2-1,LY-1,2,2);
    // 다음 방울
    x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(W/2-3.6,LY+.9,1.05,0,7);x.fill();
    if(f.state==='play')x.drawImage(SPR[f.proj?f.cur:f.next],W/2-4.35,LY+.15,1.5,1.5);
    x.font='.62px Jua, sans-serif';x.textAlign='center';x.fillStyle='#2f6b5f';x.lineWidth=.22;x.strokeStyle='#fff';x.strokeText('다음',W/2-3.6,LY-.4);x.fillText('다음',W/2-3.6,LY-.4);
    // 날아가는 방울
    if(f.proj)x.drawImage(SPR[f.proj.col],f.proj.x-1,f.proj.y-1,2,2);}}
