<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티라노 픽셀 아트 · TyranoMath</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="puzzle.css">
<style>
.canvas-area{flex:1; min-width:0; height:100%; display:grid; place-items:center}
.easel{background:#fff; border:5px solid var(--line); border-radius:18px; padding:8px; box-shadow:0 7px 0 var(--line)}
#art{display:block; touch-action:none; cursor:crosshair; image-rendering:pixelated;
  background-color:#fff; background-image:linear-gradient(45deg,#F2ECE0 25%,transparent 25%,transparent 75%,#F2ECE0 75%),linear-gradient(45deg,#F2ECE0 25%,transparent 25%,transparent 75%,#F2ECE0 75%);
  background-size:16px 16px; background-position:0 0, 8px 8px; border-radius:6px}
.side{width:min(340px, 33vw)}
.sec{background:#fff; border:3px solid var(--line); border-radius:18px; padding:10px}
.sec h4{margin:0 0 8px; font-family:'Jua',sans-serif; font-weight:400; color:var(--purple-d); font-size:clamp(14px,1.3vw,18px); display:flex; align-items:center; gap:8px}
.palette{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
.sw{aspect-ratio:1; border-radius:10px; border:3px solid #fff; box-shadow:0 0 0 2px var(--line); padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--purple); transform:scale(1.1)}
.cur{display:flex; align-items:center; gap:8px; margin-top:8px; font-family:'Jua',sans-serif; font-size:15px}
.cur input[type=color]{width:44px; height:36px; border:3px solid var(--line); border-radius:10px; padding:0; background:#fff; cursor:pointer}
.curbox{width:36px; height:36px; border-radius:10px; border:3px solid var(--line)}
.toolgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.toolgrid button{border-radius:12px; border:3px solid var(--line); background:#fff; padding:7px 2px; font-family:'Jua',sans-serif; font-size:clamp(13px,1.25vw,16px); box-shadow:0 3px 0 var(--line); display:flex; flex-direction:column; align-items:center; gap:2px}
.toolgrid button span{font-size:1.4em; line-height:1}
.toolgrid button[aria-pressed="true"]{background:var(--purple); border-color:var(--purple-d); color:#fff; box-shadow:0 3px 0 var(--purple-d)}
.toolgrid button:active{transform:translateY(2px)}
@media (max-aspect-ratio: 1/1){
  .canvas-area{height:auto; width:100%}
  .side{width:min(100%, 560px)}
  .palette{grid-template-columns:repeat(16,1fr); gap:4px}
  .sw{border-width:2px; border-radius:7px}
  .toolgrid{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="../puzzlezone.html" hidden>← 퍼즐존</a>
  <div class="title"><span class="dino-logo"></span>티라노 픽셀 아트</div>
  <span class="pill" id="sizePill">16×16</span>
  <button class="pill" id="saveBtn">💾 그림 저장</button>
</div>

<div class="main">
  <div class="canvas-area" id="area"><div class="easel"><canvas id="art" aria-label="픽셀 그림판"></canvas></div></div>
  <div class="side">
    <div class="sec">
      <h4>🎨 색깔</h4>
      <div class="palette" id="palette"></div>
      <div class="cur"><span class="curbox" id="curbox"></span>지금 색 <input type="color" id="picker" aria-label="내 마음대로 색 고르기"><span style="font-family:'Gowun Dodum';font-size:12px;color:var(--muted)">← 다른 색</span></div>
    </div>
    <div class="sec">
      <h4>🛠️ 도구</h4>
      <div class="toolgrid" id="tools">
        <button data-t="pen" aria-pressed="true"><span>✏️</span>연필</button>
        <button data-t="eraser"><span>🧽</span>지우개</button>
        <button data-t="fill"><span>🪣</span>채우기</button>
        <button data-t="pick"><span>💧</span>색 뽑기</button>
        <button id="mirror" aria-pressed="false"><span>🪞</span>좌우 대칭</button>
        <button id="gridBtn" aria-pressed="true"><span>#</span>격자</button>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="undo">↶ 되돌리기</button>
      <button class="tool" id="redo">↷ 다시 하기</button>
      <button class="tool" id="newBtn">🆕 새 그림</button>
      <button class="tool" id="clear">🗑️ 모두 지우기</button>
    </div>
    <p class="note">그린 그림은 이 기기에 자동으로 저장돼요. 💾 그림 저장을 누르면 그림 파일(PNG)로 내려받아요.</p>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="sheet">
    <span class="dino-logo big"></span>
    <h1>🎨 티라노 픽셀 아트</h1>
    <p>작은 네모 칸을 하나씩 칠해서 나만의 픽셀 그림을 만들어요! 대칭 기능으로 멋진 무늬도 그릴 수 있어요.</p>
    <h3>판 크기</h3>
    <div class="chips" id="sizeChips">
      <button data-n="16">16×16<small>쉽고 빠르게</small></button>
      <button data-n="24">24×24<small>조금 더 자세히</small></button>
      <button data-n="32">32×32<small>정성껏 크게</small></button>
    </div>
    <h3>어떻게 시작할까요?</h3>
    <div class="chips" id="tplChips">
      <button data-tpl="blank">⬜ 빈 판<small>처음부터 그리기</small></button>
      <button data-tpl="outline">🖍️ 티라노 색칠하기<small>테두리만 있어요 (16×16)</small></button>
      <button data-tpl="dino">🦖 티라노 따라 그리기<small>완성 그림 보고 고치기 (16×16)</small></button>
    </div>
    <div class="row">
      <button class="btn" id="go">시작하기 🖌️</button>
      <button class="btn alt" id="resume" hidden>이어서 그리기</button>
    </div>
  </div>
</div>

<script src="puzzle-common.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const { store } = TM;
const COLORS = ['#22314A','#5D6C83','#B8C2D0','#FFFFFF','#5CC46F','#2F8A47','#E8F7C8','#8A6233',
                '#FF9F43','#FFD43B','#E5546B','#FF8FA3','#8E5BD6','#3B8FD9','#4FC3F7','#F3D2A8'];
/* 16×16 티라노 모양 (g 초록, b 배, w 흰자, k 눈동자·입, o 등 가시) — 테두리는 자동으로 그려요 */
const DINO = [
  '................',
  '.........ggggg..',
  '........gwkgggg.',
  '........ggggggg.',
  '........gggkkkk.',
  '........ggggg...',
  '.......gggg.....',
  '....oggggggg....',
  '...ogggbbgggg...',
  '.ggggggbbbgg....',
  '..gggggbbbgg....',
  '....gggbbgg.....',
  '.....gggggg.....',
  '.....gg..gg.....',
  '....ggg.ggg.....',
  '................'
];
const MAP = { k:'#22314A', g:'#5CC46F', b:'#E8F7C8', w:'#FFFFFF', o:'#FF9F43', line:'#22314A' };

const cv = $('#art'), ctx = cv.getContext('2d');
let N = Number(store.get('tm-pixel-n') || 16), tpl = 'blank', px = [], color = COLORS[4], tool = 'pen', mirror = false, showGrid = true;
let undoStack = [], redoStack = [], drawing = false, last = null, stroke = null;

/* ---------- 판 ---------- */
function makeBlank(n){ return Array.from({ length: n * n }, () => null); }
function loadTemplate(name){
  if (name === 'blank') return makeBlank(N);
  N = 16; const out = makeBlank(16);
  const filled = (x, y) => x >= 0 && y >= 0 && x < 16 && y < 16 && DINO[y][x] !== '.';
  DINO.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '.'){
      // 색칠하기 판: 눈동자·입만 남기고 안쪽은 비워요
      out[y * 16 + x] = name === 'outline' ? (ch === 'k' ? MAP.k : null) : MAP[ch];
      return;
    }
    // 위·아래·왼쪽·오른쪽에 모양이 닿으면 테두리 (채우기가 새어 나가지 않는 닫힌 선이 돼요)
    if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) out[y * 16 + x] = MAP.line;
  }));
  return out;
}
function fit(){
  const area = $('#area'), portrait = innerHeight > innerWidth;
  const avail = Math.min((portrait ? innerWidth - 28 : area.clientWidth) - 36, (portrait ? innerHeight * .55 : area.clientHeight) - 36);
  const cell = Math.max(6, Math.floor(avail / N));
  const size = cell * N, dpr = devicePixelRatio || 1;
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv.dataset.cell = cell;
  draw();
}
function draw(){
  const cell = +cv.dataset.cell, size = cell * N;
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < N * N; i++){
    if (!px[i]) continue;
    ctx.fillStyle = px[i]; ctx.fillRect((i % N) * cell, Math.floor(i / N) * cell, cell, cell);
  }
  if (showGrid){
    ctx.strokeStyle = 'rgba(34,49,74,.13)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 1; k < N; k++){ ctx.moveTo(k * cell + .5, 0); ctx.lineTo(k * cell + .5, size); ctx.moveTo(0, k * cell + .5); ctx.lineTo(size, k * cell + .5); }
    ctx.stroke();
    if (mirror){ ctx.strokeStyle = 'rgba(142,91,214,.7)'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size); ctx.stroke(); ctx.setLineDash([]); }
  }
}
function save(){ try { store.set('tm-pixel-save', JSON.stringify({ n: N, px })); } catch(e){} }

/* ---------- 그리기 ---------- */
function paint(i, c){
  if (i < 0 || i >= N * N) return;
  const set = idx => { if (px[idx] !== c){ stroke.push([idx, px[idx]]); px[idx] = c; } };
  set(i);
  if (mirror){ const x = i % N, y = Math.floor(i / N); set(y * N + (N - 1 - x)); }
}
function floodFill(i, c){
  const target = px[i]; if (target === c) return;
  const q = [i], seen = new Set([i]);
  while (q.length){
    const k = q.pop(), x = k % N, y = Math.floor(k / N);
    stroke.push([k, px[k]]); px[k] = c;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, j = ny * N + nx;
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && !seen.has(j) && px[j] === target){ seen.add(j); q.push(j); }
    });
  }
}
function cellAt(e){
  const r = cv.getBoundingClientRect(), cell = r.width / N;
  const x = Math.floor((e.clientX - r.left) / cell), y = Math.floor((e.clientY - r.top) / cell);
  return x >= 0 && y >= 0 && x < N && y < N ? [x, y] : null;
}
function lineCells(a, b){                     // 빨리 그어도 칸이 끊기지 않게 (브레젠햄)
  const out = []; let [x0, y0] = a; const [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (;;){ out.push([x0, y0]); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy){ err += dy; x0 += sx; } if (e2 <= dx){ err += dx; y0 += sy; } }
  return out;
}
cv.addEventListener('pointerdown', e => {
  const p = cellAt(e); if (!p) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const i = p[1] * N + p[0];
  if (tool === 'pick'){ if (px[i]) setColor(px[i]); setTool('pen'); return; }
  stroke = [];
  if (tool === 'fill'){ floodFill(i, color); commit(); return; }
  drawing = true; last = p;
  paint(i, tool === 'eraser' ? null : color); draw();
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = cellAt(e); if (!p) return;
  lineCells(last, p).forEach(([x, y]) => paint(y * N + x, tool === 'eraser' ? null : color));
  last = p; draw();
});
const endStroke = () => { if (drawing){ drawing = false; commit(); } };
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
function commit(){
  if (stroke && stroke.length){ undoStack.push(stroke); if (undoStack.length > 80) undoStack.shift(); redoStack = []; }
  stroke = null; draw(); save();
}

/* ---------- 도구 ---------- */
function setColor(c){
  color = c; $('#curbox').style.background = c; $('#picker').value = c.length === 7 ? c : '#000000';
  $('#palette').querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c.toLowerCase() === c.toLowerCase()));
  if (tool === 'eraser' || tool === 'pick') setTool('pen');
}
function setTool(t){ tool = t; $('#tools').querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t)); }
$('#palette').innerHTML = COLORS.map(c => `<button class="sw" data-c="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('');
$('#palette').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) setColor(b.dataset.c); });
$('#picker').addEventListener('input', e => setColor(e.target.value));
$('#tools').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) setTool(b.dataset.t); });
$('#mirror').addEventListener('click', e => { mirror = !mirror; e.currentTarget.setAttribute('aria-pressed', mirror); draw(); });
$('#gridBtn').addEventListener('click', e => { showGrid = !showGrid; e.currentTarget.setAttribute('aria-pressed', showGrid); draw(); });
$('#undo').addEventListener('click', () => { const s = undoStack.pop(); if (!s) return; const redo = s.map(([i]) => [i, px[i]]); [...s].reverse().forEach(([i, v]) => px[i] = v); redoStack.push(redo); draw(); save(); });
$('#redo').addEventListener('click', () => { const s = redoStack.pop(); if (!s) return; const undo = s.map(([i]) => [i, px[i]]); [...s].reverse().forEach(([i, v]) => px[i] = v); undoStack.push(undo); draw(); save(); });
$('#clear').addEventListener('click', () => {
  if (!px.some(Boolean) || !confirm('그림을 모두 지울까요?')) return;
  undoStack.push(px.map((v, i) => [i, v]).filter(([, v]) => v)); redoStack = [];
  px = makeBlank(N); draw(); save();
});
$('#newBtn').addEventListener('click', showStart);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); (e.shiftKey ? $('#redo') : $('#undo')).click(); }
});
/* 그림 파일로 저장 (칸 하나 = 20픽셀) */
$('#saveBtn').addEventListener('click', () => {
  const S = 20, out = document.createElement('canvas'); out.width = out.height = N * S;
  const c = out.getContext('2d');
  px.forEach((v, i) => { if (v){ c.fillStyle = v; c.fillRect((i % N) * S, Math.floor(i / N) * S, S, S); } });
  out.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `티라노-픽셀아트-${N}x${N}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
});
window.addEventListener('resize', () => { if (px.length) fit(); });

/* ---------- 시작 화면 ---------- */
let saved = null; try { saved = JSON.parse(store.get('tm-pixel-save') || 'null'); } catch(e){}
function syncStart(){
  document.querySelectorAll('#sizeChips button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.n) === N && tpl === 'blank'));
  document.querySelectorAll('#tplChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tpl === tpl));
  $('#resume').hidden = !(saved && saved.px && saved.px.some(Boolean));
}
function showStart(){ try { saved = JSON.parse(store.get('tm-pixel-save') || 'null'); } catch(e){} syncStart(); $('#startOv').hidden = false; }
$('#sizeChips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; N = Number(b.dataset.n); tpl = 'blank'; store.set('tm-pixel-n', N); syncStart(); });
$('#tplChips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tpl = b.dataset.tpl; if (tpl !== 'blank') N = 16; syncStart(); });
function begin(data, n){
  N = n; px = data; undoStack = []; redoStack = [];
  $('#sizePill').textContent = `${N}×${N}`; $('#startOv').hidden = true; fit(); save();
}
$('#go').addEventListener('click', () => begin(loadTemplate(tpl), tpl === 'blank' ? N : 16));
$('#resume').addEventListener('click', () => begin(saved.px, saved.n));

setColor(COLORS[4]); syncStart();
window.__pixel = { get px(){ return px; }, get N(){ return N; } };
})();
</script>
</body>
</html>
