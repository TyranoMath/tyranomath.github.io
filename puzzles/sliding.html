<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>티라노 슬라이딩 퍼즐 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;700&display=swap">
<style>
/* TyranoMath 퍼즐존 스타일 · 넓은 화면은 판 오른쪽에, 세로 화면은 판 아래에 도구가 와요 */
:root{
  --bg:#FFF8EC; --surface:#ffffff; --ink:#22314A; --muted:#5D6C83; --line:#ECDFC8;
  --accent:#8E5BD6; --accent-d:#6C3FB4; --accent-ink:#ffffff; --accent-soft:#EFE6FF;
  --green:#4CB963; --green-d:#2F8A47;
  --board:#2F3E56; --board-cell:rgba(255,255,255,.07);
  --tile:#FFD45A; --tile-edge:#E0A526; --tile-ink:#5A3D00;
  --good:#4CB963; --overlay:rgba(255,248,236,.82);
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;word-break:keep-all;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:1680px;margin:0 auto;padding:10px 16px 14px;
  display:grid;gap:12px;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(200px,1fr) auto;grid-template-areas:"top" "stage" "panel";overflow:auto}
@media (min-aspect-ratio:5/4) and (min-width:760px){
  .app{grid-template-columns:minmax(0,1fr) clamp(280px,27vw,420px);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top top" "stage panel";gap:14px clamp(16px,2vw,32px)}
}

/* 상단 (퍼즐존 공통 모양) */
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.back{text-decoration:none;font-family:var(--font-display);background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;white-space:nowrap}
.title{font-family:var(--font-display);font-size:clamp(20px,2.4vw,30px);color:var(--accent-d);display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.title svg{width:40px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--font-display);background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:clamp(14px,1.4vw,19px);white-space:nowrap}
.pill b{font-family:"Fredoka",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.icons{display:flex;gap:6px}
.icon-btn{width:46px;height:46px;border-radius:14px;border:3px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"] .on,.icon-btn[aria-pressed="true"] .off{display:none}

/* 판 */
.stage{grid-area:stage;min-height:0;min-width:0;display:grid;place-items:center;position:relative}
.board{position:relative;background:var(--board);border-radius:clamp(14px,2%,26px);padding:var(--pad,10px);border:4px solid var(--ink);
  box-shadow:0 8px 0 var(--line);touch-action:none;max-width:100%}
.grid{position:relative;width:100%;height:100%;background-image:linear-gradient(var(--board-cell),var(--board-cell));border-radius:10px}
.tile{position:absolute;left:0;top:0;padding:var(--gap,4px);transition:transform .14s cubic-bezier(.2,.8,.3,1);will-change:transform;cursor:pointer}
.face{position:relative;width:100%;height:100%;border-radius:12%;overflow:hidden;
  display:grid;place-items:center;font-family:"Fredoka",var(--font-display);font-weight:700;font-size:var(--fs,40px);line-height:1}
.tile.num .face{background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 calc(var(--fs)*-.12) 0 var(--tile-edge),0 2px 0 rgba(0,0,0,.25)}
.tile.num .face span{transform:translateY(-5%)}
.tile.pic .face{background-repeat:no-repeat;box-shadow:0 2px 0 rgba(0,0,0,.3);border-radius:8%}
.badge{position:absolute;left:6%;top:6%;min-width:1.7em;padding:.15em .35em;border-radius:999px;font-size:calc(var(--fs)*.42);
  background:rgba(255,255,255,.9);color:var(--ink);text-align:center;display:none;font-variant-numeric:tabular-nums}
.board.helper .tile.pic .badge{display:block}
.board.helper .tile.ok .face{outline:calc(var(--gap)*.9) solid var(--good);outline-offset:calc(var(--gap)*-.9)}
.board.peek .tile{transition-duration:.25s}
.board.peek::after{content:"정답 모양";position:absolute;left:50%;top:-14px;transform:translate(-50%,-100%);
  background:var(--accent);color:#fff;font-family:var(--font-display);padding:4px 14px;border-radius:999px;font-size:15px;white-space:nowrap}
.full-img{position:absolute;inset:var(--pad);border-radius:10px;background-size:cover;opacity:0;transition:opacity .5s;pointer-events:none}
.board.won .full-img{opacity:1}

/* 완성 창 (퍼즐존 공통 모양) */
.win{position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;background:var(--overlay);z-index:5}
.win-card{background:#fff;border:4px solid var(--line);border-radius:28px;padding:clamp(16px,3vw,30px);text-align:center;width:min(88%,400px);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.win-card .big-dino{width:clamp(70px,10vw,110px)}
.win-card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,40px);color:var(--accent-d)}
.win-card p{margin:0;color:var(--muted)}
.win-card .rec{font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px);color:var(--ink);font-variant-numeric:tabular-nums}
.win-card .new{display:inline-block;background:#FFF1B8;color:#946200;border-radius:999px;padding:2px 12px;font-family:var(--font-display)}
.again{border:0;border-radius:18px;padding:12px 30px;background:var(--green);color:#fff;font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px);box-shadow:0 5px 0 var(--green-d);cursor:pointer}
.again:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.wobble{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) translateY(-6px)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* 도구 */
.panel{grid-area:panel;min-height:0;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (min-aspect-ratio:5/4) and (min-width:760px){.panel{overflow:auto;padding:2px 2px 8px}}
.group{display:flex;flex-direction:column;gap:7px;min-width:0}
.label{font-family:var(--font-display);font-size:clamp(16px,1.5vw,19px);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:3px solid var(--line);background:#fff;border-radius:16px;min-height:50px;cursor:pointer;font-family:var(--font-display);
  font-size:clamp(17px,1.6vw,22px);box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-d);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.choice{border:3px solid var(--line);background:#fff;border-radius:16px;padding:5px 5px 4px;cursor:pointer;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:manipulation;min-width:0}
.choice img,.choice .up{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;display:block;object-fit:cover}
.choice .up{display:grid;place-items:center;border:3px dashed var(--line);color:var(--muted);font-size:28px;font-family:var(--font-display)}
.choice span{font-family:var(--font-display);font-size:14px;white-space:nowrap}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent-d)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:52px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 4px 0 var(--line);
  font-family:var(--font-display);font-size:clamp(17px,1.6vw,22px);display:flex;align-items:center;justify-content:center;gap:8px;touch-action:none;padding:0 8px;white-space:nowrap;min-width:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
@media (max-width:520px){.btn{font-size:16px;gap:5px}.btn svg{width:17px;height:17px}}
.btn.primary{grid-column:1/-1;background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d)}
.tip{font-size:13px;color:var(--muted);line-height:1.55;margin:0;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 세로 화면: 판 아래에 도구를 작게 */
@media not ((min-aspect-ratio:5/4) and (min-width:760px)){
  .panel{gap:10px}
  .choices{display:flex;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
  .choice{flex:0 0 clamp(62px,15vw,96px)}
  .lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:end}
  .actions{grid-template-columns:repeat(3,1fr)}
  .btn.primary{grid-column:auto}
  .tip{display:none}
}
@media (max-width:520px){
  .lower{grid-template-columns:1fr !important}
  .top{gap:6px}
  .title{font-size:19px}
  .title svg{width:30px}
  .pill{padding:2px 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.tile,.full-img,.wobble{transition:none;animation:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <a class="back" id="back" href="../puzzlezone.html" hidden>← 퍼즐존</a>
    <div class="title"><span class="dino-logo"></span>티라노 슬라이딩 퍼즐</div>
    <div class="stats" aria-live="polite">
      <span class="pill">👣 <b id="sMoves">0</b>번</span>
      <span class="pill">⏱ <b id="sTime">0:00</b></span>
      <span class="pill">🏆 <b id="sBest">–</b></span>
    </div>
    <div class="icons">
      <button class="icon-btn" id="bSound" aria-pressed="true" aria-label="효과음">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="bFull" aria-label="전체 화면" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board" role="application" aria-label="슬라이딩 퍼즐 판. 조각을 누르거나 밀어서 옮기세요. 키보드 화살표로도 움직입니다.">
      <div class="grid" id="grid"></div>
      <div class="full-img" id="fullImg"></div>
    </div>
  </main>

  <aside class="panel">
    <div class="group">
      <div class="label">그림 고르기</div>
      <div class="choices" id="choices"></div>
      <input type="file" id="fileIn" accept="image/*" class="sr" tabindex="-1">
    </div>
    <div class="lower">
      <div class="group">
        <div class="label">크기</div>
        <div class="seg" id="sizes">
          <button data-n="3" aria-pressed="false">3×3</button>
          <button data-n="4" aria-pressed="false">4×4</button>
          <button data-n="5" aria-pressed="false">5×5</button>
        </div>
      </div>
      <div class="group">
        <div class="label">놀이 도구</div>
        <div class="actions">
          <button class="btn primary" id="bShuffle"><svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5M18 14l3 3-3 3M3 17h3c1.6 0 2.8-1.6 3.9-3.6M13.6 9.6C14.6 8 15.6 7 17 7h4M18 4l3 3-3 3"/></svg>섞기</button>
          <button class="btn" id="bPeek"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>정답 보기</button>
          <button class="btn" id="bHelp" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>도우미</button>
        </div>
      </div>
    </div>
    <p class="tip">🦖 조각을 <b>누르거나 밀면</b> 빈칸으로 움직입니다. 빈칸과 같은 줄에 있는 조각을 누르면 한 줄이 한꺼번에 밀립니다. <b>정답 보기</b>는 누르고 있는 동안만 보입니다. <b>도우미</b>를 켜면 그림 조각에 번호가 나오고, 제자리에 온 조각은 초록 테두리로 표시됩니다.</p>
  </aside>
</div>

<script src="puzzle-common.js"></script>
<script src="../assets/rank.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- picture painters (all drawn in code, 720px square) ---------- */
  const S = 720;
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const C = (ctx, x, y, r, f) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = f; ctx.fill(); };
  const E = (ctx, x, y, rx, ry, f, rot=0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI*2); ctx.fillStyle = f; ctx.fill(); };
  const P = (ctx, pts, f) => { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i], pts[i+1]); ctx.closePath(); ctx.fillStyle = f; ctx.fill(); };
  function star(ctx, x, y, R, r, n, f, rot=-Math.PI/2){ const pts=[]; for(let i=0;i<n*2;i++){ const a=rot+i*Math.PI/n, rr=i%2?r:R; pts.push(x+Math.cos(a)*rr, y+Math.sin(a)*rr);} P(ctx, pts, f); }

  function paintDino(ctx){
    let g = ctx.createLinearGradient(0,0,0,S); g.addColorStop(0,'#86cff0'); g.addColorStop(.7,'#dff5ff'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
    // sun
    ctx.save(); ctx.translate(605,115); ctx.strokeStyle='#ffc83d'; ctx.lineWidth=10; ctx.lineCap='round';
    for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(72,0); ctx.lineTo(96,0); ctx.stroke(); }
    ctx.restore(); C(ctx,605,115,60,'#ffd84a');
    // volcano
    P(ctx,[300,470,470,190,520,190,700,470],'#8e6fa8'); P(ctx,[470,190,520,190,545,232,500,215,455,234],'#ff7a3d');
    [[495,150,26],[530,110,32],[575,72,38]].forEach(([x,y,r])=>C(ctx,x,y,r,'rgba(120,110,130,.55)'));
    // clouds
    [[130,120],[330,70]].forEach(([x,y])=>{ C(ctx,x,y,34,'#fff'); C(ctx,x+40,y-12,42,'#fff'); C(ctx,x+86,y,32,'#fff'); E(ctx,x+42,y+16,74,22,'#fff'); });
    // hills
    E(ctx,170,560,330,150,'#83c96e'); E(ctx,620,600,300,160,'#6ab95c'); ctx.fillStyle='#57a94e'; ctx.fillRect(0,610,S,110);
    // palm tree
    ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=22; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(95,640); ctx.quadraticCurveTo(70,470,120,330); ctx.stroke();
    [[-2.6,'#2f9a4e'],[-1.9,'#3fb35d'],[-1.2,'#2f9a4e'],[-0.4,'#3fb35d'],[-3.3,'#3fb35d']].forEach(([a,c])=>E(ctx,120+Math.cos(a)*60,330+Math.sin(a)*40,72,20,c,a));
    C(ctx,112,345,12,'#7a4a1e'); C(ctx,132,348,12,'#7a4a1e');
    // dino
    const body='#3fae6a', dark='#2d8a51';
    P(ctx,[210,455,30,560,90,575,230,525],body);
    ctx.strokeStyle=body; ctx.lineWidth=78; ctx.beginPath(); ctx.moveTo(400,450); ctx.quadraticCurveTo(460,400,480,330); ctx.stroke();
    for(let i=0;i<6;i++){ const a=Math.PI*1.08+i*0.17, x=340+Math.cos(a)*160, y=470+Math.sin(a)*100; P(ctx,[x-26,y+6,x,y-46,x+26,y+6],'#ff8a3d'); }
    E(ctx,340,475,165,100,body);
    E(ctx,345,512,110,52,'#bfe8a6');
    [[260,600],[400,600]].forEach(([x,y])=>{ ctx.fillStyle=dark; ctx.beginPath(); ctx.roundRect(x-30,y-80,62,98,20); ctx.fill(); });
    [[245,455,16],[300,425,11],[390,440,14],[440,470,9]].forEach(([x,y,r])=>C(ctx,x,y,r,dark));
    E(ctx,505,318,80,60,body,-0.15);
    C(ctx,522,298,19,'#fff'); C(ctx,527,300,10,'#1d2a22'); C(ctx,531,295,4,'#fff');
    ctx.strokeStyle='#1d2a22'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(540,330,30,0.2,1.2); ctx.stroke();
    C(ctx,572,305,5,'#1d2a22'); E(ctx,490,345,14,9,'#ff9fb2');
    // flowers
    const r = rng(7); for(let i=0;i<14;i++){ const x=20+r()*680, y=640+r()*70; ['#fff','#ffe066','#ff8fab'].forEach((c,k)=>k===i%3 && [0,1,2,3,4].forEach(j=>C(ctx,x+Math.cos(j*1.256)*9,y+Math.sin(j*1.256)*9,7,c))); C(ctx,x,y,5,'#f59f00'); }
  }

  function paintSpace(ctx){
    let g = ctx.createRadialGradient(360,320,40,360,360,520); g.addColorStop(0,'#3b2a7a'); g.addColorStop(1,'#0a0a28'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
    const r = rng(42); for(let i=0;i<170;i++){ C(ctx,r()*S,r()*S,r()*2.4+.6,`rgba(255,255,255,${.35+r()*.65})`); }
    [[90,560],[660,300],[300,90]].forEach(([x,y])=>star(ctx,x,y,14,4,4,'#fff6c2'));
    // comet
    g = ctx.createLinearGradient(420,60,620,200); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(180,230,255,.9)');
    ctx.strokeStyle=g; ctx.lineWidth=8; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(420,60); ctx.lineTo(620,200); ctx.stroke(); C(ctx,622,202,10,'#d6f3ff');
    // ringed planet
    ctx.save(); ctx.translate(205,225); ctx.rotate(-0.35);
    ctx.strokeStyle='#ffd59a'; ctx.lineWidth=16; ctx.beginPath(); ctx.ellipse(0,0,185,48,0,Math.PI,Math.PI*2); ctx.stroke();
    g = ctx.createLinearGradient(-110,-110,110,110); g.addColorStop(0,'#ffb06b'); g.addColorStop(1,'#e04f6e'); C(ctx,0,0,112,g);
    ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(-112,-30,224,18); ctx.fillRect(-112,24,224,12);
    ctx.strokeStyle='#ffd59a'; ctx.beginPath(); ctx.ellipse(0,0,185,48,0,0,Math.PI); ctx.stroke(); ctx.restore();
    // moon

  /* ---------- state ---------- */
  const saved = store.get('tm-slide-prefs', {});

  /* ---------- board sizing ---------- */

  function build(){

      const t = document.createElement('div');

  function place(){
    const total=N*N;
    for(let i=0;i<total;i++){
      const v = peeking ? (i+1 < total ? i+1 : 0) : cells[i];
      if(!v) continue;
      const el=els[v]; el.style.transform = `translate(${(i%N)*100}%, ${Math.floor(i/N)*100}%)`;
      el.classList.toggle('ok', !peeking && v === i+1);
    }
  }

  function isSolved(){ for(let i=0;i<N*N-1;i++) if(cells[i] !== i+1) return false; return true; }

  function shuffle(){
    const total=N*N; cells = Array.from({length:total},(_,i)=> i+1<total ? i+1 : 0);
    let e = total-1, prev = -1;
    const steps = N*N*40;
    do{
      for(let k=0;k<steps;k++){
        const r=Math.floor(e/N), c=e%N, opts=[];
        if(r>0) opts.push(e-N); if(r<N-1) opts.push(e+N); if(c>0) opts.push(e-1); if(c<N-1) opts.push(e+1);
        const choices = opts.filter(o=>o!==prev); const n = choices[Math.floor(Math.random()*choices.length)];
        cells[e]=cells[n]; cells[n]=0; prev=e; e=n;
      }
      // misplaced count check so the puzzle is never trivially close to solved
    }while(cells.filter((v,i)=>v && v!==i+1).length < Math.ceil((total-1)*.6));
  }

  function newGame(){
    won=false; moves=0; elapsed=0; stopTimer(); updateStats();
    boardEl.classList.remove('won'); document.querySelector('.win')?.remove();

    boardEl.classList.toggle('helper', helper);
    savePrefs();
  }

  function tryMoveAt(pos){
    if(won || peeking) return false;
    const e=cells.indexOf(0), er=Math.floor(e/N), ec=e%N, r=Math.floor(pos/N), c=pos%N;
    if(pos===e || pos<0 || pos>=N*N) return false;
    let count=0;
    if(r===er){ const s = c<ec ? -1 : 1; for(let x=ec; x!==c; x+=s){ cells[r*N+x]=cells[r*N+x+s]; count++; } }
    else if(c===ec){ const s = r<er ? -1 : 1; for(let y=er; y!==r; y+=s){ cells[y*N+c]=cells[(y+s)*N+c]; count++; } }
    else{ nudge(pos); return false; }
    cells[pos]=0;
    moves+=count; if(moves===count && !timer) TMRank.start(String(N), `${N}×${N}`); if(!timer) startTimer();

    return true;
  }
  function moveDir(dir){
    const e=cells.indexOf(0), er=Math.floor(e/N), ec=e%N;
    if(dir==='left' && ec<N-1) return tryMoveAt(e+1);
    if(dir==='right' && ec>0) return tryMoveAt(e-1);
    if(dir==='up' && er<N-1) return tryMoveAt(e+N);
    if(dir==='down' && er>0) return tryMoveAt(e-N);

  function updateStats(){

    const b = store.get(bestKey(), null); $('sBest').textContent = b ? b.moves : '–';
  }

  function win(){
    won=true; stopTimer(); elapsed=(performance.now()-t0)/1000; updateStats();

        ${isNew ? '<div class="new">새 최고 기록</div>' : (prev ? `<p>최고 기록 ${prev.moves}번</p>` : '')}

    const w=cv.width=boardEl.clientWidth, h=cv.height=boardEl.clientHeight, ctx=cv.getContext('2d');
    const cols=['#FFD43B','#4CB963','#E5546B','#3B8FD9','#8E5BD6','#FF9F43'];
    const ps=Array.from({length:130},()=>({x:w/2,y:h*.45,vx:(Math.random()-.5)*w*.025,vy:-Math.random()*h*.025-h*.006,s:4+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));

  /* ---------- input: tap, swipe, drag (touch, pen, mouse) ---------- */
  const active = new Map();
  function posAt(x,y){ const r=grid.getBoundingClientRect(); const c=Math.floor((x-r.left)/(r.width/N)), rr=Math.floor((y-r.top)/(r.height/N));
    return (c<0||rr<0||c>=N||rr>=N) ? -1 : rr*N+c; }

    if(e.target.closest('.win')) return;

    if(dist<th){ if(s.pos>=0) tryMoveAt(s.pos); return; }
    const horiz=Math.abs(dx)>Math.abs(dy), dir= horiz ? (dx<0?'left':'right') : (dy<0?'up':'down');
    const e0=cells.indexOf(0), er=Math.floor(e0/N), ec=e0%N, r=Math.floor(s.pos/N), c=s.pos%N;
    const toward = s.pos>=0 && ((horiz && r===er && ((c<ec&&dx>0)||(c>ec&&dx<0))) || (!horiz && c===ec && ((r<er&&dy>0)||(r>er&&dy<0))));
    if(toward) tryMoveAt(s.pos); else moveDir(dir);
  });
  boardEl.addEventListener('pointercancel', e=>active.delete(e.pointerId));

  document.addEventListener('keydown', e=>{
    const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
    if(m && !e.target.closest('input')){ e.preventDefault(); moveDir(m); }
  });

  /* ---------- controls ---------- */
  const choicesEl=$('choices');
  function drawChoices(){
    choicesEl.innerHTML='';
    PICS.forEach(p=>{
      const b=document.createElement('button'); b.className='choice'; b.setAttribute('aria-pressed', p.id===pic);
      b.innerHTML=`<img alt="" src="${p.thumb}"><span>${p.name}</span>`;
      b.onclick=()=>{ if(pic===p.id) return; pic=p.id; drawChoices(); newGame(); };
      choicesEl.appendChild(b);
    });
    const u=document.createElement('button'); u.className='choice'; u.innerHTML='<div class="up">+</div><span>사진 넣기</span>';
    u.onclick=()=>$('fileIn').click(); choicesEl.appendChild(u);
  }
  $('fileIn').addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=S; const ctx=c.getContext('2d');
      const m=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      const url=c.toDataURL('image/jpeg',.9);
      const ex=PICS.find(p=>p.id==='photo');
      if(ex){ ex.url=ex.thumb=url; } else PICS.push({ id:'photo', name:'내 사진', url, thumb:url });
      pic='photo'; drawChoices(); newGame();
    }; img.src=rd.result; };
    rd.readAsDataURL(f); e.target.value='';
  });

  document.querySelectorAll('#sizes button').forEach(b=>{
    b.onclick=()=>{ N=+b.dataset.n; syncSizes(); newGame(); };
  });
  function syncSizes(){ document.querySelectorAll('#sizes button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.n===N)); }

  $('bShuffle').onclick=()=>{ beep(330,.08); newGame(); };

  const peekBtn=$('bPeek');
  const peekOn=e=>{ if(won) return; e && e.preventDefault(); peeking=true; boardEl.classList.add('peek'); place(); };
  const peekOff=()=>{ if(!peeking) return; peeking=false; boardEl.classList.remove('peek'); place(); };
  peekBtn.addEventListener('pointerdown', e=>{ try{ peekBtn.setPointerCapture(e.pointerId); }catch(_){} peekOn(e); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>peekBtn.addEventListener(t, peekOff));
  peekBtn.addEventListener('keydown', e=>{ if((e.key===' '||e.key==='Enter') && !e.repeat){ peekOn(e); } });
  peekBtn.addEventListener('keyup', peekOff);
  peekBtn.addEventListener('contextmenu', e=>e.preventDefault());

  const helpBtn=$('bHelp');
  helpBtn.onclick=()=>{ helper=!helper; helpBtn.setAttribute('aria-pressed',helper); boardEl.classList.toggle('helper',helper); savePrefs(); };

  const soundBtn=$('bSound');
  soundBtn.onclick=()=>{ sound=!sound; soundBtn.setAttribute('aria-pressed',sound); savePrefs(); if(sound) beep(660); };

  const fullBtn=$('bFull');
  if(document.fullscreenEnabled || document.webkitFullscreenEnabled){
    fullBtn.hidden=false;
    fullBtn.onclick=()=>{ try{
      if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else{ const el=document.documentElement; const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); p && p.catch && p.catch(()=>{}); }
    }catch(_){} };
  }

  // keep the screen awake on whiteboards and tablets
  async function wake(){ try{ if(navigator.wakeLock && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(_){} }
  document.addEventListener('visibilitychange', wake); wake();

  /* ---------- start ---------- */
  async function start(){
    try{ await Promise.race([ Promise.all([document.fonts.load('40px Jua'), document.fonts.load('16px "Gowun Dodum"')]), new Promise(r=>setTimeout(r,1500)) ]); }catch(_){}
    PICS.forEach(p=>{ p.thumb = render(p.paint); if(!p.isNum) p.url = p.thumb; });
    syncSizes(); helpBtn.setAttribute('aria-pressed',helper); soundBtn.setAttribute('aria-pressed',sound);
    drawChoices(); newGame();
  }
  start();
})();
</script>
</body>
</html>
