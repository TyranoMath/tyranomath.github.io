<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>티라노 틱택토 · TyranoMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2faf7; --panel:#ffffff; --ink:#22303f; --muted:#6f7d88;
  --accent:#1f9d8f; --accent-dark:#167a6f; --accent-ink:#ffffff; --accent-soft:#e1f5f0; --accent-line:#bfe6dd;
  --green:#4cb662; --green-dark:#36924b; --orange:#ff9f43; --orange-dark:#e9852a;
  --line:#dfe9e6; --navy:#1f2f6b;
  --shadow:0 8px 28px rgba(31,110,100,.14);
  --title:"Jua","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ui:clamp(13px, calc(1.1vmin + 7px), 26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{font:inherit;font-weight:700;border-radius:calc(var(--ui)*.85);border:2px solid var(--line);border-bottom-width:4px;
  background:var(--panel);color:var(--ink);cursor:pointer;min-height:max(44px,calc(var(--ui)*2.7));padding:0 calc(var(--ui)*.8);
  touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s;white-space:nowrap}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark)}
button.go{background:var(--orange);color:#fff;border-color:var(--orange-dark)}
button:disabled{opacity:.45}
@media (hover:hover) and (pointer:fine){button:hover:not(.on):not(.primary):not(.go):not(:disabled){background:var(--accent-soft);border-color:var(--accent-line)}}
.hide{display:none!important}

/* ---------- 설정 화면 ---------- */
#lobby{position:fixed;inset:0;overflow:auto;font-size:var(--ui);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 20% 0%,#dff6ef 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#e6f0ff 0,transparent 50%),var(--bg)}
.lwrap{max-width:calc(var(--ui)*48);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--ui)*.8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand img{width:calc(var(--ui)*3);height:auto}
.kicker{font-size:.72em;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-family:var(--title);font-weight:400;font-size:1.75em;line-height:1.1;color:var(--accent-dark)}
.top-btns{display:flex;gap:.45em;align-items:center}
.zone{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.9em;background:var(--accent);color:#fff;
  border-radius:99px;padding:0 1em;min-height:max(40px,calc(var(--ui)*2.3));white-space:nowrap}
.icon-btn{width:max(44px,calc(var(--ui)*2.7));padding:0;flex:none}
.hero{display:flex;align-items:center;gap:1em;background:linear-gradient(120deg,#3a8dff,#37c3d6);color:#fff;border-radius:calc(var(--ui)*1.2);
  padding:calc(var(--ui)*.9) calc(var(--ui)*1.2);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{margin:0;font-family:var(--title);font-weight:400;font-size:1.6em}
.hero p{margin:.25em 0 0;font-size:.88em;opacity:.95;line-height:1.45}
.hero .plane{font-size:3em;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.card{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.1);padding:calc(var(--ui)*.9);
  display:flex;flex-direction:column;gap:calc(var(--ui)*.55)}
.label{font-size:.9em;font-weight:800;color:var(--accent-dark);display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label small{font-weight:600;color:var(--muted);font-size:.85em}
.grid{display:grid;gap:calc(var(--ui)*.45)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.cnt button{min-height:max(54px,calc(var(--ui)*3.4));font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1.1}
.cnt button small{font-size:.7em;opacity:.85;font-weight:600}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--ui)*10),1fr));gap:calc(var(--ui)*.5)}
.pl{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);border-radius:calc(var(--ui)*.85);padding:.35em .6em;background:var(--panel)}
.pl i{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pl input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-weight:700;color:var(--ink);font-size:max(16px,1em)}
.pl kbd{font-family:inherit;font-size:.68em;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:.15em .4em;white-space:nowrap}
.dans button{font-size:1em;padding:0}
.dans{grid-template-columns:repeat(8,1fr)}
.numrow{display:flex;gap:calc(var(--ui)*.45);align-items:stretch}
.numrow .nb{flex:1;min-width:0;padding:0;font-size:1.1em}
.numbox{flex:2.2;display:flex;align-items:center;justify-content:center;gap:.35em;border:2px solid var(--accent-line);border-radius:calc(var(--ui)*.85);
  background:var(--accent-soft);padding:0 .6em;min-height:max(48px,calc(var(--ui)*2.9))}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{width:3.2em;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--title);font-size:max(20px,1.6em);
  color:var(--accent-dark);text-align:center;-moz-appearance:textfield}
.numbox input::-webkit-inner-spin-button,.numbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox span{font-weight:800;color:var(--accent-dark)}
#numSeg button{min-height:max(38px,calc(var(--ui)*2.3))}
#numSeg{grid-template-columns:repeat(5,1fr)!important}
.grid.g3 button{white-space:normal;line-height:1.15;word-break:keep-all;padding:.2em .3em}
.help{font-size:.82em;color:var(--muted);line-height:1.5;margin:0}
.startrow{display:flex;gap:.6em}
.startrow button{flex:1;min-height:max(60px,calc(var(--ui)*3.6));font-size:1.25em;font-family:var(--title);font-weight:400}
@media (max-width:560px){.dans{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}

.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media (max-width:560px){.g6{grid-template-columns:repeat(3,1fr)}}
.grid button small{display:block;font-size:.72em;font-weight:600;opacity:.85}
.grid button{white-space:normal;line-height:1.2;padding:.3em .3em}
.chars button{padding:.3em .2em .25em;min-height:0}
.chars button img{width:100%;max-width:64px;aspect-ratio:228/262;height:auto;display:block;margin:0 auto .15em;pointer-events:none}
.chars button small{font-size:.78em}
.boards{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
@media (max-width:560px){.boards{grid-template-columns:repeat(2,1fr)}}
.boards button{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.5em .3em;min-height:0;border-radius:1em}
.boards button b{font-family:var(--title);font-weight:400;font-size:1.2em;color:#8b86d6}
.boards button.on b{color:#fff}
.boards button small{font-size:.72em;opacity:.85}
.bpv svg{width:4.2em;height:4.2em;display:block}
.opps{display:grid;grid-template-columns:repeat(2,1fr);gap:.5em}
.opps button{display:flex;align-items:center;gap:.6em;padding:.5em .9em;text-align:left;min-height:max(56px,calc(var(--ui)*3.3))}
.opps .oi{font-size:1.8em}.opps b{display:block}.opps small{display:block;font-size:.75em;opacity:.8;font-weight:600}
.mk{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.2em;background-size:contain;background-repeat:no-repeat}

#game{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 60px,transparent 61px),radial-gradient(circle at 88% 82%,rgba(255,255,255,.45) 0 90px,transparent 91px),linear-gradient(160deg,#c9dcff 0,#d8d2ff 45%,#ffd9cf 45.2%,#ffe8c7 100%)}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;font-size:clamp(12px,1.6vmin,20px)}
.gbar .ttl{display:flex;align-items:center;gap:.45em;font-family:var(--title);color:#5b5fa8;text-shadow:0 2px 0 #fff;font-size:1.25em;white-space:nowrap;min-width:0}
.gbar .ttl img{width:1.9em;height:auto}
.gbar .mid{flex:1;display:flex;justify-content:center;min-width:0}
.rnd{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1f2f6b;border:3px solid #fff;border-radius:.9em;padding:.15em 1.4em .3em;box-shadow:0 .25em 0 rgba(0,0,0,.15)}
.rnd b{font-family:var(--title);font-weight:400;font-size:1.35em;color:#e98a7a;white-space:nowrap;line-height:1.15}.rnd small{font-size:.75em;white-space:nowrap;color:#4b5a66}
.tbs{display:flex;gap:6px}
.tbs .tb{width:54px;height:50px;min-height:0;padding:0;border-radius:14px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbs .tb small{font-size:9.5px;font-weight:800;color:var(--muted)}
.tbs .tb.home{background:var(--orange);border-color:var(--orange-dark)}.tbs .tb.home small{color:#fff}
.tbs .tb.on{background:#e1f5f0;border-color:var(--accent)}
@media (max-width:600px){.gbar .ttl span{display:none}.tbs .tb{width:40px;height:40px;font-size:15px}.tbs .tb small{display:none}.rnd{padding:.1em .8em}}
.guide{flex:none;margin:2px 14px 6px;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:8px 14px 10px;font-size:clamp(13px,1.7vmin,18px)}
.guide.min{display:none}
.gtitle{display:flex;align-items:center;justify-content:space-between}.gtitle b{font-family:var(--title);font-weight:400;color:#8b86d6;font-size:1.2em}
.gtog{min-height:0;height:2em;padding:0 .9em;font-size:.85em;border-radius:99px}
.gtxt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;color:#334;line-height:1.4}
.gtxt span{background:#f3f0ff;border-radius:10px;padding:.3em .7em}

.main{flex:1;min-height:0;display:flex;gap:16px;padding:6px 14px max(14px,env(safe-area-inset-bottom));align-items:center;justify-content:center}
.main.port{flex-direction:column;gap:10px}
.main.port .pcard{order:-1}
.main.port .pcards{display:flex}
.bwrap{position:relative;flex:none}
.tboard{position:relative;background:#fff;border-radius:calc(var(--bs)*.05);box-shadow:0 14px 30px rgba(120,110,170,.25),0 0 0 6px rgba(255,255,255,.75);padding:calc(var(--bs)*.04);transform:rotate(-1deg)}
.grid3{display:grid;position:relative}
.cellT{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cellT::before{content:'';position:absolute;inset:0;border-right:2px solid #dcd6f0;border-bottom:2px solid #dcd6f0}
.cellT.lc::before{border-right:0}.cellT.lr::before{border-bottom:0}
.cellT:hover:not(.full)::after{content:'';position:absolute;inset:12%;border-radius:20%;background:rgba(160,140,230,.12)}
.cellT.lock{cursor:default}
.cellT svg{position:relative;width:78%;height:78%;filter:drop-shadow(0 4px 3px rgba(120,110,170,.22))}
.cellT svg.put{animation:put .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes put{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.cellT.old svg{opacity:.45}
.cellT.old::after{content:'';position:absolute;inset:10%;border:3px dashed #f2a99c;border-radius:50%;animation:spinD 6s linear infinite}
@keyframes spinD{to{transform:rotate(360deg)}}
.cellT svg.gone{animation:gone .35s ease-in forwards}
@keyframes gone{to{transform:scale(.2);opacity:0}}
.cellT.win svg{animation:winp .6s ease-in-out infinite alternate}
@keyframes winp{to{transform:scale(1.15)}}
.cellT.hintC{background:rgba(255,210,63,.35);border-radius:12%}
.winLine{position:absolute;inset:0;pointer-events:none}
.winLine line{stroke:#ff4d5a;stroke-width:10;stroke-linecap:round;stroke-dasharray:2000;stroke-dashoffset:2000;animation:drawL .6s ease-out forwards;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
@keyframes drawL{to{stroke-dashoffset:0}}
/* 메가 */
.mega{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.sub{position:relative;padding:5%;border-right:4px solid #b9b3dc;border-bottom:4px solid #b9b3dc;transition:background .2s}
.sub.lc{border-right:0}.sub.lr{border-bottom:0}
.sub .grid3{width:100%;height:100%}
.sub .cellT::before{border-width:1.5px}
.sub.act{background:#fff6e9;box-shadow:inset 0 0 0 4px #f6b98a;border-radius:10px}
.sub.done .grid3{opacity:.28}
.sub .big{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sub .big svg{width:92%;height:92%;filter:drop-shadow(0 6px 4px rgba(20,30,80,.3));animation:put .45s cubic-bezier(.3,1.6,.6,1)}
.turnTag{position:absolute;left:50%;top:calc(var(--bs)*-.02);transform:translate(-50%,-60%);background:#8b86d6;color:#fff;font-weight:900;font-size:clamp(12px,1.8vmin,18px);border-radius:10px;padding:.25em .8em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pcard{flex:none;width:clamp(150px,17vw,230px);background:#fff;border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 20px rgba(120,110,170,.2);border:4px solid transparent;transition:transform .25s,border-color .25s;opacity:.85}
.pcard.turn{border-color:#ffd59a;transform:scale(1.05);opacity:1}
.pcard .pimg{width:72%;max-width:140px;aspect-ratio:228/262}
.pcard.turn .pimg{animation:bobp 1s ease-in-out infinite alternate}
@keyframes bobp{to{transform:translateY(-6px)}}
.pcard .pn{font-family:var(--title);font-size:clamp(16px,2.2vmin,24px);color:#5b5fa8;display:flex;align-items:center;gap:.3em}
.pcard .pn i{width:1.1em;height:1.1em;display:inline-block}
.pcard .ps{font-family:var(--title);font-size:clamp(26px,4.5vmin,48px);color:#e98a7a;line-height:1}
.pcard .pl{font-size:.8em;color:var(--muted);font-weight:800}
.pcard .think{font-size:.85em;font-weight:900;color:#8b86d6;min-height:1.2em}
.main.port .pcard{width:auto;flex-direction:row;padding:6px 12px;gap:10px;border-radius:16px}
.main.port .pcard .pimg{width:48px}
.main.port .pcards-row{display:flex;gap:10px}
.resChar{display:flex;justify-content:center;gap:10px}.resChar img{width:min(30vw,130px);height:auto;animation:bobp .6s ease-in-out infinite alternate}
.conf{position:fixed;width:10px;height:14px;top:-20px;z-index:55;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fy)) rotate(600deg);opacity:.3}}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;color:#fff;z-index:60;
  font-family:var(--title);font-size:clamp(20px,3.6vmin,36px);line-height:1.2;padding:.3em .9em;border-radius:1em;transition:transform .25s,opacity .25s;max-width:92vw;background:rgba(139,134,214,.96);border:3px solid #fff}
.toast small{display:block;font-family:inherit;font-size:.6em}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.main.port{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;align-items:start;justify-items:stretch}
.main.port .bwrap{grid-column:1/3;align-self:center;justify-self:center;margin-top:14px}
.main.port .pcard{order:0;width:auto}
.main.port .pcard .ps{font-size:clamp(22px,4vmin,34px)}
.main.port .pcard .pn{font-size:clamp(13px,2vmin,18px)}
.main.port #pc0{grid-column:1;grid-row:1}.main.port #pc1{grid-column:2;grid-row:1}.main.port .bwrap{grid-row:2}
/* ---------- 모달 / 결과 ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,30,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;font-size:var(--ui)}
.modal{background:var(--panel);border:2px solid var(--accent-line);border-radius:calc(var(--ui)*1.2);padding:calc(var(--ui)*1.2);
  width:min(100%,calc(var(--ui)*34));max-height:100%;overflow:auto;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:.1em 0 .35em;font-family:var(--title);font-weight:400;font-size:2em;color:var(--accent-dark)}
.modal .actions{display:flex;gap:.5em;margin-top:.9em}
.modal .actions button{flex:1}
.res{display:flex;flex-direction:column;gap:.5em;text-align:left}
.rrow{display:flex;align-items:center;gap:.7em;border:2px solid var(--line);border-left:8px solid var(--pc);border-radius:calc(var(--ui)*.8);padding:.5em .7em;background:#fff}
.rrow.first{background:#fff8e1;border-color:#ffd56b;border-left-color:var(--pc)}
.medal{font-size:1.8em;width:1.3em;text-align:center;flex:none}
.rname{font-weight:800;font-size:1.05em}
.rstat{font-size:.8em;color:var(--muted);margin-top:.15em}
.rscore{margin-left:auto;font-family:var(--title);font-size:1.6em;color:var(--accent-dark);white-space:nowrap}
.wrongs{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.35em}
.wrongs span{font-size:.75em;background:#ffecec;color:#c23b3b;border-radius:99px;padding:.1em .55em;font-weight:700}
.stars{font-size:2.2em;letter-spacing:.1em;margin:.1em 0 .3em}
.windino{width:calc(var(--ui)*4.5);height:auto}
.copy{text-align:center;color:#8A94A6;font-size:13px;margin:18px 0 6px}
#lobby .top-btns .tmr-btn{flex:none}
.zone[hidden]{display:none!important}
</style></head>
<body>
<div id="lobby">
  <div class="lwrap">
    <header class="top">
      <div class="brand"><img class="dino" alt="티라노"><div><div class="kicker">TyranoMath 퍼즐존</div><h1>티라노 틱택토</h1></div></div>
      <div class="top-btns"><a class="zone" id="zoneBtn" href="../puzzlezone.html" hidden>← 퍼즐존</a><button class="icon-btn fsBtn" title="전체 화면" aria-label="전체 화면">⛶</button></div>
    </header>
    <section class="hero" style="background:linear-gradient(120deg,#a9b8f5,#f6b3a6)">
      <div class="plane">⭕</div>
      <div><h2>한 줄을 먼저 만들어요!</h2>
        <p id="heroTxt">번갈아 가며 ✖와 ⭕를 놓아요. 가로·세로·대각선으로 <b>3개를 먼저 이으면</b> 이겨요!</p></div>
    </section>
    <section class="card">
      <div class="label">판 고르기</div>
      <div class="boards" id="boardSeg">
        <button data-v="3"><span class="bpv" data-n="3"></span><b>3×3</b><small>3개 잇기</small></button>
        <button data-v="5"><span class="bpv" data-n="5"></span><b>5×5</b><small>4개 잇기</small></button>
        <button data-v="6"><span class="bpv" data-n="6"></span><b>6×6</b><small>4개 잇기</small></button>
        <button data-v="mega"><span class="bpv" data-n="mega"></span><b>메가</b><small>9개 판을 하나로</small></button>

 `<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="28" fill="none" stroke="#d97f78" stroke-width="22" opacity=".4"/><circle cx="50" cy="50" r="28" fill="none" stroke="url(#gO)" stroke-width="22"/><path d="M30,36 A26,26 0 0 1 52,24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/></svg>`];
const markURL=i=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MARK[i].replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace(/url\(#g[XO]\)/,i?'#ffb3a3':'#9dbdf5'));
document.querySelectorAll('.mk.x').forEach(e=>e.style.backgroundImage=`url("${markURL(0)}")`);document.querySelectorAll('.mk.o').forEach(e=>e.style.backgroundImage=`url("${markURL(1)}")`);

// ---------- 설정 ----------
let cfg={board:'3',rule:'classic',opp:'ai',ai:'normal',c1:'tyrano',c2:'fennec',sound:true};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.board)cfg={...cfg,...o};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}};
const SEGS=[['boardSeg','board'],['ruleSeg','rule'],['oppSeg','opp'],['aiSeg','ai']];
function pvSVG(n){const mk=(x,y,s,p)=>`<g transform="translate(${x},${y}) scale(${s/100})">${MARK[p]}</g>`.replace(/<svg[^>]*>|<\/svg>/g,'');
  if(n==='mega'){let s='';for(let i=1;i<3;i++)s+=`<path d="M${i*33.3},2 V98 M2,${i*33.3} H98" stroke="#b9b3dc" stroke-width="2.4"/>`;
    for(let b=0;b<9;b++){const bx=(b%3)*33.3,by=Math.floor(b/3)*33.3;for(let i=1;i<3;i++)s+=`<path d="M${bx+4+i*8.4},${by+4} V${by+29} M${bx+4},${by+4+i*8.4} H${bx+29}" stroke="#c9d2de" stroke-width="1"/>`;}
    s+=mk(2,2,30,0)+mk(35,35,30,1)+mk(70,4,8,1)+mk(40,70,8,0)+mk(74,72,8,1);return `<svg viewBox="0 0 100 100">${s}</svg>`;}
  n=+n;const c=96/n;let s='';for(let i=1;i<n;i++)s+=`<path d="M${2+i*c},2 V98 M2,${2+i*c} H98" stroke="#c9d2de" stroke-width="2"/>`;
  const pts=n===3?[[0,0,0],[2,0,1],[1,1,0],[0,2,1],[2,2,0]]:[[1,1,0],[2,1,1],[1,2,1],[2,2,0],[3,3,0],[3,2,1]];pts.forEach(([x,y,p])=>s+=mk(2+x*c+c*.1,2+y*c+c*.1,c*.8,p));return `<svg viewBox="0 0 100 100">${s}</svg>`;}
function buildLobby(){document.querySelectorAll('.bpv').forEach(e=>e.innerHTML=pvSVG(e.dataset.n));
  SEGS.forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{cfg[k]=b.dataset.v;sync();}));
  [['ch1Seg','c1'],['ch2Seg','c2']].forEach(([id,k])=>{$(id).innerHTML=CHAR_KEYS.map(c=>`<button data-v="${c}"><img alt="" src="${charIcon(c)}"><small>${CHARS[c].name}</small></button>`).join('');
    $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{cfg[k]=b.dataset.v;sync();});});sync();}
function sync(){SEGS.forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on',b.dataset.v===cfg[k])));
  [['ch1Seg','c1'],['ch2Seg','c2']].forEach(([id,k])=>$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg[k])));
  $('ruleWrap').style.display=cfg.board==='3'?'':'none';$('aiWrap').style.display=cfg.opp==='ai'?'':'none';$('p2Lab').textContent=cfg.opp==='ai'?'컴퓨터':'두 번째 선수';
  $('heroTxt').innerHTML=heroText();save();}
function heroText(){if(cfg.board==='mega')return '큰 판 안에 작은 판이 9개! 작은 판에서 3개를 이으면 그 판을 차지해요. <b>내가 둔 칸 자리</b>가 상대가 다음에 둘 작은 판이 돼요. 작은 판 <b>3개를 한 줄로</b> 먼저 차지하면 이겨요!';
  if(cfg.board!=='3')return `번갈아 가며 ✖와 ⭕를 놓아요. ${cfg.board}×${cfg.board} 판에서 가로·세로·대각선으로 <b>4개를 먼저 이으면</b> 이겨요!`;
  return cfg.rule==='slide'?'말은 한 사람에 <b>3개까지</b>! 4번째를 놓으면 <b>가장 오래된 말이 사라져요</b>. 그래서 무승부가 없어요. 3개를 먼저 이으면 이겨요!':'번갈아 가며 ✖와 ⭕를 놓아요. 가로·세로·대각선으로 <b>3개를 먼저 이으면</b> 이겨요!';}

// ---------- 소리 ----------
let actx=null;const AC=()=>{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;};
function beep(f,d,type='sine',v=.12,when=0,f2){if(!cfg.sound)return;try{const a=AC();const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const sfx={put(p){beep(p?520:660,.08,'triangle',.12);beep(p?390:880,.06,'sine',.06,.05);},gone(){beep(500,.2,'sine',.07,0,200);},sub(){[660,880,1100].forEach((f,i)=>beep(f,.12,'triangle',.09,i*.06));},
  no(){beep(200,.14,'sawtooth',.05);},win(){[523,659,784,1047,1319].forEach((f,i)=>beep(f,.22,'triangle',.11,i*.12));},lose(){[440,392,330].forEach((f,i)=>beep(f,.25,'triangle',.09,i*.16));},draw(){[523,523,392].forEach((f,i)=>beep(f,.18,'triangle',.08,i*.15));}};

// ---------- 규칙 공통 ----------
const LINES3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function makeLines(N,K){const L=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const er=r+dr*(K-1),ec=c+dc*(K-1);if(er<0||er>=N||ec<0||ec>=N)continue;
  L.push(Array.from({length:K},(_,i)=>(r+dr*i)*N+c+dc*i));}return L;}
function lineWin(cells,lines){for(const l of lines){const p=cells[l[0]];if(p>=0&&l.every(i=>cells[i]===p))return {p,line:l};}return null;}
const win3=a=>lineWin(a,LINES3);

// ---------- 상태 ----------
let G=null,game={state:'off'},S=null;
const isAI=p=>cfg.opp==='ai'&&p===1;
const pname=p=>cfg.opp==='ai'?(p?`컴퓨터 ${CHARS[cfg.c2].name}`:CHARS[cfg.c1].name):`${p+1}번 ${CHARS[p?cfg.c2:cfg.c1].name}`;
function start(){$('lobby').classList.add('hide');$('game').classList.remove('hide');$('resultOv').classList.add('hide');
  G={score:[0,0],draws:0,round:0,starter:1};game.state='run';newRound();}
function newRound(){$('resultOv').classList.add('hide');G.round++;G.starter=1-G.starter;
  if(cfg.board==='mega')S={type:'mega',cells:Array.from({length:9},()=>Array(9).fill(-1)),sw:Array(9).fill(-1),active:-1,cur:G.starter,over:false,last:null};
  else{const N=+cfg.board,K=N===3?3:4;S={type:'std',N,K,lines:makeLines(N,K),cells:Array(N*N).fill(-1),q:[[],[]],slide:N===3&&cfg.rule==='slide',cur:G.starter,over:false,last:-1};}
  game.state='run';layout();render(true);setGuide(!$('guide').classList.contains('min'));
  $('rndT').textContent=`${G.round}판`;$('rndS').textContent=cfg.board==='mega'?'메가 틱택토':`${S.N}×${S.N} · ${S.K}개 잇기${S.slide?' · 무승부 없이':''}`;
  toast(`${pname(S.cur)} 먼저!`,'');maybeAI();}

// ---------- 화면 ----------
let BS=400;
function layout(){const m=$('mainArea'),r=m.getBoundingClientRect();const W=r.width-28,H=r.height-24;const port=H>W*1.02;m.classList.toggle('port',port);
  if(port){BS=Math.min(W,H-110);}else{const cw=clamp(W*.17,150,230);BS=Math.min(H-30,W-cw*2-60);}BS=Math.max(220,Math.floor(BS));
  const tb=$('tboard');tb.style.setProperty('--bs',BS+'px');tb.style.width=BS+'px';tb.style.height=BS+'px';$('bwrap').style.setProperty('--bs',BS+'px');}
addEventListener('resize',()=>{if(game.state!=='off'&&S){layout();render();}});
function cards(){for(const p of [0,1]){const el=$('pc'+p);const ch=p?cfg.c2:cfg.c1;
  el.innerHTML=`<img class="pimg" alt="" src="${charIcon(ch)}"><div><div class="pn"><img src="${markURL(p)}" style="width:1.1em">${pname(p)}</div><div class="ps">${G.score[p]}</div><div class="pl">승 · 무승부 ${G.draws}</div><div class="think" id="th${p}"></div></div>`;
  el.classList.toggle('turn',!S.over&&S.cur===p);}
  $('turnTag').textContent=S.over?'끝!':`${pname(S.cur)} 차례`;$('turnTag').style.background=S.cur?'#f2a39a':'#8fb0ee';}
function cellHTML(v,cls,data){return `<div class="cellT ${cls}" ${data}>${v>=0?MARK[v]:''}</div>`;}
function render(){const tb=$('tboard');cards();
  if(S.type==='std'){const N=S.N;const old=S.slide&&S.q[S.cur].length===3?S.q[S.cur][0]:-1;let h=`<div class="grid3" style="grid-template-columns:repeat(${N},1fr);grid-template-rows:repeat(${N},1fr);width:100%;height:100%">`;
    for(let i=0;i<N*N;i++){const v=S.cells[i];h+=cellHTML(v,`${i%N===N-1?'lc':''} ${Math.floor(i/N)===N-1?'lr':''} ${v>=0?'full':''} ${i===old&&!S.over?'old':''} ${S.winLine&&S.winLine.includes(i)?'win':''}`,`data-i="${i}"`);}
    tb.innerHTML=h+'</div>';if(S.last>=0){const s=tb.querySelector(`[data-i="${S.last}"] svg`);s&&s.classList.add('put');S.last=-1;}
    if(S.winLine)drawWinLine(S.winLine.map(i=>[i%N,Math.floor(i/N)]),N);}
  else{let h='<div class="mega">';const free=S.active<0||S.sw[S.active]!==-1;
    for(let b=0;b<9;b++){const open=S.sw[b]===-1,act=!S.over&&open&&(free||S.active===b);
      h+=`<div class="sub ${b%3===2?'lc':''} ${b>5?'lr':''} ${act?'act':''} ${open?'':'done'}"><div class="grid3" style="grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)">`;
      for(let c=0;c<9;c++){const v=S.cells[b][c];h+=cellHTML(v,`${c%3===2?'lc':''} ${c>5?'lr':''} ${v>=0||!act?'full lock':''} ${S.winLine&&S.winLine.includes(b)&&S.subLines[b]&&S.subLines[b].includes(c)?'win':''}`,`data-b="${b}" data-c="${c}"`);}
      h+=`</div>${S.sw[b]===0||S.sw[b]===1?`<div class="big">${MARK[S.sw[b]]}</div>`:S.sw[b]===2?'<div class="big" style="font-size:calc(var(--bs)*.08);color:#8a97b4;font-weight:900">무</div>':''}</div>`;}
    tb.innerHTML=h+'</div>';if(S.last){const s=tb.querySelector(`[data-b="${S.last[0]}"][data-c="${S.last[1]}"] svg`);s&&s.classList.add('put');S.last=null;}
    if(S.winLine)drawWinLine(S.winLine.map(b=>[b%3,Math.floor(b/3)]),3);}}
function drawWinLine(pts,N){const pad=BS*.04,inner=BS-pad*2,c=inner/N;const P=pts.map(([x,y])=>[pad+(x+.5)*c,pad+(y+.5)*c]);const a=P[0],b=P[P.length-1];
  const d=document.createElement('div');d.innerHTML=`<svg class="winLine" viewBox="0 0 ${BS} ${BS}"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:${S.winner?'#f2938a':'#7f9fe0'}"/></svg>`;$('tboard').appendChild(d.firstChild);}

// ---------- 두기 ----------
$('tboard').addEventListener('click',e=>{if(game.state!=='run'||S.over||isAI(S.cur)||S.busy)return;const el=e.target.closest('.cellT');if(!el)return;
  if(S.type==='std'){const i=+el.dataset.i;if(S.cells[i]>=0){sfx.no();return;}playStd(i);}
  else{const b=+el.dataset.b,c=+el.dataset.c;if(!megaLegal(S,b,c)){sfx.no();if(S.active>=0&&S.sw[S.active]===-1&&b!==S.active)toast('주황색 판에 두어요','상대가 둔 칸 자리의 판이에요');return;}playMega(b,c);}});
function playStd(i){const p=S.cur;
  if(S.slide&&S.q[p].length===3){const o=S.q[p].shift();const el=$('tboard').querySelector(`[data-i="${o}"] svg`);S.cells[o]=-1;if(el){el.classList.add('gone');sfx.gone();}}
  S.cells[i]=p;S.q[p].push(i);S.last=i;sfx.put(p);
  const w=lineWin(S.cells,S.lines);if(w){S.winLine=w.line;S.winner=p;endRound(p);return;}
  if(!S.cells.includes(-1)){endRound(-1);return;}
  S.cur=1-p;setTimeout(()=>{render();maybeAI();},S.slide?330:0);}
function megaLegal(st,b,c){if(st.sw[b]!==-1||st.cells[b][c]>=0)return false;const free=st.active<0||st.sw[st.active]!==-1;return free||b===st.active;}
function subState(arr){const w=win3(arr);return w?w.p:(arr.includes(-1)?-1:2);}
function playMega(b,c){const p=S.cur;S.cells[b][c]=p;S.last=[b,c];sfx.put(p);
  const st=subState(S.cells[b]);if(st!==-1){S.sw[b]=st;if(st<2){sfx.sub();S.subLines=S.subLines||{};}}
  S.active=c;const mw=lineWin(S.sw.map(v=>v<2?v:-1),LINES3);
  if(mw){S.winLine=mw.line;S.subLines={};mw.line.forEach(bb=>{const w=win3(S.cells[bb]);if(w)S.subLines[bb]=w.line;});S.winner=p;endRound(p);return;}
  if(S.sw.every(v=>v!==-1)){const cnt=[0,1].map(q=>S.sw.filter(v=>v===q).length);endRound(cnt[0]===cnt[1]?-1:cnt[0]>cnt[1]?0:1,true);return;}
  S.cur=1-p;render();maybeAI();}

// ---------- 컴퓨터 ----------
function maybeAI(){if(!isAI(S.cur)||S.over)return;S.busy=true;const th=$('th1');if(th)th.textContent='생각 중…';
  setTimeout(()=>{if(game.state!=='run'||S.over){S.busy=false;return;}const mv=S.type==='mega'?aiMega():aiStd();S.busy=false;if(S.type==='mega')playMega(mv[0],mv[1]);else playStd(mv);},rnd(450,800));}
function aiStd(){const lv=cfg.ai,me=1,op=0,empt=S.cells.map((v,i)=>v<0?i:-1).filter(i=>i>=0);
  const tryWin=(p)=>{for(const i of empt){const c=S.cells.slice(),q=[S.q[0].slice(),S.q[1].slice()];if(S.slide&&q[p].length===3)c[q[p][0]]=-1;c[i]=p;if(lineWin(c,S.lines))return i;}return -1;};
  if(lv==='easy'){if(Math.random()<.5){const w=tryWin(me);if(w>=0)return w;}if(Math.random()<.35){const b=tryWin(op);if(b>=0)return b;}return pick(empt);}
  const w=tryWin(me);if(w>=0)return w;
  if(S.N===3){const depth=S.slide?(lv==='hard'?7:3):(lv==='hard'?9:2);const blk=tryWin(op);if(lv==='normal'&&blk>=0&&Math.random()<.9)return blk;
    let best=-1e9,bm=[];for(const i of shuffle(empt)){const v=mmStd(S.cells,[S.q[0].slice(),S.q[1].slice()],i,me,depth,-1e9,1e9);if(v>best){best=v;bm=[i];}else if(v===best)bm.push(i);}
    if(lv==='normal'&&Math.random()<.25)return pick(empt);return S.cells[4]<0&&bm.includes(4)?4:pick(bm);}
  return heurStd(lv);}
function mmStd(cells,q,mv,p,depth,a,b){const c=cells.slice(),qq=[q[0].slice(),q[1].slice()];if(S.slide&&qq[p].length===3)c[qq[p].shift()]=-1;c[mv]=p;qq[p].push(mv);
  if(lineWin(c,S.lines))return p===1?100+depth:-100-depth;const em=c.map((v,i)=>v<0?i:-1).filter(i=>i>=0);if(!em.length||depth<=0)return 0;
  const np=1-p;if(np===1){let v=-1e9;for(const i of em){v=Math.max(v,mmStd(c,qq,i,np,depth-1,a,b));a=Math.max(a,v);if(a>=b)break;}return v;}
  let v=1e9;for(const i of em){v=Math.min(v,mmStd(c,qq,i,np,depth-1,a,b));b=Math.min(b,v);if(a>=b)break;}return v;}
function heurStd(lv){const N=S.N,me=1,op=0,cells=S.cells;const empt=cells.map((v,i)=>v<0?i:-1).filter(i=>i>=0);
  const near=empt.filter(i=>{const r=Math.floor(i/N),c=i%N;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N&&cells[rr*N+cc]>=0)return true;}return false;});
  const cand=near.length?near:empt;const W=[1,8,60,700],D=[0,5,45,500];
  const wins=p=>cand.filter(i=>{const c=cells.slice();c[i]=p;return lineWin(c,S.lines);});
  const bl=wins(op);if(bl.length&&(lv==='hard'||Math.random()<.85))return bl[0];
  let best=-1,bm=cand[0];const center=(N-1)/2;
  for(const i of cand){let s=0;for(const l of S.lines){if(!l.includes(i))continue;let m=0,o=0;l.forEach(j=>{if(cells[j]===me)m++;else if(cells[j]===op)o++;});if(!o)s+=W[m];if(!m)s+=D[o]*(lv==='hard'?1.1:.8);}
    const r=Math.floor(i/N),c=i%N;s+=3-(Math.abs(r-center)+Math.abs(c-center))*.5;s+=Math.random()*(lv==='hard'?2:12);if(s>best){best=s;bm=i;}}
  return bm;}
function aiMega(){const lv=cfg.ai,me=1,op=0;const moves=[];for(let b=0;b<9;b++)for(let c=0;c<9;c++)if(megaLegal(S,b,c))moves.push([b,c]);
  if(lv==='easy'&&Math.random()<.6)return pick(moves);
  const canWinSub=(arr,p)=>{for(let c=0;c<9;c++)if(arr[c]<0){const a=arr.slice();a[c]=p;if(win3(a))return true;}return false;};
  const metaWinIf=(b,p)=>{const sw=S.sw.slice();sw[b]=p;return !!lineWin(sw.map(v=>v<2?v:-1),LINES3);};
  let best=-1e9,bm=moves[0];
  for(const [b,c] of moves){let s=Math.random()*(lv==='hard'?2:10);const a=S.cells[b].slice();a[c]=me;
    if(win3(a)){s+=100;if(metaWinIf(b,me))s+=10000;}
    const a2=S.cells[b].slice();a2[c]=op;if(win3(a2)){s+=60;if(metaWinIf(b,op))s+=lv==='hard'?5000:800;}
    // 상대를 보내는 판
    const nsw=S.sw.slice();const st=subState(a);if(st!==-1)nsw[b]=st;const t=c;
    if(nsw[t]!==-1)s-=lv==='hard'?45:25;else{const ta=t===b?a:S.cells[t];if(canWinSub(ta,op)){s-=70;const sw2=nsw.slice();sw2[t]=op;if(lineWin(sw2.map(v=>v<2?v:-1),LINES3))s-=4000;}}
    if(c===4)s+=3;else if(c%2===0)s+=1;if(b===4)s+=2;
    if(s>best){best=s;bm=[b,c];}}
  return bm;}

// ---------- 끝 ----------
function endRound(w,byCount){S.over=true;game.state='end';if(w>=0)G.score[w]++;else G.draws++;render();
  const vsAI=cfg.opp==='ai';let title,info;
  if(w<0){title='무승부!';info=byCount?'차지한 판의 수가 같아요':'판이 꽉 찼어요. 다시 겨뤄 봐요!';sfx.draw();}
  else if(vsAI){title=w===0?'🎉 이겼어요!':'아쉽게 졌어요!';info=w===0?`${pname(0)}가 한 줄을 먼저 만들었어요`:'컴퓨터가 먼저 한 줄을 만들었어요. 다시 도전!';w===0?(sfx.win(),confetti()):sfx.lose();}
  else{title=`🎉 ${pname(w)} 승리!`;info=byCount?'작은 판을 더 많이 차지했어요':'한 줄을 먼저 만들었어요';sfx.win();confetti();}
  $('resChar').innerHTML=w<0?`<img src="${charIcon(cfg.c1)}"><img src="${charIcon(cfg.c2)}">`:`<img src="${charIcon(w?cfg.c2:cfg.c1)}">`;
  $('resTitle').textContent=title;$('resInfo').textContent=`${info} · 점수 ${G.score[0]} : ${G.score[1]} (무승부 ${G.draws})`;
  setTimeout(()=>$('resultOv').classList.remove('hide'),1100);
  const detail={type:'tyranomath:tictactoe-round',board:cfg.board,winner:w,score:G.score};try{if(window.parent!==window)window.parent.postMessage(detail,'*');}catch(e){}}
function toast(big,small){const t=$('toast');t.innerHTML=big+(small?`<small>${small}</small>`:'');t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1300);}
function confetti(){const cols=['#b9d0ff','#ffc4b8','#ffe7a3','#bdeccf','#d9c9ff'];
  for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(2,98)+'vw';c.style.background=pick(cols);
    c.style.setProperty('--fy',innerHeight*rnd(.8,1.1)+'px');c.style.animationDelay=rnd(0,.5)+'s';c.style.borderRadius=Math.random()<.4?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),2300);}}
function setGuide(open){$('guide').classList.toggle('min',!open);$('helpBtn').classList.toggle('on',open);
  $('guideTxt').innerHTML=heroText().split(/(?<=[.!])\s+/).map(t=>`<span>${t}</span>`).join('');if(game.state!=='off'&&S){layout();render();}}
$('helpBtn').onclick=()=>setGuide($('guide').classList.contains('min'));$('guideBtn').onclick=()=>setGuide(false);

$('homeYes').onclick=toLobby;$('homeNo').onclick=()=>$('homeOv').classList.add('hide');
const syncSound=()=>{$('soundBtn').innerHTML=(cfg.sound?'🔊':'🔇')+'<small>소리</small>';};
$('soundBtn').onclick=()=>{cfg.sound=!cfg.sound;syncSound();save();};syncSound();
const root=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
document.querySelectorAll('.fsBtn').forEach(b=>{if(!fsOK){b.style.display='none';return;}
  b.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);}catch(e){}};});

try{if(window.top===window)$('zoneBtn').hidden=false;}catch(e){}

if(/[?&]test/.test(location.search))window.__t={get S(){return S},get G(){return G},megaLegal,get state(){return game.state}};
